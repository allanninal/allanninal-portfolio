[project]
name = "media-perception-reality"
version = "1.0.0"
description = "Data Engineering Portfolio: Analyzing media coverage vs actual causes of death"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Allan Ninal"}
]
keywords = ["data-engineering", "data-analysis", "portfolio", "duckdb", "streamlit"]

dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "altair>=5.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "great-expectations>=0.18.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
