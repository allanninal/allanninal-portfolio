<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aldermann Type — a typeface is 502 glyphs">
  <rect width="1200" height="630" fill="#15130F"/>
  <text x="80" y="196" font-family="Georgia, Times New Roman, serif" font-size="112" fill="#F4F1E9" letter-spacing="-2">A typeface is</text>
  <text x="80" y="316" font-family="Georgia, Times New Roman, serif" font-size="112" fill="#58D7E0" letter-spacing="-2">502 glyphs.</text>
  <text x="80" y="372" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#ABA598" letter-spacing="3">ALDERMANN TYPE &#183; PROVIDENCE, RI</text>

  <g font-family="Georgia, Times New Roman, serif" font-size="66" fill="#F4F1E9">
    <text x="80"  y="486">&#537;</text>
    <text x="170" y="486">&#322;</text>
    <text x="250" y="486">&#7871;</text>
    <text x="340" y="486">&#64257;</text>
    <text x="430" y="486">&#304;</text>
    <text x="510" y="486">&#171;&#187;</text>
    <text x="640" y="486">&#191;</text>
    <text x="710" y="486">&#8211;&#8212;</text>
    <text x="860" y="486">&#189;</text>
  </g>
  <line x1="80" y1="518" x2="1120" y2="518" stroke="#767164" stroke-width="1"/>
  <text x="80" y="560" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#ABA598">NINE OF THESE ARE ON NOBODY&#8217;S SPECIMEN.</text>
  <text x="80" y="596" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#E8B44A">THREE LANGUAGES HERE ARE ONLY PARTLY SUPPORTED, AND WE SAY WHICH CHARACTERS.</text>
</svg>
