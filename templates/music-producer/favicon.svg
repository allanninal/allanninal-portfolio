<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Roan Whitfield">
  <rect width="64" height="64" fill="#131518"/>
  <!-- Four faders at four heights: the four jobs, at different levels on
       different records. Not a musical note. -->
  <g stroke="#667278" stroke-width="3" stroke-linecap="round">
    <path d="M14 10v44"/><path d="M28 10v44"/><path d="M42 10v44"/><path d="M56 10v44"/>
  </g>
  <g fill="#2EB8A5">
    <rect x="8" y="20" width="12" height="7" rx="2"/>
    <rect x="22" y="30" width="12" height="7" rx="2"/>
    <rect x="36" y="16" width="12" height="7" rx="2"/>
    <rect x="50" y="40" width="12" height="7" rx="2"/>
  </g>
</svg>
