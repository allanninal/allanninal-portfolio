<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Marit Halvorsen — the rules are for the people who aren't me">
  <rect width="1200" height="630" fill="#111112"/>
  <text x="80" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="88" fill="#F2F0EC" letter-spacing="-3">The rules are for</text>
  <text x="80" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="88" fill="#C9C3B6" letter-spacing="-3">the people who</text>
  <text x="80" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="88" fill="#C9C3B6" letter-spacing="-3">aren&#8217;t me.</text>
  <text x="80" y="424" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#A29E96" letter-spacing="3">MARIT HALVORSEN &#183; BRAND DESIGNER &#183; PORTLAND, MAINE</text>

  <line x1="80" y1="466" x2="1120" y2="466" stroke="#726E67" stroke-width="1"/>
  <text x="80"  y="514" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#A29E96">TEN RULES</text>
  <text x="80"  y="548" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#F2F0EC">2,566 APPLICATIONS</text>
  <text x="560" y="514" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#A29E96">EIGHTEEN MONTHS LATER</text>
  <text x="560" y="548" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#F2F0EC">2 REWRITTEN</text>
  <text x="880" y="548" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#F2F0EC" text-decoration="line-through">2 DELETED</text>
  <text x="80"  y="596" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#A29E96">BOTH OF THE DELETED ONES WERE MINE.</text>
</svg>
