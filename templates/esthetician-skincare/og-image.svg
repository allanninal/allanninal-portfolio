<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: blush ivory -->
  <rect width="1200" height="630" fill="#FDF8F4"/>

  <!-- Forest green left panel -->
  <rect x="0" y="0" width="420" height="630" fill="#2D5016"/>

  <!-- Decorative leaf/botanical shape -->
  <ellipse cx="210" cy="315" rx="130" ry="200" fill="none" stroke="#3D6B1E" stroke-width="2" opacity="0.4"/>
  <ellipse cx="210" cy="315" rx="80" ry="145" fill="none" stroke="#3D6B1E" stroke-width="1.5" opacity="0.3"/>

  <!-- Logo mark circle -->
  <circle cx="210" cy="160" r="44" fill="none" stroke="rgba(253,248,244,0.3)" stroke-width="1.5"/>
  <text x="210" y="172" font-family="Georgia, serif" font-size="26" fill="#FDF8F4" text-anchor="middle" font-weight="400">SR</text>

  <!-- Business name on green panel -->
  <text x="210" y="240" font-family="Georgia, serif" font-size="22" fill="rgba(253,248,244,0.95)" text-anchor="middle" font-weight="400">Sofía Reyes Skincare</text>
  <text x="210" y="268" font-family="system-ui, sans-serif" font-size="13" fill="rgba(240,229,220,0.7)" text-anchor="middle" letter-spacing="2">LICENSED ESTHETICIAN</text>

  <!-- Clay decorative bar -->
  <rect x="150" y="290" width="120" height="2" fill="#C2705A" opacity="0.6"/>

  <!-- Location text -->
  <text x="210" y="325" font-family="system-ui, sans-serif" font-size="13" fill="rgba(240,229,220,0.65)" text-anchor="middle" letter-spacing="1">DENVER, CO · CHERRY CREEK</text>

  <!-- Main headline area on ivory side -->
  <text x="560" y="200" font-family="Georgia, serif" font-size="52" fill="#1A0F0A" text-anchor="middle" font-weight="400">Skincare that</text>
  <text x="560" y="268" font-family="Georgia, serif" font-size="52" fill="#2D5016" text-anchor="middle" font-style="italic" font-weight="400">visibly transforms.</text>

  <!-- Tagline -->
  <text x="560" y="330" font-family="system-ui, sans-serif" font-size="18" fill="#5C3D2E" text-anchor="middle">Medical-grade facials · Chemical peels</text>
  <text x="560" y="358" font-family="system-ui, sans-serif" font-size="18" fill="#5C3D2E" text-anchor="middle">Microneedling · Dermaplaning · LED Therapy</text>

  <!-- Credential badges -->
  <rect x="430" y="395" width="180" height="32" rx="16" fill="#EDF3E6" stroke="rgba(45,80,22,0.2)" stroke-width="1"/>
  <text x="520" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#2D5016" text-anchor="middle" font-weight="600">CO State Licensed</text>

  <rect x="630" y="395" width="180" height="32" rx="16" fill="#EDF3E6" stroke="rgba(45,80,22,0.2)" stroke-width="1"/>
  <text x="720" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#2D5016" text-anchor="middle" font-weight="600">CIDESCO Certified</text>

  <!-- CTA button -->
  <rect x="470" y="455" width="180" height="46" rx="8" fill="#2D5016"/>
  <text x="560" y="483" font-family="system-ui, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Book a Treatment</text>

  <!-- URL watermark -->
  <text x="560" y="580" font-family="system-ui, sans-serif" font-size="13" fill="#7A5142" text-anchor="middle" opacity="0.7">templates.allanninal.dev/esthetician-skincare/</text>
</svg>
