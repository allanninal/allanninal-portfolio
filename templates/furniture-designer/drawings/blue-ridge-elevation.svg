<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="drawing-title drawing-desc">
  <title id="drawing-title">Blue Ridge Dining Table — front and side elevation, scale 1:12</title>
  <desc id="drawing-desc">A technical shop drawing of the Blue Ridge Dining Table in solid white oak: a front elevation 84 inches wide by 30 inches tall, and a side elevation 42 inches deep by 30 inches tall, with dimension lines for overall length, depth, height and apron clearance, and marks showing the breadboard-end seams near each end of the top.</desc>

  <rect x="0" y="0" width="960" height="400" fill="#FFFFFF" />

  <!-- ============ FRONT ELEVATION ============ -->
  <g font-family="IBM Plex Sans, ui-sans-serif, sans-serif">
    <!-- top -->
    <rect x="70" y="50" width="504" height="9" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <!-- breadboard-end seams -->
    <line x1="110" y1="50" x2="110" y2="98" stroke="#1C1B18" stroke-width="1.25" stroke-dasharray="4 3" />
    <line x1="534" y1="50" x2="534" y2="98" stroke="#1C1B18" stroke-width="1.25" stroke-dasharray="4 3" />
    <!-- apron -->
    <rect x="88" y="59" width="468" height="30" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <!-- legs -->
    <rect x="88" y="89" width="14" height="141" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <rect x="542" y="89" width="14" height="141" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />

    <!-- overall length dimension -->
    <g stroke="#C1442D" stroke-width="1.25" fill="#C1442D">
      <line x1="70" y1="230" x2="70" y2="250" />
      <line x1="574" y1="230" x2="574" y2="250" />
      <line x1="70" y1="244" x2="574" y2="244" />
      <polygon points="70,244 79,240 79,248" />
      <polygon points="574,244 565,240 565,248" />
    </g>
    <text x="322" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#C1442D">84&#8243; (108&#8243; W/ 2 LEAVES)</text>

    <!-- overall height dimension -->
    <g stroke="#C1442D" stroke-width="1.25" fill="#C1442D">
      <line x1="45" y1="50" x2="60" y2="50" />
      <line x1="45" y1="230" x2="60" y2="230" />
      <line x1="52" y1="50" x2="52" y2="230" />
      <polygon points="52,50 48,59 56,59" />
      <polygon points="52,230 48,221 56,221" />
    </g>
    <text x="34" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#C1442D" transform="rotate(-90 34 140)">30&#8243;</text>

    <!-- apron clearance dimension -->
    <g stroke="#C1442D" stroke-width="1.25" fill="#C1442D">
      <line x1="574" y1="89" x2="605" y2="89" />
      <line x1="574" y1="230" x2="605" y2="230" />
      <line x1="598" y1="89" x2="598" y2="230" />
      <polygon points="598,89 594,98 602,98" />
      <polygon points="598,230 594,221 602,221" />
    </g>
    <text x="614" y="160" font-size="11" font-weight="700" fill="#C1442D" transform="rotate(-90 614 160)">26.5&#8243; APRON CLEARANCE</text>

    <text x="322" y="266" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#1C1B18">FRONT ELEVATION</text>
  </g>

  <!-- ============ SIDE ELEVATION ============ -->
  <g font-family="IBM Plex Sans, ui-sans-serif, sans-serif">
    <rect x="650" y="50" width="252" height="9" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <rect x="668" y="59" width="216" height="30" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <rect x="668" y="89" width="14" height="141" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />
    <rect x="870" y="89" width="14" height="141" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2" />

    <g stroke="#C1442D" stroke-width="1.25" fill="#C1442D">
      <line x1="650" y1="230" x2="650" y2="250" />
      <line x1="902" y1="230" x2="902" y2="250" />
      <line x1="650" y1="244" x2="902" y2="244" />
      <polygon points="650,244 659,240 659,248" />
      <polygon points="902,244 893,240 893,248" />
    </g>
    <text x="776" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#C1442D">42&#8243;</text>

    <text x="776" y="266" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#1C1B18">SIDE ELEVATION</text>
  </g>

  <!-- ============ TITLE BLOCK ============ -->
  <g font-family="IBM Plex Sans, ui-sans-serif, sans-serif">
    <line x1="70" y1="300" x2="902" y2="300" stroke="#1C1B18" stroke-width="1" />
    <text x="70" y="322" font-family="Libre Caslon Text, Georgia, serif" font-size="20" font-weight="700" fill="#1C1B18">The Blue Ridge Dining Table</text>
    <text x="70" y="344" font-size="13" fill="#1C1B18">Okafor Furniture Co. &#8212; Adaeze Okafor &#8212; Asheville, NC</text>
    <text x="70" y="364" font-size="13" fill="#5C5650">Solid white oak &#183; breadboard ends &#183; scale 1:12</text>
    <text x="902" y="344" text-anchor="end" font-size="12" fill="#5C5650">Sheet 1 of 1</text>
    <text x="902" y="364" text-anchor="end" font-size="12" fill="#5C5650">Shop drawing &#8212; commission demonstration</text>
  </g>
</svg>
