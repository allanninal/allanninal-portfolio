    <rect x="0" y="0" width="300" height="12" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2"/>
    <rect x="14" y="12" width="272" height="24" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2"/>
    <rect x="14" y="36" width="14" height="90" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2"/>
    <rect x="272" y="36" width="14" height="90" fill="#FFFFFF" stroke="#1C1B18" stroke-width="2"/>
    <g stroke="#C1442D" stroke-width="2" fill="#C1442D">
      <line x1="0" y1="150" x2="300" y2="150"/>
      <line x1="0" y1="126" x2="0" y2="150"/>
      <line x1="300" y1="126" x2="300" y2="150"/>
      <polygon points="0,144 9,140 9,148"/>
