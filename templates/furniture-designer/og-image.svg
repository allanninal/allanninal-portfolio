  <text x="80" y="150" font-family="'Azeret Mono', ui-monospace, monospace" font-size="21" font-weight="700" fill="#A53A27" letter-spacing="3">OKAFOR FURNITURE CO.</text>

  <text x="80" y="260" font-family="'Libre Caslon Text', Georgia, serif" font-size="52" font-weight="700" fill="#1C1B18">A cut list is arithmetic</text>
  <text x="80" y="325" font-family="'Libre Caslon Text', Georgia, serif" font-size="52" font-weight="700" fill="#1C1B18">that hasn&#8217;t happened</text>
  <text x="80" y="390" font-family="'Libre Caslon Text', Georgia, serif" font-size="52" font-weight="700" fill="#1C1B18">to the wood yet.</text>

  <text x="80" y="440" font-family="'Azeret Mono', ui-monospace, monospace" font-size="20" fill="#5C5650">The shop drawing, cut list and wood-movement math behind a commission.</text>

