<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F2"/>
      <stop offset="100%" stop-color="#EDECE8"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6E3F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1B6E3F" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Mountain geometry (right side) -->
  <polygon points="800,60 1160,600 440,600" fill="#1B6E3F" opacity="0.07"/>
  <polygon points="900,160 1120,600 680,600" fill="#1B6E3F" opacity="0.05"/>

  <!-- Climbing hold dots -->
  <circle cx="870" cy="200" r="18" fill="#2D9E5B" opacity="0.20"/>
  <circle cx="950" cy="290" r="15" fill="#2B7AB0" opacity="0.20"/>
  <circle cx="910" cy="380" r="16" fill="#C2540A" opacity="0.18"/>
  <circle cx="990" cy="460" r="14" fill="#B81414" opacity="0.15"/>
  <circle cx="1020" cy="160" r="12" fill="#6B3EA8" opacity="0.18"/>

  <!-- Rope line -->
  <line x1="160" y1="0" x2="120" y2="630" stroke="#1B6E3F" stroke-width="3" opacity="0.15" stroke-dasharray="16,10"/>

  <!-- Accent bar (left) -->
  <rect x="0" y="0" width="8" height="630" fill="#1B6E3F"/>

  <!-- Content area -->
  <!-- Eyebrow -->
  <text x="80" y="140" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#6B4A1F" text-transform="uppercase">DAY 66 OF 365 · INDOOR CLIMBING GYM</text>

  <!-- Main heading -->
  <text x="80" y="260" font-family="system-ui, sans-serif" font-size="88" font-weight="800" fill="#1C1C19" letter-spacing="-1">Summit Climb</text>
  <text x="80" y="355" font-family="system-ui, sans-serif" font-size="88" font-weight="800" fill="#1B6E3F" letter-spacing="-1">Boulder</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="32" font-weight="400" fill="#5C5A52">V0 to V12 · 5.5 to 5.14 · Day Passes from $22</text>

  <!-- Bottom strip -->
  <rect x="0" y="560" width="1200" height="70" fill="#1B6E3F"/>
  <text x="80" y="603" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="2">BOULDERING · TOP-ROPE · LEAD · AUTO-BELAY · CERTIFIED COACHING · BOULDER, CO</text>
</svg>
