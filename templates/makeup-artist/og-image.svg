<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background: deep plum gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31104A"/>
      <stop offset="100%" stop-color="#4A1860"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A46A"/>
      <stop offset="100%" stop-color="#E8C88A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative gold corner accents -->
  <rect x="0" y="0" width="300" height="2" fill="url(#gold)"/>
  <rect x="0" y="0" width="2" height="300" fill="url(#gold)"/>
  <rect x="900" y="628" width="300" height="2" fill="url(#gold)"/>
  <rect x="1198" y="330" width="2" height="300" fill="url(#gold)"/>

  <!-- Makeup brush icon -->
  <g transform="translate(80, 200)">
    <rect x="18" y="0" width="8" height="90" rx="4" fill="#C8A46A"/>
    <ellipse cx="22" cy="112" rx="18" ry="11" fill="white" opacity="0.9"/>
    <ellipse cx="22" cy="112" rx="12" ry="7" fill="white"/>
    <circle cx="40" cy="30" r="5" fill="#C8A46A" opacity="0.6"/>
  </g>

  <!-- Main text -->
  <text x="160" y="270" font-family="Georgia, serif" font-size="72" font-weight="600" fill="white" letter-spacing="-1">Camille Voss</text>
  <text x="161" y="345" font-family="Georgia, serif" font-size="38" font-weight="400" fill="#C8A46A" letter-spacing="2">Makeup Artist</text>

  <!-- Tagline -->
  <text x="161" y="410" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" letter-spacing="1">Bridal · Editorial · Special Occasion</text>
  <text x="161" y="445" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)">Los Angeles, CA · Available Worldwide</text>

  <!-- Day badge -->
  <rect x="161" y="490" width="200" height="40" rx="20" fill="rgba(200,164,106,0.2)" stroke="#C8A46A" stroke-width="1.5"/>
  <text x="261" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A46A" text-anchor="middle" letter-spacing="2">DAY 57 OF 365</text>

  <!-- Right side decorative element -->
  <rect x="820" y="80" width="1" height="470" fill="rgba(200,164,106,0.2)"/>
  <!-- Brush silhouettes -->
  <rect x="880" y="120" width="6" height="200" rx="3" fill="rgba(200,164,106,0.4)"/>
  <ellipse cx="883" cy="335" rx="24" ry="14" fill="rgba(255,255,255,0.15)"/>
  <rect x="940" y="180" width="5" height="160" rx="2.5" fill="rgba(200,164,106,0.25)"/>
  <ellipse cx="942" cy="354" rx="18" ry="10" fill="rgba(255,255,255,0.1)"/>
  <rect x="995" y="140" width="7" height="230" rx="3.5" fill="rgba(200,164,106,0.35)"/>
  <ellipse cx="998" cy="384" rx="28" ry="16" fill="rgba(255,255,255,0.12)"/>
  <rect x="1060" y="100" width="5" height="280" rx="2.5" fill="rgba(200,164,106,0.2)"/>
  <ellipse cx="1062" cy="394" rx="20" ry="12" fill="rgba(255,255,255,0.08)"/>

  <!-- Gold star accents -->
  <text x="870" y="80" font-size="16" fill="#C8A46A" opacity="0.7">★</text>
  <text x="1000" y="65" font-size="12" fill="#C8A46A" opacity="0.5">★</text>
  <text x="1100" y="90" font-size="20" fill="#C8A46A" opacity="0.6">★</text>
</svg>
