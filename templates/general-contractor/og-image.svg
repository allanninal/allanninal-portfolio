<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#20242E"/>
    </linearGradient>
    <pattern id="overrunHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A9A4F2" stroke-width="2.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Blueline accent rail -->
  <rect x="0" y="0" width="6" height="630" fill="#4038A6"/>

  <!-- Decorative: the same schedule figure the hero runs on. Planned in blueline,
       overrun hatched, rent commencement dashed. A photograph of a finished
       restaurant proves nothing; a schedule with the overrun drawn in does. -->
  <g stroke="#2C313D" stroke-width="1">
    <line x1="800" y1="72" x2="800" y2="520"/>
    <line x1="900" y1="72" x2="900" y2="520"/>
    <line x1="1000" y1="72" x2="1000" y2="520"/>
    <line x1="1100" y1="72" x2="1100" y2="520"/>
  </g>

  <rect x="760" y="96"  width="220" height="24" fill="#4038A6"/>
  <rect x="980" y="96"  width="16"  height="24" fill="url(#overrunHatch)"/>
  <rect x="980" y="96"  width="16"  height="24" fill="none" stroke="#A9A4F2" stroke-width="1.5"/>

  <rect x="760" y="156" width="298" height="24" fill="#4038A6"/>

  <rect x="760" y="216" width="162" height="24" fill="#4038A6"/>

  <rect x="760" y="276" width="248" height="24" fill="#4038A6"/>
  <rect x="1008" y="276" width="82" height="24" fill="url(#overrunHatch)"/>
  <rect x="1008" y="276" width="82" height="24" fill="none" stroke="#A9A4F2" stroke-width="1.5"/>

  <rect x="760" y="336" width="150" height="24" fill="#4038A6"/>
  <rect x="910" y="336" width="8"   height="24" fill="url(#overrunHatch)"/>

  <rect x="760" y="396" width="206" height="24" fill="#4038A6"/>
  <rect x="966" y="396" width="12"  height="24" fill="url(#overrunHatch)"/>

  <line x1="760" y1="80" x2="760" y2="470" stroke="#A9A4F2" stroke-width="2.4"/>
  <line x1="1008" y1="80" x2="1008" y2="470" stroke="#A8B0BD" stroke-width="1.6" stroke-dasharray="7 6"/>
  <path d="M1002,470 L1014,470 L1008,490 Z" fill="#A8B0BD"/>

  <!-- Logo mark: a drawing sheet with a title block -->
  <rect x="80" y="80" width="64" height="64" rx="10" fill="#262B38"/>
  <rect x="94" y="92" width="36" height="40" rx="1" fill="none" stroke="#A9A4F2" stroke-width="2.6"/>
  <line x1="94" y1="120" x2="130" y2="120" stroke="#A9A4F2" stroke-width="2"/>
  <line x1="116" y1="120" x2="116" y2="132" stroke="#A9A4F2" stroke-width="2"/>

  <!-- Business name -->
  <text x="80" y="224" font-family="Overpass, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#EDF0F4">Wingfield Build Co.</text>

  <!-- Tagline -->
  <text x="80" y="268" font-family="Libre Franklin, system-ui, sans-serif" font-size="21" font-weight="500" fill="#A8B0BD">Richmond Tenant Improvement — Every Date And Every Change Order Published</text>

  <!-- Space-type pills -->
  <rect x="80" y="306" width="128" height="38" rx="4" fill="#4038A6"/>
  <text x="144" y="331" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Restaurant</text>

  <rect x="220" y="306" width="112" height="38" rx="4" fill="none" stroke="#3A4150" stroke-width="1.5"/>
  <text x="276" y="331" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C6CCD7" text-anchor="middle">Medical</text>

  <rect x="344" y="306" width="98" height="38" rx="4" fill="none" stroke="#3A4150" stroke-width="1.5"/>
  <text x="393" y="331" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C6CCD7" text-anchor="middle">Office</text>

  <rect x="454" y="306" width="94" height="38" rx="4" fill="none" stroke="#3A4150" stroke-width="1.5"/>
  <text x="501" y="331" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C6CCD7" text-anchor="middle">Retail</text>

  <rect x="560" y="306" width="104" height="38" rx="4" fill="none" stroke="#3A4150" stroke-width="1.5"/>
  <text x="612" y="331" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="600" fill="#C6CCD7" text-anchor="middle">Studio</text>

  <!-- The hook, as a figure line -->
  <text x="80" y="392" font-family="Overpass Mono, ui-monospace, monospace" font-size="19" font-weight="500" fill="#A9A4F2">$412,000 → $431,600  ·  +4.8%  ·  four days late</text>

  <!-- Credential line -->
  <text x="80" y="428" font-family="Libre Franklin, system-ui, sans-serif" font-size="15" font-weight="500" fill="#A8B0BD">Virginia Class A Contractor, CIC specialty  ·  Bonded $4M  ·  1,000–8,000 sf fit-outs</text>

  <!-- Phone -->
  <text x="80" y="486" font-family="Overpass Mono, ui-monospace, monospace" font-size="34" font-weight="500" fill="#A9A4F2">(804) 555-0142</text>

  <line x1="80" y1="524" x2="1120" y2="524" stroke="#2C313D" stroke-width="1.5"/>

  <rect x="80" y="548" width="132" height="34" rx="4" fill="#4038A6"/>
  <text x="146" y="570" font-family="Libre Franklin, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 75 of 365</text>

  <text x="1120" y="571" font-family="Libre Franklin, system-ui, sans-serif" font-size="15" font-weight="500" fill="#A8B0BD" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
</svg>
