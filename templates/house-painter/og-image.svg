<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181A"/>
      <stop offset="100%" stop-color="#212427"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Eucalyptus accent rail -->
  <rect x="0" y="0" width="6" height="630" fill="#33564C"/>

  <!-- Decorative: the actual project paints as overlapping sample boards, which is
       the same idea the site hero runs on. Kept right of the type block. -->
  <rect x="752" y="96"  width="104" height="438" rx="6" fill="#E5C6B7" opacity="0.92"/>
  <rect x="864" y="140" width="104" height="394" rx="6" fill="#43474C" opacity="0.92"/>
  <rect x="976" y="72"  width="104" height="462" rx="6" fill="#C4C2B4" opacity="0.92"/>
  <rect x="808" y="330" width="104" height="204" rx="6" fill="#31403A" opacity="0.94"/>
  <rect x="920" y="384" width="104" height="150" rx="6" fill="#D5D2CB" opacity="0.94"/>
  <!-- A brushed edge, so the bands read as paint rather than as UI -->
  <path d="M752,146 C790,139 826,152 856,145" fill="none" stroke="#F0EEE9" stroke-width="3" opacity="0.30"/>
  <path d="M976,122 C1014,115 1050,128 1080,121" fill="none" stroke="#2B2A29" stroke-width="3" opacity="0.18"/>

  <!-- Logo mark: a half-painted swatch -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="#1E2124"/>
  <rect x="98" y="98" width="28" height="28" rx="3" fill="none" stroke="#9DBFB2" stroke-width="2.4"/>
  <path d="M98,126 L98,112 L126,98 L126,126 Z" fill="#9DBFB2" opacity="0.92"/>

  <!-- Business name -->
  <text x="80" y="224" font-family="Instrument Serif, Georgia, serif" font-size="62" font-weight="400" fill="#F4F3F0">Halden &amp; Co. Painters</text>

  <!-- Tagline -->
  <text x="80" y="270" font-family="Instrument Sans, system-ui, sans-serif" font-size="23" font-weight="500" fill="#A6AAAE">Providence Interior &amp; Exterior — Samples On Your Own Walls</text>

  <!-- Service pills -->
  <rect x="80" y="308" width="176" height="40" rx="20" fill="#33564C"/>
  <text x="168" y="334" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F3F0" text-anchor="middle">Colour Consultation</text>

  <rect x="268" y="308" width="156" height="40" rx="20" fill="none" stroke="#3B4044" stroke-width="1.5"/>
  <text x="346" y="334" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C7CACD" text-anchor="middle">Interior Painting</text>

  <rect x="436" y="308" width="158" height="40" rx="20" fill="none" stroke="#3B4044" stroke-width="1.5"/>
  <text x="515" y="334" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C7CACD" text-anchor="middle">Exterior Painting</text>

  <rect x="606" y="308" width="110" height="40" rx="20" fill="none" stroke="#3B4044" stroke-width="1.5"/>
  <text x="661" y="334" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C7CACD" text-anchor="middle">Cabinets</text>

  <!-- Credential line -->
  <text x="80" y="406" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="500" fill="#A6AAAE">RI Contractor Registration #48122  ·  Insured &amp; Bonded  ·  2-year workmanship warranty</text>

  <!-- Phone -->
  <text x="80" y="474" font-family="Instrument Serif, Georgia, serif" font-size="36" font-weight="400" fill="#9DBFB2">(401) 555-0164</text>

  <line x1="80" y1="524" x2="1120" y2="524" stroke="#2C3033" stroke-width="1.5"/>

  <rect x="80" y="548" width="132" height="34" rx="17" fill="#33564C"/>
  <text x="146" y="570" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F4F3F0" text-anchor="middle">Day 73 of 365</text>

  <text x="1120" y="571" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="500" fill="#868A8E" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
</svg>
