<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cascade Wash Co. — the plan pays at two or three washes a month, Tacoma Washington">
  <rect width="1200" height="630" fill="#AEB6BA"/>

  <!-- The tariff board. -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="620" y="96" width="508" height="392" fill="#E9EDEF"/>
    <rect x="620" y="96" width="508" height="46" fill="#0E1215"/>
    <g font-size="14" fill="#F1F4F5" letter-spacing="2" font-weight="bold">
      <text x="640" y="125">TIER</text><text x="820" y="125">SINGLE</text>
      <text x="920" y="125">MONTHLY</text><text x="1040" y="125">PLAN WINS</text>
    </g>

    <g font-size="21" fill="#0E1215" font-weight="bold">
      <text x="640" y="188">Basic</text><text x="640" y="258">Wheels</text>
      <text x="640" y="328">Shield</text><text x="640" y="398">The Works</text>
    </g>
    <g font-size="21" fill="#0E1215">
      <text x="820" y="188">$12</text><text x="820" y="258">$16</text>
      <text x="820" y="328">$21</text><text x="820" y="398">$26</text>
      <text x="920" y="188">$25</text><text x="920" y="258">$32</text>
      <text x="920" y="328">$39</text><text x="920" y="398">$45</text>
    </g>

    <g>
      <rect x="1020" y="166" width="90" height="34" fill="#F2C230"/>
      <rect x="1020" y="236" width="90" height="34" fill="#F2C230"/>
      <rect x="1020" y="306" width="90" height="34" fill="#F2C230"/>
      <rect x="1020" y="376" width="90" height="34" fill="#F2C230"/>
    </g>
    <g font-size="20" fill="#0E1215" font-weight="bold">
      <text x="1052" y="190">3</text><text x="1052" y="260">2</text>
      <text x="1052" y="330">2</text><text x="1052" y="400">2</text>
    </g>
    <g stroke="#4C555B" stroke-width="1"><path d="M620 212h508M620 282h508M620 352h508"/></g>
    <text x="640" y="452" font-size="15" fill="#2E3539">Washes per month. Below it, buy singles.</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="126" font-size="19" font-weight="bold" fill="#0E1215" letter-spacing="4">CASCADE WASH CO.</text>
    <text x="72" y="248" font-size="48" font-weight="bold" fill="#0E1215">The plan pays at</text>
    <text x="72" y="308" font-size="48" font-weight="bold" fill="#0E1215">two or three washes.</text>
    <text x="72" y="368" font-size="48" font-weight="bold" fill="#0E1215">Below that, singles.</text>
    <text x="72" y="428" font-size="22" fill="#2E3539">Tacoma, WA &#183; four-bay express tunnel</text>
    <text x="72" y="500" font-size="18" fill="#0E1215">Day 90 of 365 &#183; allanninal.dev/templates</text>
  </g>
</svg>
