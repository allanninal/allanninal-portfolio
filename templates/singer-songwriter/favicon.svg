<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wren Halloway">
  <rect width="64" height="64" fill="#141613"/>
  <!-- A row of seats and a row of standing marks: the distinction the page
       is built on, not a musical note. -->
  <g fill="#5BA343">
    <rect x="8"  y="20" width="10" height="12" rx="2"/>
    <rect x="22" y="20" width="10" height="12" rx="2"/>
    <rect x="36" y="20" width="10" height="12" rx="2"/>
    <rect x="50" y="20" width="6"  height="12" rx="2"/>
  </g>
  <g fill="#687561">
    <rect x="8"  y="40" width="4" height="14" rx="2"/>
    <rect x="17" y="40" width="4" height="14" rx="2"/>
    <rect x="26" y="40" width="4" height="14" rx="2"/>
    <rect x="35" y="40" width="4" height="14" rx="2"/>
    <rect x="44" y="40" width="4" height="14" rx="2"/>
    <rect x="53" y="40" width="4" height="14" rx="2"/>
  </g>
</svg>
