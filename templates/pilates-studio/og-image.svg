      <stop offset="100%" stop-color="#ECEAE6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#2B5E7B"/>
