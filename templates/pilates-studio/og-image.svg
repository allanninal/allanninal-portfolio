  <rect x="860" y="240" width="80" height="90" rx="6" fill="#2B5E7B" opacity="0.07" stroke="#2B5E7B" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Spring coils -->
  <path d="M800 274 Q812 264 824 274 Q836 284 848 274 Q860 264 860 274" fill="none" stroke="#2B5E7B" stroke-width="2" opacity="0.18" stroke-linecap="round"/>
  <path d="M940 274 Q952 264 964 274 Q976 284 988 274 Q1000 264 1012 274 Q1024 264 1036 274 Q1048 264 1060 274 Q1072 264 1080 274" fill="none" stroke="#2B5E7B" stroke-width="2" opacity="0.18" stroke-linecap="round"/>
