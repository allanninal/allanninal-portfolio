  <line x1="60" y1="450" x2="700" y2="450" stroke="#2B5E7B" stroke-width="0.5" opacity="0.08"/>
  <!-- Studio name -->
  <text x="72" y="260" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#18181F" letter-spacing="1">Forma</text>
