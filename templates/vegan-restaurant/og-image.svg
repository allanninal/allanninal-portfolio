<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background — deep moss -->
  <rect width="1200" height="630" fill="#2D4A22"/>

  <!-- Subtle radial texture overlay -->
  <radialGradient id="glow" cx="30%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#3D6030" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#1E3216" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Large decorative leaf, right side -->
  <path d="M1000 80 C1000 80 820 180 820 330 C820 440 900 530 1000 530 C1100 530 1180 440 1180 330 C1180 180 1000 80 1000 80Z" fill="#1E3216" opacity="0.5"/>
  <path d="M1000 530 L1000 280" stroke="#3D6030" stroke-width="4" stroke-linecap="round"/>
  <path d="M1000 390 L930 340" stroke="#3D6030" stroke-width="3" stroke-linecap="round"/>
  <path d="M1000 440 L1070 390" stroke="#3D6030" stroke-width="3" stroke-linecap="round"/>

  <!-- Small leaf, top-left -->
  <path d="M80 30 C80 30 30 70 30 110 C30 140 50 165 80 165 C110 165 130 140 130 110 C130 70 80 30 80 30Z" fill="#3D6030" opacity="0.4"/>

  <!-- Brand logo area -->
  <circle cx="100" cy="100" r="38" fill="#D9E8D4" opacity="0.9"/>
  <path d="M100 72C100 72 78 84 78 100C78 113 87 122 100 122C113 122 122 113 122 100C122 84 100 72 100 72Z" fill="#2D4A22"/>
  <path d="M100 122V102" stroke="#D9E8D4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 112L90 107" stroke="#D9E8D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 117L110 112" stroke="#D9E8D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Restaurant name -->
  <text x="152" y="92" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FAF7F0" letter-spacing="-0.5">Verdant Table</text>
  <text x="154" y="122" font-family="Arial, sans-serif" font-size="16" fill="#8FAF7E" letter-spacing="3" font-weight="700" text-transform="uppercase">PLANT-BASED RESTAURANT</text>

  <!-- Divider line -->
  <line x1="60" y1="170" x2="740" y2="170" stroke="#3D6030" stroke-width="1"/>

  <!-- Main headline -->
  <text x="60" y="250" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#FAF7F0" letter-spacing="-1">Food rooted in the earth.</text>

  <!-- Subline -->
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="22" fill="#B8D4AD" letter-spacing="0.5">Plant-based. Seasonally driven. Rooted in purpose.</text>

  <!-- Three feature pills -->
  <rect x="60" y="360" width="180" height="44" rx="22" fill="#1E3216"/>
  <text x="150" y="387" font-family="Arial, sans-serif" font-size="14" fill="#D9E8D4" text-anchor="middle" font-weight="700" letter-spacing="1">ZERO-WASTE KITCHEN</text>

  <rect x="256" y="360" width="160" height="44" rx="22" fill="#1E3216"/>
  <text x="336" y="387" font-family="Arial, sans-serif" font-size="14" fill="#D9E8D4" text-anchor="middle" font-weight="700" letter-spacing="1">NATURAL WINE</text>

  <rect x="432" y="360" width="200" height="44" rx="22" fill="#1E3216"/>
  <text x="532" y="387" font-family="Arial, sans-serif" font-size="14" fill="#D9E8D4" text-anchor="middle" font-weight="700" letter-spacing="1">LOCAL FARM SOURCING</text>

  <!-- Location & schema-ish detail -->
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="18" fill="#8FAF7E" letter-spacing="2">PORTLAND, OREGON</text>

  <!-- Bottom attribution -->
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="13" fill="#5C8A4A">Astro template · Day 35 of 365 · allanninal.dev/templates</text>

  <!-- Clay accent bar at right edge -->
  <rect x="1150" y="0" width="50" height="630" fill="#C17F3A" opacity="0.3"/>
</svg>
