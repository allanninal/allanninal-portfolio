<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7F9"/>
      <stop offset="1" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#831843"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo block -->
  <rect x="80" y="100" width="74" height="74" rx="14" fill="url(#accent)"/>
  <text x="117" y="156" text-anchor="middle"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="48" font-weight="800" fill="#FFF">F</text>

  <!-- Eyebrow pill -->
  <rect x="80" y="208" width="220" height="32" rx="16" fill="#FCE7F3" stroke="#FBCFE8"/>
  <text x="190" y="229" text-anchor="middle"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="13" font-weight="700" fill="#831843" letter-spacing="2">FEATURED ON THE APP STORE</text>

  <!-- Headline -->
  <text x="80" y="320" text-anchor="start"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="76" font-weight="800" fill="#1A0A10"
    letter-spacing="-2">Build habits that</text>
  <text x="80" y="392" text-anchor="start"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="76" font-weight="800" fill="#DB2777"
    letter-spacing="-2">stick.</text>

  <!-- Tagline -->
  <text x="80" y="450" text-anchor="start"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="22" font-weight="500" fill="#6B5560">A warm, gentle habit tracker. Free on iOS and Android.</text>

  <!-- Star rating + author byline at bottom -->
  <g transform="translate(80, 510)">
    <text x="0" y="20" text-anchor="start"
      font-family="'Manrope', system-ui, sans-serif"
      font-size="22" font-weight="700" fill="#1A0A10">★ ★ ★ ★ ★</text>
    <text x="200" y="20" text-anchor="start"
      font-family="'Manrope', system-ui, sans-serif"
      font-size="18" font-weight="600" fill="#6B5560">4.9 · 1,247 reviews</text>
  </g>

  <!-- Phone mockup on right -->
  <g transform="translate(800, 100)">
    <rect x="0" y="0" width="280" height="490" rx="36" fill="#0F0A0D" stroke="#1A0A10" stroke-width="3"/>
    <rect x="14" y="14" width="252" height="462" rx="28" fill="#FFF7F9"/>
    <rect x="90" y="20" width="100" height="28" rx="14" fill="#0F0A0D"/>

    <!-- Inner streak banner -->
    <rect x="34" y="100" width="212" height="60" rx="12" fill="url(#accent)"/>
    <text x="50" y="124" text-anchor="start"
      font-family="'Manrope', system-ui, sans-serif"
      font-size="11" font-weight="600" fill="#FFF" letter-spacing="1.5" opacity="0.9">CURRENT STREAK</text>
    <text x="50" y="148" text-anchor="start"
      font-family="'Manrope', system-ui, sans-serif"
      font-size="20" font-weight="800" fill="#FFF">42 days · longest yet</text>

    <!-- Mock list rows -->
    <g transform="translate(34, 180)">
      <rect x="0" y="0" width="212" height="44" rx="12" fill="#FCE7F3" stroke="#FBCFE8"/>
      <circle cx="22" cy="22" r="8" fill="#DB2777"/>
      <text x="42" y="27" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#831843">Drink water (8 glasses)</text>

      <rect x="0" y="56" width="212" height="44" rx="12" fill="#FCE7F3" stroke="#FBCFE8"/>
      <circle cx="22" cy="78" r="8" fill="#DB2777"/>
      <text x="42" y="83" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#831843">Read for 20 minutes</text>

      <rect x="0" y="112" width="212" height="44" rx="12" fill="#FFF" stroke="rgba(26,10,16,0.08)"/>
      <circle cx="22" cy="134" r="8" fill="none" stroke="#1A0A10" stroke-opacity="0.3" stroke-width="2"/>
      <text x="42" y="139" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A0A10">10-min mobility</text>

      <rect x="0" y="168" width="212" height="44" rx="12" fill="#FFF" stroke="rgba(26,10,16,0.08)"/>
      <circle cx="22" cy="190" r="8" fill="none" stroke="#1A0A10" stroke-opacity="0.3" stroke-width="2"/>
      <text x="42" y="195" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A0A10">Walk after lunch</text>
    </g>
  </g>
</svg>
