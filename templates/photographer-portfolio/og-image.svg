<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Subtle texture — thin grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Accent rule -->
  <rect x="80" y="260" width="120" height="3" fill="#3B5BDB"/>

  <!-- Name -->
  <text
    x="80"
    y="340"
    font-family="DM Sans, system-ui, sans-serif"
    font-size="80"
    font-weight="700"
    fill="white"
    letter-spacing="-2"
  >ALLAN NINAL</text>

  <!-- Role -->
  <text
    x="80"
    y="390"
    font-family="DM Sans, system-ui, sans-serif"
    font-size="24"
    font-weight="400"
    fill="rgba(255,255,255,0.60)"
    letter-spacing="2"
  >TRAVEL &amp; DOCUMENTARY PHOTOGRAPHER</text>

  <!-- URL -->
  <text
    x="80"
    y="560"
    font-family="DM Sans, system-ui, sans-serif"
    font-size="16"
    font-weight="400"
    fill="rgba(255,255,255,0.35)"
  >templates.allanninal.dev/photographer-portfolio/</text>

  <!-- Day badge -->
  <rect x="1060" y="40" width="100" height="36" rx="6" fill="#3B5BDB"/>
  <text
    x="1110"
    y="63"
    font-family="DM Sans, system-ui, sans-serif"
    font-size="14"
    font-weight="700"
    fill="white"
    text-anchor="middle"
  >Day 16</text>
</svg>
