<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Good Dog Standard — you cannot direct a dog. Pet photography in Missoula Montana">
  <rect width="1200" height="630" fill="#0E0D0C"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="646" y="120" font-size="14" fill="#E8A33D" letter-spacing="3">WHAT CAN BE ASKED</text>
    <g font-size="19" fill="#F3EFE8">
      <text x="662" y="164">A direction to look</text><text x="662" y="200">Two seconds still</text>
      <text x="662" y="236">A head tilt</text><text x="662" y="272">Ears forward</text>
      <text x="662" y="308">To come toward the lens</text>
    </g>
    <g stroke="#E8A33D" stroke-width="3">
      <path d="M646 148v172"/>
    </g>
    <text x="646" y="376" font-size="14" fill="#A9A297" letter-spacing="3">WHAT CANNOT</text>
    <g font-size="17" fill="#A9A297">
      <text x="662" y="416">Hold an expression</text><text x="662" y="446">A pose on request</text>
      <text x="662" y="476">Two animals at once</text><text x="662" y="506">Anything from a scared dog</text>
      <text x="662" y="536">A cat to do anything</text>
    </g>
    <text x="920" y="376" font-size="14" fill="#6E675E">+3 more</text>
  </g>
  <g font-family="Georgia, serif">
    <text x="72" y="120" font-family="monospace" font-size="14" fill="#A9A297" letter-spacing="4">GOOD DOG STANDARD &#183; MISSOULA, MT</text>
    <text x="72" y="270" font-size="62" fill="#F3EFE8">You cannot</text>
    <text x="72" y="344" font-size="62" fill="#E8A33D">direct a dog.</text>
    <text x="72" y="412" font-size="21" fill="#A9A297">Every technique is a way of asking,</text>
    <text x="72" y="446" font-size="21" fill="#A9A297">and the animal is allowed to say no.</text>
    <text x="72" y="546" font-family="monospace" font-size="15" fill="#F3EFE8">Day 99 of 365 &#183; allanninal.dev/templates</text>
  </g>
</svg>
