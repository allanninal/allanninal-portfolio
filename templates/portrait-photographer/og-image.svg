<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ferrier and Blunt — nine in ten people tell us they hate photographs of themselves. Portrait studio in Hudson New York">
  <rect width="1200" height="630" fill="#F4F3EF"/>

  <g font-family="Georgia, serif" fill="#2F6B2A">
    <text x="72" y="292" font-size="30">&#8220;I photograph badly&#8221;</text>
    <text x="430" y="292" font-size="25" fill="#3A7034">&#8220;I hate my smile&#8221;</text>
    <text x="740" y="292" font-size="30">&#8220;I always blink&#8221;</text>
    <text x="72" y="344" font-size="25" fill="#3A7034">&#8220;Just make me look normal&#8221;</text>
    <text x="440" y="344" font-size="30">&#8220;Do not make me smile&#8221;</text>
    <text x="820" y="344" font-size="25" fill="#3A7034">&#8220;My good side is the left&#8221;</text>
    <text x="72" y="396" font-size="30">&#8220;Can you do something about my nose&#8221;</text>
    <text x="600" y="396" font-size="25" fill="#3A7034">&#8220;Everyone else is photogenic&#8221;</text>
    <text x="72" y="448" font-size="25" fill="#3A7034">&#8220;I look angry when I am not&#8221;</text>
    <text x="470" y="448" font-size="30">&#8220;Can you make me look thinner&#8221;</text>
  </g>

  <g font-family="Georgia, serif">
    <text x="72" y="112" font-size="17" fill="#55565A" letter-spacing="4">FERRIER &amp; BLUNT &#183; HUDSON, NY</text>
    <text x="72" y="192" font-size="48" fill="#17181A">Nine in ten people tell us they</text>
    <text x="72" y="248" font-size="48" fill="#17181A">hate photographs of themselves.</text>
    <path d="M72 490h1056" stroke="#7E7A72" stroke-width="1"/>
    <text x="72" y="536" font-size="19" fill="#55565A">Every line above was said in the studio. Most of them more than once.</text>
    <text x="72" y="576" font-size="17" fill="#17181A">Day 92 of 365 &#183; allanninal.dev/templates</text>
  </g>
</svg>
