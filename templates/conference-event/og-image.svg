<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0E1117"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0E1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="6" height="630" fill="#10B981"/>

  <!-- Date + city badge -->
  <rect x="72" y="72" width="330" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="237" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#10B981" letter-spacing="1">Sep 15–16, 2026 · San Francisco, CA</text>

  <!-- Conference name -->
  <text x="72" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#F1F5F9" letter-spacing="-2">OpenSignal</text>
  <text x="72" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#10B981" letter-spacing="-2">Summit 2026</text>

  <!-- Tagline -->
  <text x="72" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94A3B8">Build what matters. Ship what lasts.</text>

  <!-- Stats -->
  <text x="72" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#10B981">12 Speakers</text>
  <text x="72" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569">2 tracks · 400 attendees · 2 days</text>

  <!-- Domain -->
  <text x="1128" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#475569">allanninal.dev/templates</text>
</svg>
