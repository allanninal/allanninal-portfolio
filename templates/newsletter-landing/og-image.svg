<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Cream paper base -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Halftone dot-grid texture, oxblood at low alpha -->
  <defs>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#881337" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Eyebrow: cadence + founding year -->
  <text x="80" y="160" text-anchor="start"
    font-family="'Work Sans', system-ui, sans-serif"
    font-size="22" font-weight="600" fill="#881337"
    letter-spacing="4">EVERY SUNDAY · SINCE 2022</text>

  <!-- Newsletter name (large display, Lora) -->
  <text x="80" y="285" text-anchor="start"
    font-family="Lora, Georgia, serif"
    font-size="116" font-weight="600" fill="#2A1F1F"
    letter-spacing="-3">Marginalia</text>

  <!-- Oxblood rule under the title -->
  <rect x="80" y="310" width="180" height="3" fill="#881337"/>

  <!-- Tagline (Lora italic-flavor) -->
  <text x="80" y="385" text-anchor="start"
    font-family="Lora, Georgia, serif"
    font-size="40" font-weight="500" fill="#2A1F1F"
    letter-spacing="-1">A weekly letter on the overlooked corners</text>
  <text x="80" y="435" text-anchor="start"
    font-family="Lora, Georgia, serif"
    font-size="40" font-weight="500" fill="#2A1F1F"
    letter-spacing="-1">of book history.</text>

  <!-- Trust signal at bottom -->
  <text x="80" y="540" text-anchor="start"
    font-family="'Work Sans', system-ui, sans-serif"
    font-size="20" font-weight="500" fill="#5C4D4D">84 issues  ·  4,200 readers  ·  ~6 min to read</text>

  <!-- Monogram seal top-right -->
  <g transform="translate(1020, 110)">
    <circle cx="60" cy="60" r="58" fill="#881337"/>
    <text x="60" y="84" text-anchor="middle"
      font-family="Lora, Georgia, serif"
      font-size="84" font-weight="600" fill="#FAF7F2"
      letter-spacing="-2">M</text>
  </g>
</svg>
