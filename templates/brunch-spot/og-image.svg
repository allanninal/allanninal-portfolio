<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: warm cream -->
  <rect width="1200" height="630" fill="#FFFDF7"/>

  <!-- Left sunny yellow band -->
  <rect width="420" height="630" fill="#F9C621"/>

  <!-- Decorative circle top-right -->
  <circle cx="1100" cy="80" r="200" fill="#FEE6DC" opacity="0.6"/>

  <!-- Decorative circle bottom-left -->
  <circle cx="80" cy="580" r="120" fill="#E0F4FF" opacity="0.5"/>

  <!-- Left side content -->
  <!-- Big emoji / icon area -->
  <text x="210" y="260" text-anchor="middle" font-size="120" font-family="system-ui, sans-serif">☀️</text>

  <!-- Day badge -->
  <rect x="80" y="400" width="260" height="36" rx="18" fill="#B83E12"/>
  <text x="210" y="423" text-anchor="middle" font-size="13" font-family="system-ui, sans-serif" fill="white" font-weight="600">Day 46 of 365 · Free MIT Template</text>

  <!-- Right side content -->
  <!-- Cafe name -->
  <text x="520" y="200" font-size="64" font-family="system-ui, sans-serif" font-weight="700" fill="#1A1208">Sunday &amp;</text>
  <text x="520" y="275" font-size="64" font-family="system-ui, sans-serif" font-weight="700" fill="#1A1208">Always</text>

  <!-- Tagline -->
  <text x="520" y="330" font-size="26" font-family="system-ui, sans-serif" fill="#5C4B2A">Brunch Spot in Brooklyn, NY</text>

  <!-- Feature tags -->
  <rect x="520" y="370" width="200" height="36" rx="18" fill="#FEE6DC"/>
  <text x="620" y="393" text-anchor="middle" font-size="14" font-family="system-ui, sans-serif" fill="#9A300A" font-weight="600">Bottomless Mimosas</text>

  <rect x="736" y="370" width="160" height="36" rx="18" fill="#D1FAE5"/>
  <text x="816" y="393" text-anchor="middle" font-size="14" font-family="system-ui, sans-serif" fill="#065F46" font-weight="600">Veg &amp; GF Options</text>

  <rect x="520" y="418" width="180" height="36" rx="18" fill="#E0F4FF"/>
  <text x="610" y="441" text-anchor="middle" font-size="14" font-family="system-ui, sans-serif" fill="#145A8A" font-weight="600">Weekend Brunch Menu</text>

  <rect x="716" y="418" width="160" height="36" rx="18" fill="#FEF3C7"/>
  <text x="796" y="441" text-anchor="middle" font-size="14" font-family="system-ui, sans-serif" fill="#7A5308" font-weight="600">Walk-ins Welcome</text>

  <!-- URL -->
  <text x="520" y="540" font-size="18" font-family="system-ui, sans-serif" fill="#9B8A6A">allanninal.dev/templates/brunch-spot/</text>

  <!-- Stack -->
  <text x="520" y="580" font-size="15" font-family="system-ui, sans-serif" fill="#9B8A6A">Astro · Tailwind · Gabarito + Poppins</text>
</svg>
