<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="75%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0A1E"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Kinetic diagonal lines -->
  <line x1="600" y1="0"  x2="800" y2="630"  stroke="#7C3AED" stroke-width="1.5" opacity="0.15"/>
  <line x1="700" y1="0"  x2="900" y2="630"  stroke="#7C3AED" stroke-width="1"   opacity="0.08"/>
  <line x1="800" y1="0"  x2="1000" y2="630" stroke="#C4B5FD" stroke-width="0.8" opacity="0.07"/>
  <line x1="900" y1="0"  x2="1100" y2="630" stroke="#7C3AED" stroke-width="1"   opacity="0.10"/>

  <!-- Circle motif -->
  <circle cx="950" cy="315" r="250" stroke="#7C3AED" stroke-width="1.5" fill="none" opacity="0.10"/>
  <circle cx="950" cy="315" r="180" stroke="#C4B5FD" stroke-width="1"   fill="none" opacity="0.07"/>

  <!-- Brand mark icon (lightning) -->
  <rect x="80" y="75" width="72" height="72" rx="16" fill="#7C3AED"/>
  <path d="M118 87L105 125h16L107 161" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Name -->
  <text x="172" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#F5F0FF" letter-spacing="0.5">Alex Rivera</text>
  <text x="172" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#A78BCA">Personal Trainer · Austin, TX</text>

  <!-- Divider -->
  <line x1="80" y1="195" x2="520" y2="195" stroke="#7C3AED" stroke-width="2" opacity="0.60"/>

  <!-- Headline -->
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="#F5F0FF">Strength.</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="#F5F0FF">Results.</text>
  <text x="80" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="#C4B5FD">Accountability.</text>

  <!-- Tagline -->
  <text x="80" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#A78BCA">NSCA-CSCS · 1:1, Small-Group &amp; Online Coaching</text>

  <!-- CTA chip -->
  <rect x="80" y="535" width="300" height="48" rx="24" fill="#7C3AED"/>
  <text x="230" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Book Free Consult</text>
</svg>
