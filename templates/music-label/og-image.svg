<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Quarry Line Records — finished in January, out in September">
  <rect width="1200" height="630" fill="#F2F1EC"/>
  <text x="80" y="170" font-family="Georgia, Times New Roman, serif" font-weight="bold" font-size="88" fill="#17181A" letter-spacing="-2">Finished in January.</text>
  <text x="80" y="264" font-family="Georgia, Times New Roman, serif" font-weight="bold" font-size="88" fill="#145A8C" letter-spacing="-2">Out in September.</text>
  <text x="80" y="322" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#585B60" letter-spacing="3">QUARRY LINE RECORDS &#183; LAWRENCE, KANSAS</text>

  <text x="80" y="392" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#585B60">MASTERING &#183; 11 DAYS</text>
  <rect x="80" y="404" width="46" height="18" fill="#145A8C"/>

  <text x="80" y="452" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#585B60">LACQUER AND PLATING &#183; 17 DAYS</text>
  <rect x="126" y="464" width="70" height="18" fill="#145A8C"/>

  <text x="80" y="512" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#A34400">PRESSING QUEUE &#183; 118 DAYS, NOTHING HAPPENS</text>
  <rect x="226" y="524" width="486" height="18" fill="none" stroke="#A34400" stroke-width="3"/>

  <text x="80" y="576" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#585B60">RELEASE DAY</text>
  <rect x="1042" y="524" width="10" height="18" fill="#145A8C"/>
  <text x="740" y="540" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#17181A">254 DAYS TOTAL</text>
</svg>
