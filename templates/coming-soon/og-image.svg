<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm white background -->
  <rect width="1200" height="630" fill="#FDFAF6"/>

  <!-- Subtle warm-tinted left band -->
  <rect x="0" y="0" width="6" height="630" fill="#4A1942"/>

  <!-- Top decorative thin rule -->
  <line x1="80" y1="80" x2="320" y2="80" stroke="#4A1942" stroke-width="1"/>

  <!-- Brand monogram circle -->
  <circle cx="120" cy="120" r="40" fill="none" stroke="#4A1942" stroke-width="1.5"/>
  <text
    x="120"
    y="130"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="28"
    font-weight="300"
    fill="#4A1942"
  >M</text>

  <!-- Brand name -->
  <text
    x="80"
    y="230"
    font-family="Georgia, serif"
    font-size="22"
    font-weight="300"
    fill="#5C3D58"
    letter-spacing="2"
  >MAISON NOUVELLE</text>

  <!-- Main headline -->
  <text
    x="80"
    y="340"
    font-family="Georgia, serif"
    font-size="72"
    font-weight="300"
    fill="#1E0D1B"
    letter-spacing="-2"
  >Something beautiful</text>
  <text
    x="80"
    y="420"
    font-family="Georgia, serif"
    font-size="72"
    font-weight="300"
    fill="#1E0D1B"
    letter-spacing="-2"
  >is on its way.</text>

  <!-- Tagline -->
  <text
    x="80"
    y="490"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="400"
    fill="#5C3D58"
    letter-spacing="0"
  >Launching Summer 2026 — Join the list</text>

  <!-- Bottom rule and URL -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="#DDD0DA" stroke-width="1"/>
  <text
    x="80"
    y="590"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="16"
    font-weight="400"
    fill="#7A5C75"
    letter-spacing="1"
  >allanninal.dev/templates/coming-soon/</text>

  <!-- Accent dot -->
  <circle cx="1100" cy="580" r="6" fill="#4A1942"/>
</svg>
