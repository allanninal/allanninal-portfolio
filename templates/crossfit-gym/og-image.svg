<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0E1520"/>

  <!-- Grid pattern -->
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1D2B40" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Diagonal accent lines -->
  <line x1="700" y1="0" x2="1200" y2="450" stroke="#C8F000" stroke-width="2" opacity="0.15"/>
  <line x1="780" y1="0" x2="1200" y2="300" stroke="#C8F000" stroke-width="1" opacity="0.08"/>

  <!-- Volt left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#C8F000"/>

  <!-- Abstract barbell illustration (right side) -->
  <rect x="780" y="260" width="350" height="30" rx="12" fill="#C8F000" opacity="0.08"/>
  <rect x="762" y="220" width="36" height="110" rx="10" fill="#C8F000" opacity="0.06"/>
  <rect x="1098" y="220" width="36" height="110" rx="10" fill="#C8F000" opacity="0.06"/>
  <rect x="748" y="238" width="22" height="74" rx="8" fill="#C8F000" opacity="0.04"/>
  <rect x="1130" y="238" width="22" height="74" rx="8" fill="#C8F000" opacity="0.04"/>

  <!-- Content left panel -->
  <text x="80" y="180" font-family="Impact, sans-serif" font-size="22" fill="#8896B0" letter-spacing="6" text-transform="uppercase">DENVER, CO · RINO DISTRICT</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Impact, sans-serif" font-size="96" fill="#EEF2FB" letter-spacing="3">CROSSFIT</text>
  <text x="80" y="380" font-family="Impact, sans-serif" font-size="96" fill="#C8F000" letter-spacing="3">IRONCLAD</text>

  <!-- Tagline -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="22" fill="#8896B0">Built Strong. Forged Together.</text>

  <!-- Box details -->
  <rect x="80" y="470" width="700" height="1" fill="#1D2B40"/>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="18" fill="#8896B0">Coached WOD Classes  ·  On-Ramp Foundations  ·  4 CF-L1/L2 Coaches</text>

  <!-- CTA pill -->
  <rect x="80" y="545" width="220" height="48" rx="4" fill="#C8F000"/>
  <text x="190" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0E1520">START FREE WEEK</text>

  <!-- Day badge -->
  <rect x="1050" y="40" width="120" height="50" rx="6" fill="#C8F000" opacity="0.12"/>
  <text x="1110" y="72" text-anchor="middle" font-family="Impact, sans-serif" font-size="20" fill="#C8F000">DAY 61</text>
</svg>
