<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Bellwether Four — four people, one name, a written agreement">
  <rect width="1200" height="630" fill="#FAF8F5"/>
  <text x="80" y="164" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" fill="#191720" letter-spacing="-1">Most bands have the name.</text>
  <text x="80" y="248" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" fill="#6030CF" letter-spacing="-1">Fewer have the agreement.</text>
  <text x="80" y="308" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#6C667A" letter-spacing="3">THE BELLWETHER FOUR &#183; ASHEVILLE, NC &#183; SINCE 2019</text>
    <text x="80" y="386" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6C667A">SONGWRITING</text>
    <text x="420" y="386" font-family="Georgia, serif" font-size="26" fill="#191720">Equal, four ways</text>
    <rect x="80" y="400" width="1040" height="1" fill="#D8D2C8"/>
    <text x="80" y="432" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6C667A">INCOME</text>
    <text x="420" y="432" font-family="Georgia, serif" font-size="26" fill="#191720">Equal after costs</text>
    <rect x="80" y="446" width="1040" height="1" fill="#D8D2C8"/>
    <text x="80" y="478" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6C667A">THE NAME</text>
    <text x="420" y="478" font-family="Georgia, serif" font-size="26" fill="#191720">All four, jointly</text>
    <rect x="80" y="492" width="1040" height="1" fill="#D8D2C8"/>
    <text x="80" y="524" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6C667A">LEAVING</text>
    <text x="420" y="524" font-family="Georgia, serif" font-size="26" fill="#191720">Splits freeze, credits stay</text>
    <rect x="80" y="538" width="1040" height="1" fill="#D8D2C8"/>
    <text x="80" y="570" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#6C667A">DECISIONS</text>
    <text x="420" y="570" font-family="Georgia, serif" font-size="26" fill="#191720">3 of 4, or it waits</text>
    <rect x="80" y="584" width="1040" height="1" fill="#D8D2C8"/>
  <text x="80" y="604" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#6C667A">FIVE QUESTIONS EVERY BAND ANSWERS EVENTUALLY</text>
</svg>
