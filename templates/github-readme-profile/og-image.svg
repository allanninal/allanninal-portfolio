<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#1C2330"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#30363D" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Left panel: form mockup -->
  <rect x="60" y="120" width="420" height="390" rx="12" fill="url(#panel)" stroke="#30363D" stroke-width="1"/>
  <!-- Panel header -->
  <rect x="60" y="120" width="420" height="40" rx="12" fill="#1C2330"/>
  <rect x="60" y="148" width="420" height="12" fill="#1C2330"/>
  <circle cx="85" cy="140" r="6" fill="#FF5F56"/>
  <circle cx="104" cy="140" r="6" fill="#FFBD2E"/>
  <circle cx="123" cy="140" r="6" fill="#3FB950"/>
  <text x="300" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#848D97">Your details</text>

  <!-- Form fields mockup -->
  <rect x="80" y="175" width="380" height="28" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <text x="96" y="194" font-family="monospace" font-size="10" fill="#848D97">Display name</text>
  <text x="180" y="194" font-family="monospace" font-size="10" fill="#E6EDF3">Alex Rivera</text>

  <rect x="80" y="215" width="380" height="28" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <text x="96" y="234" font-family="monospace" font-size="10" fill="#848D97">Role</text>
  <text x="135" y="234" font-family="monospace" font-size="10" fill="#E6EDF3">Full-Stack Engineer</text>

  <rect x="80" y="255" width="380" height="28" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <text x="96" y="274" font-family="monospace" font-size="10" fill="#848D97">GitHub username *</text>
  <text x="216" y="274" font-family="monospace" font-size="10" fill="#00D4FF">alexrivera-dev</text>

  <!-- Tech chip mockup -->
  <text x="80" y="305" font-family="monospace" font-size="9" fill="#848D97" letter-spacing="2">TECH STACK</text>
  <rect x="80" y="313" width="56" height="20" rx="4" fill="#0D1117" stroke="#00D4FF" stroke-width="1"/>
  <text x="108" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="#00D4FF">React</text>
  <rect x="142" y="313" width="80" height="20" rx="4" fill="#0D1117" stroke="#00D4FF" stroke-width="1"/>
  <text x="182" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="#00D4FF">TypeScript</text>
  <rect x="228" y="313" width="62" height="20" rx="4" fill="#1C2330" stroke="#30363D" stroke-width="0.5"/>
  <text x="259" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="#848D97">Node.js</text>
  <rect x="296" y="313" width="60" height="20" rx="4" fill="#1C2330" stroke="#30363D" stroke-width="0.5"/>
  <text x="326" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="#848D97">Docker</text>
  <rect x="362" y="313" width="58" height="20" rx="4" fill="#1C2330" stroke="#30363D" stroke-width="0.5"/>
  <text x="391" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="#848D97">Postgres</text>
  <rect x="80" y="339" width="44" height="20" rx="4" fill="#1C2330" stroke="#30363D" stroke-width="0.5"/>
  <text x="102" y="353" text-anchor="middle" font-family="monospace" font-size="9" fill="#848D97">Git</text>

  <!-- Generate button -->
  <rect x="80" y="380" width="380" height="36" rx="8" fill="#00D4FF"/>
  <text x="270" y="402" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#0D1117">Generate README</text>

  <!-- Right panel: output mockup -->
  <rect x="520" y="120" width="620" height="390" rx="12" fill="url(#panel)" stroke="#30363D" stroke-width="1"/>
  <!-- Panel header -->
  <rect x="520" y="120" width="620" height="40" rx="12" fill="#1C2330"/>
  <rect x="520" y="148" width="620" height="12" fill="#1C2330"/>
  <circle cx="545" cy="140" r="6" fill="#FF5F56"/>
  <circle cx="564" cy="140" r="6" fill="#FFBD2E"/>
  <circle cx="583" cy="140" r="6" fill="#3FB950"/>
  <text x="830" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#848D97">README.md — generated</text>

  <!-- Markdown output mockup -->
  <text x="540" y="185" font-family="monospace" font-size="11" fill="#00D4FF">&lt;h1 align="center"&gt;Hi, I'm Alex Rivera 👋&lt;/h1&gt;</text>
  <text x="540" y="205" font-family="monospace" font-size="10" fill="#848D97">&lt;p align="center"&gt;Full-Stack Engineer · San Francisco&lt;/p&gt;</text>
  <text x="540" y="230" font-family="monospace" font-size="10" fill="#E6EDF3">---</text>
  <text x="540" y="250" font-family="monospace" font-size="10" fill="#3FB950">**About me**</text>
  <text x="540" y="268" font-family="monospace" font-size="10" fill="#848D97">- 🔭 Currently working on: Building a collaborative code editor</text>
  <text x="540" y="286" font-family="monospace" font-size="10" fill="#848D97">- ⚡ Fun fact: Deployed from 30,000 ft on airplane Wi-Fi</text>
  <text x="540" y="308" font-family="monospace" font-size="10" fill="#E6EDF3">---</text>
  <text x="540" y="328" font-family="monospace" font-size="10" fill="#3FB950">**Tech Stack**</text>
  <text x="540" y="348" font-family="monospace" font-size="9" fill="#848D97">![React] ![TypeScript] ![Node.js] ![PostgreSQL] ![Docker]</text>
  <text x="540" y="370" font-family="monospace" font-size="10" fill="#E6EDF3">---</text>
  <text x="540" y="390" font-family="monospace" font-size="10" fill="#3FB950">**GitHub Stats**</text>
  <rect x="540" y="400" width="240" height="40" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <text x="660" y="426" text-anchor="middle" font-family="monospace" font-size="9" fill="#848D97">📊 github-readme-stats placeholder</text>
  <!-- Copy button -->
  <rect x="1010" y="132" width="56" height="20" rx="4" fill="transparent" stroke="#30363D" stroke-width="1"/>
  <text x="1038" y="146" text-anchor="middle" font-family="monospace" font-size="9" fill="#E6EDF3">Copy</text>
  <rect x="1072" y="132" width="56" height="20" rx="4" fill="#00D4FF"/>
  <text x="1100" y="146" text-anchor="middle" font-family="monospace" font-size="9" fill="#0D1117">Download</text>

  <!-- Headline text (center) -->
  <text x="600" y="62" text-anchor="middle"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-size="28" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">
    GitHub README Profile Generator
  </text>
  <text x="600" y="90" text-anchor="middle"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-size="14" fill="#848D97">
    Free · Client-Side · No Account · MIT Licensed
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="4" fill="#00D4FF" opacity="0.6"/>
  <text x="600" y="625" text-anchor="middle"
    font-family="monospace" font-size="11" fill="#848D97">
    allanninal.dev/templates
  </text>
</svg>
