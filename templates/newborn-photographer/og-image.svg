<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Halló Studio — every pose you have seen is a composite, the hands are edited out not removed. Newborn photography in Burlington Vermont">
  <rect width="1200" height="630" fill="#FAF8F5"/>
  <g font-family="monospace" font-size="15">
    <text x="660" y="118" fill="#57564C" letter-spacing="3">HOW EACH POSE IS MADE</text>
    <path d="M660 132h468" stroke="#1A1A17" stroke-width="2"/>
    <g font-family="Georgia, serif" font-size="19" fill="#1A1A17">
      <text x="660" y="180">Chin on hands</text><text x="660" y="248">Hanging hammock</text>
      <text x="660" y="316">In a bucket</text><text x="660" y="384">Curled on a beanbag</text>
      <text x="660" y="452">Balanced, unsupported</text>
    </g>
    <g font-size="13" font-weight="bold" letter-spacing="1">
      <rect x="980" y="160" width="148" height="28" fill="#2C5A3C"/><text x="994" y="179" fill="#FFFFFF">COMPOSITE &#215;2</text>
      <rect x="980" y="228" width="148" height="28" fill="#2C5A3C"/><text x="994" y="247" fill="#FFFFFF">COMPOSITE &#215;3</text>
      <rect x="980" y="296" width="148" height="28" fill="#2C5A3C"/><text x="994" y="315" fill="#FFFFFF">COMPOSITE &#215;2</text>
      <rect x="980" y="364" width="148" height="28" fill="none" stroke="#1A1A17" stroke-width="2"/><text x="1000" y="383" fill="#1A1A17">SUPPORTED &#215;1</text>
      <rect x="980" y="432" width="148" height="28" fill="none" stroke="#1A1A17" stroke-width="2" stroke-dasharray="5 4"/><text x="988" y="451" fill="#1A1A17">NOT ATTEMPTED</text>
    </g>
    <path d="M660 486h468" stroke="#1A1A17" stroke-width="2"/>
    <text x="660" y="518" font-size="14" fill="#57564C">A spotter is in every frame that is not flat.</text>
  </g>
  <g font-family="Georgia, serif">
    <text x="72" y="118" font-family="monospace" font-size="14" fill="#57564C" letter-spacing="4">HALL&#211; STUDIO &#183; BURLINGTON, VT</text>
    <text x="72" y="244" font-size="48" fill="#1A1A17">Every pose you</text>
    <text x="72" y="302" font-size="48" fill="#1A1A17">have seen is</text>
    <text x="72" y="360" font-size="48" fill="#1A1A17">a composite.</text>
    <text x="72" y="428" font-size="30" fill="#2C5A3C">The hands are edited</text>
    <text x="72" y="468" font-size="30" fill="#2C5A3C">out, not removed.</text>
    <text x="72" y="546" font-family="monospace" font-size="15" fill="#1A1A17">Day 98 of 365 &#183; allanninal.dev/templates</text>
  </g>
