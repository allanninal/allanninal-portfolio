<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F2EFE6"/>

  <!-- Guide-sheet ruling, which is what the page is built on -->
  <g stroke="#DCE2E8" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>
  <g stroke="#B9C4CE" stroke-width="2">
    <line x1="0" y1="196" x2="1200" y2="196"/>
  </g>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#211C15" stroke-width="2"/>

  <!-- Two broad-pen strokes and one pointed swell, sitting on the rules -->
  <g fill="#211C15">
    <path d="M812,196 L836,186 L884,430 L860,440 Z"/>
    <path d="M900,196 L924,186 L972,430 L948,440 Z"/>
    <path d="M836,300 L960,286 L964,306 L840,320 Z"/>
    <path d="M1010,196 C1002,260 1004,370 1016,430 C1030,430 1040,428 1050,424 C1034,364 1030,258 1034,196 Z"/>
  </g>
  <!-- The nib, at its angle, in terre verte -->
  <line x1="770" y1="176" x2="806" y2="206" stroke="#42621A" stroke-width="9"/>

  <text x="80" y="176" font-family="'Host Grotesk', system-ui, sans-serif" font-size="21" font-weight="700" fill="#42621A" letter-spacing="5">CALLIGRAPHER &#183; CHARLESTON, SOUTH CAROLINA</text>

  <text x="80" y="300" font-family="'Forum', Georgia, serif" font-size="84" fill="#211C15">A hand is a tool</text>
  <text x="80" y="392" font-family="'Forum', Georgia, serif" font-size="84" fill="#211C15">at an angle, not a font.</text>

  <text x="80" y="470" font-family="system-ui, sans-serif" font-size="25" fill="#57503F">Five hands, one set of skeletons, every letter swept by its own nib.</text>

  <rect x="80" y="524" width="12" height="56" fill="#42621A"/>
  <text x="112" y="550" font-family="'Host Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#211C15">Free Astro template &#183; Day 129 of 365</text>
  <text x="112" y="576" font-family="system-ui, sans-serif" font-size="20" fill="#57503F">allanninal.dev/templates</text>
</svg>
