<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Redoubt Lock and Key — the lock is rarely what failed, Spokane Washington">
  <rect width="1200" height="630" fill="#FBFAF7"/>

  <!-- The matrix, reduced to the column that makes the point. -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="640" y="96" width="488" height="40" fill="#161512"/>
    <text x="656" y="123" font-size="15" fill="#FFFFFF" letter-spacing="3">HARDWARE</text>
    <text x="960" y="123" font-size="15" fill="#FFFFFF" letter-spacing="3">KICK / SPREAD</text>

    <g font-size="22" fill="#161512">
      <text x="656" y="180">Grade 3 deadbolt</text>
      <text x="656" y="242">Grade 1 deadbolt</text>
      <text x="656" y="304">High-security cylinder</text>
      <text x="656" y="366">Smart lock</text>
      <text x="656" y="428">Reinforced strike</text>
    </g>

    <g>
      <rect x="952" y="156" width="176" height="34" fill="#F3E2DE"/>
      <rect x="952" y="218" width="176" height="34" fill="#F3E2DE"/>
      <rect x="952" y="280" width="176" height="34" fill="#F3E2DE"/>
      <rect x="952" y="342" width="176" height="34" fill="#F3E2DE"/>
      <rect x="952" y="404" width="176" height="34" fill="#E4EDE2"/>
    </g>
    <g font-size="17" font-weight="bold" fill="#161512" letter-spacing="1">
      <text x="968" y="180">WEAK</text><text x="968" y="242">WEAK</text>
      <text x="968" y="304">WEAK</text><text x="968" y="366">WEAK</text>
      <text x="968" y="428">STRONG</text>
    </g>
    <g stroke="#D6D0C2" stroke-width="1"><path d="M640 200h488M640 262h488M640 324h488M640 386h488"/></g>
    <path d="M640 448h488" stroke="#8A6A16" stroke-width="3"/>
    <text x="656" y="478" font-size="15" fill="#5C574C">Four of five rows read the same.</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="126" font-size="20" font-weight="bold" fill="#161512" letter-spacing="5">REDOUBT LOCK &amp; KEY</text>
    <text x="72" y="248" font-size="56" font-weight="bold" fill="#161512">We can sell you</text>
    <text x="72" y="316" font-size="56" font-weight="bold" fill="#161512">a better lock.</text>
    <text x="72" y="384" font-size="56" font-weight="bold" fill="#6E5410">The frame failed.</text>
    <text x="72" y="444" font-size="23" fill="#5C574C">Spokane, WA &#183; ALOA-certified</text>
    <text x="72" y="512" font-size="18" fill="#161512">Day 87 of 365 &#183; allanninal.dev/templates</text>
  </g>
</svg>
