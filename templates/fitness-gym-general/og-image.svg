<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111214"/>

  <!-- Orange accent left bar -->
  <rect x="0" y="0" width="10" height="630" fill="#EF4900"/>

  <!-- Diagonal performance lines -->
  <line x1="700" y1="0" x2="1200" y2="500" stroke="#EF4900" stroke-width="2" opacity="0.2"/>
  <line x1="760" y1="0" x2="1200" y2="380" stroke="#EF4900" stroke-width="1" opacity="0.12"/>
  <line x1="640" y1="0" x2="1200" y2="630" stroke="#3A3B3F" stroke-width="1.5" opacity="0.4"/>

  <!-- Large weight plate ring (top-right) -->
  <circle cx="1050" cy="180" r="180" fill="none" stroke="#EF4900" stroke-width="20" opacity="0.1"/>
  <circle cx="1050" cy="180" r="140" fill="none" stroke="#EF4900" stroke-width="10" opacity="0.07"/>
  <circle cx="1050" cy="180" r="65" fill="none" stroke="#EF4900" stroke-width="38" opacity="0.08"/>

  <!-- Bottom-left decorative ring -->
  <circle cx="120" cy="540" r="120" fill="none" stroke="#252629" stroke-width="16" opacity="0.6"/>
  <circle cx="120" cy="540" r="80" fill="none" stroke="#252629" stroke-width="8" opacity="0.4"/>

  <!-- Grid texture -->
  <defs>
    <pattern id="og-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E1F22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#og-grid)"/>

  <!-- Dumbbell logo mark -->
  <rect x="60" y="58" width="60" height="14" rx="5" fill="#EF4900"/>
  <rect x="52" y="48" width="14" height="34" rx="4" fill="#EF4900"/>
  <rect x="114" y="48" width="14" height="34" rx="4" fill="#EF4900"/>
  <rect x="44" y="52" width="10" height="26" rx="3" fill="#CC3D00"/>
  <rect x="126" y="52" width="10" height="26" rx="3" fill="#CC3D00"/>

  <!-- Gym name -->
  <text x="150" y="80" font-family="Impact, sans-serif" font-size="40" fill="#F0F0EE" letter-spacing="3">IRON PEAK FITNESS</text>

  <!-- Tagline -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="18" fill="#9A9B9F" letter-spacing="2">FORGE YOUR BEST SELF &#x2022; AUSTIN, TX</text>

  <!-- Divider line -->
  <line x1="60" y1="155" x2="560" y2="155" stroke="#EF4900" stroke-width="2"/>

  <!-- Headline -->
  <text x="60" y="260" font-family="Impact, sans-serif" font-size="96" fill="#F0F0EE" letter-spacing="2">FORGE</text>
  <text x="60" y="360" font-family="Impact, sans-serif" font-size="96" fill="#F0F0EE" letter-spacing="2">YOUR</text>
  <text x="60" y="460" font-family="Impact, sans-serif" font-size="96" fill="#EF4900" letter-spacing="2">BEST SELF</text>

  <!-- Stats row -->
  <rect x="60" y="490" width="480" height="90" rx="6" fill="#1A1B1E" opacity="0.8"/>
  <text x="100" y="525" font-family="Arial, sans-serif" font-size="11" fill="#5A5B5F" letter-spacing="1.5">MEMBERS</text>
  <text x="100" y="548" font-family="Impact, sans-serif" font-size="24" fill="#F0F0EE">1,200+</text>
  <text x="220" y="525" font-family="Arial, sans-serif" font-size="11" fill="#5A5B5F" letter-spacing="1.5">CLASSES/WEEK</text>
  <text x="220" y="548" font-family="Impact, sans-serif" font-size="24" fill="#F0F0EE">35+</text>
  <text x="330" y="525" font-family="Arial, sans-serif" font-size="11" fill="#5A5B5F" letter-spacing="1.5">TRAINERS</text>
  <text x="330" y="548" font-family="Impact, sans-serif" font-size="24" fill="#F0F0EE">8</text>
  <text x="415" y="525" font-family="Arial, sans-serif" font-size="11" fill="#5A5B5F" letter-spacing="1.5">FROM</text>
  <text x="415" y="548" font-family="Impact, sans-serif" font-size="24" fill="#EF4900">$69/mo</text>

  <!-- Day badge -->
  <rect x="60" y="592" width="100" height="26" rx="13" fill="#EF4900"/>
  <text x="110" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#111214" font-weight="bold" letter-spacing="0.5">Day 60 of 365</text>

  <text x="175" y="610" font-family="Arial, sans-serif" font-size="11" fill="#3A3B3F">allanninal.dev · 365 Templates</text>
</svg>
