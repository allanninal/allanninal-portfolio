<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Yusra Benhaddou — a screen is nine screens">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="80" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="96" fill="#14161A" letter-spacing="-3">A screen is</text>
  <text x="80" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="96" fill="#3730C4" letter-spacing="-3">nine screens.</text>
  <text x="80" y="342" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#5A6270" letter-spacing="3">YUSRA BENHADDOU &#183; UI DESIGNER &#183; CHICAGO, IL</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="17">
    <rect x="80"  y="404" width="168" height="62" fill="#3730C4"/>
    <text x="94"  y="441" fill="#FFFFFF">IDEAL</text>
    <rect x="264" y="404" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="278" y="441" fill="#14161A">EMPTY</text>
    <rect x="448" y="404" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="462" y="441" fill="#14161A">LOADING</text>
    <rect x="632" y="404" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="646" y="441" fill="#14161A">ERROR</text>
    <rect x="816" y="404" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="830" y="441" fill="#14161A">OFFLINE</text>
    <rect x="80"  y="482" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="94"  y="519" fill="#14161A">NO ACCESS</text>
    <rect x="264" y="482" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="278" y="519" fill="#14161A">TOO MUCH</text>
    <rect x="448" y="482" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="462" y="519" fill="#14161A">TOO LONG</text>
    <rect x="632" y="482" width="168" height="62" fill="none" stroke="#7B8494" stroke-width="2"/>
    <text x="646" y="519" fill="#14161A">200% ZOOM</text>
  </g>
  <text x="828" y="524" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#5A6270">ONE OF THESE IS</text>
  <text x="828" y="552" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#5A6270">IN YOUR PORTFOLIO.</text>
  <text x="80" y="592" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#A81F32">ALL NINE ARE RENDERED LIVE ON THE PAGE, NOT SCREENSHOTTED.</text>
</svg>
