<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E18"/>
      <stop offset="100%" stop-color="#111426"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="75%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#C4315A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4315A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#spotlight)"/>

  <!-- Stage floor line -->
  <rect x="0" y="598" width="1200" height="4" fill="#C4315A" opacity="0.7"/>

  <!-- Dancer silhouette motif (right side, large) -->
  <!-- Head -->
  <circle cx="940" cy="160" r="35" fill="#D4A054" opacity="0.15"/>
  <!-- Torso -->
  <line x1="940" y1="195" x2="940" y2="360" stroke="#D4A054" stroke-width="18" stroke-linecap="round" opacity="0.12"/>
  <!-- Left arm raised -->
  <line x1="940" y1="270" x2="820" y2="190" stroke="#D4A054" stroke-width="16" stroke-linecap="round" opacity="0.12"/>
  <!-- Right arm extended -->
  <line x1="940" y1="270" x2="1080" y2="290" stroke="#D4A054" stroke-width="16" stroke-linecap="round" opacity="0.12"/>
  <!-- Supporting leg -->
  <line x1="940" y1="360" x2="910" y2="570" stroke="#D4A054" stroke-width="18" stroke-linecap="round" opacity="0.12"/>
  <!-- Extended leg (arabesque) -->
  <line x1="940" y1="360" x2="1130" y2="270" stroke="#D4A054" stroke-width="16" stroke-linecap="round" opacity="0.12"/>

  <!-- Accent vertical bar left -->
  <rect x="0" y="0" width="5" height="630" fill="#C4315A" opacity="0.8"/>

  <!-- Gold accent dot -->
  <circle cx="68" cy="160" r="8" fill="#D4A054"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="200" x2="700" y2="200" stroke="#F2EEF5" stroke-width="0.5" opacity="0.05"/>
  <line x1="0" y1="430" x2="700" y2="430" stroke="#F2EEF5" stroke-width="0.5" opacity="0.05"/>

  <!-- Studio name -->
  <text x="72" y="255" font-family="Georgia, serif" font-size="76" font-weight="300" fill="#F2EEF5" letter-spacing="6" opacity="0.95">Éclat Dance</text>
  <text x="72" y="345" font-family="Georgia, serif" font-size="76" font-weight="300" fill="#F2EEF5" letter-spacing="6" opacity="0.95">Academy</text>

  <!-- Tagline -->
  <text x="72" y="415" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#D4A054" letter-spacing="5">WHERE EVERY DANCER FINDS THEIR LIGHT</text>

  <!-- Location -->
  <text x="72" y="465" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9898AE">Lincoln Park, Chicago IL  ·  Ballet · Jazz · Contemporary · Hip-Hop · Ballroom</text>

  <!-- Rose accent line below tagline -->
  <rect x="72" y="383" width="120" height="2" fill="#C4315A" opacity="0.7"/>
</svg>
