<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Éclat Dance Academy — dancer silhouette favicon -->
  <rect width="32" height="32" rx="6" fill="#0C0E18"/>
  <!-- Stage base line -->
  <rect x="3" y="27" width="26" height="2" rx="1" fill="#C4315A"/>
  <!-- Dancer silhouette (arabesque) -->
  <!-- Head -->
  <circle cx="16" cy="6" r="2.5" fill="#D4A054"/>
  <!-- Torso -->
  <line x1="16" y1="8.5" x2="16" y2="17" stroke="#D4A054" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left arm raised -->
  <line x1="16" y1="12" x2="9" y2="8" stroke="#D4A054" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right arm extended -->
  <line x1="16" y1="12" x2="24" y2="14" stroke="#D4A054" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Supporting leg -->
  <line x1="16" y1="17" x2="14" y2="26" stroke="#D4A054" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Extended leg (arabesque) -->
  <line x1="16" y1="17" x2="26" y2="13" stroke="#D4A054" stroke-width="1.5" stroke-linecap="round"/>
</svg>
