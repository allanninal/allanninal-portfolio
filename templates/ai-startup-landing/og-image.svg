<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="60%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090C"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Amber accent line top -->
  <rect x="60" y="60" width="80" height="3" rx="1.5" fill="#F59E0B"/>

  <!-- Eyebrow -->
  <text x="60" y="110" font-family="monospace" font-size="14" fill="#F59E0B" letter-spacing="2" text-anchor="start">API · DOCUMENT INTELLIGENCE</text>

  <!-- Product name -->
  <text x="60" y="210" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#F8FAFC" letter-spacing="-4">ContextIQ</text>

  <!-- Tagline -->
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="32" fill="#94A3B8">Your documents, answered in milliseconds.</text>

  <!-- Stats row -->
  <g transform="translate(60, 360)">
    <text font-family="Arial Black, sans-serif" font-size="40" font-weight="900" fill="#F59E0B">&lt; 200ms</text>
    <text y="44" font-family="monospace" font-size="13" fill="#64748B">p99 response time</text>

    <text x="280" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" fill="#F59E0B">99.97%</text>
    <text x="280" y="44" font-family="monospace" font-size="13" fill="#64748B">uptime (12-mo avg)</text>

    <text x="560" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" fill="#F59E0B">4</text>
    <text x="560" y="44" font-family="monospace" font-size="13" fill="#64748B">model backends</text>
  </g>

  <!-- Trust badges -->
  <g transform="translate(60, 500)">
    <rect width="130" height="28" rx="14" fill="none" stroke="#2D3052" stroke-width="1"/>
    <text x="16" y="19" font-family="monospace" font-size="11" fill="#64748B">SOC 2 Type II</text>

    <rect x="146" width="70" height="28" rx="14" fill="none" stroke="#2D3052" stroke-width="1"/>
    <text x="162" y="19" font-family="monospace" font-size="11" fill="#64748B">GDPR</text>

    <rect x="232" width="200" height="28" rx="14" fill="none" stroke="#2D3052" stroke-width="1"/>
    <text x="248" y="19" font-family="monospace" font-size="11" fill="#64748B">No training on your data</text>
  </g>

  <!-- Right side: playground mockup frame -->
  <rect x="780" y="80" width="360" height="470" rx="12" fill="#1A1A24" stroke="#2D3052" stroke-width="1"/>
  <rect x="780" y="80" width="360" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="800" y="115" font-family="monospace" font-size="11" fill="#F59E0B" letter-spacing="1">TRY CONTEXTIQ</text>

  <!-- Model pill -->
  <rect x="880" y="100" width="140" height="24" rx="4" fill="#111118" stroke="#2D3052" stroke-width="1"/>
  <text x="896" y="116" font-family="monospace" font-size="10" fill="#94A3B8">Claude Sonnet 4 ▾</text>

  <!-- Document area -->
  <rect x="800" y="140" width="320" height="36" rx="6" fill="#111118" stroke="#1E2035" stroke-width="1"/>
  <text x="820" y="162" font-family="monospace" font-size="11" fill="#F8FAFC">Q4 Roadmap.pdf</text>
  <text x="1060" y="162" font-family="monospace" font-size="10" fill="#64748B">24 pages</text>

  <!-- Input -->
  <rect x="800" y="196" width="320" height="60" rx="0" fill="none" stroke="#1E2035" stroke-width="0" stroke-dasharray="0"/>
  <text x="800" y="215" font-family="monospace" font-size="9" fill="#64748B" letter-spacing="1">QUESTION</text>
  <text x="800" y="235" font-family="Arial, sans-serif" font-size="13" fill="#F8FAFC">What are the top 3 priorities in Q4?</text>

  <!-- Divider -->
  <line x1="800" y1="260" x2="1120" y2="260" stroke="#1E2035" stroke-width="1"/>

  <!-- Answer area label -->
  <text x="800" y="282" font-family="monospace" font-size="9" fill="#64748B" letter-spacing="1">ANSWER</text>

  <!-- Answer lines -->
  <text x="800" y="305" font-family="monospace" font-size="11" fill="#F8FAFC">1. Ship the eval pipeline</text>
  <rect x="968" y="294" width="32" height="14" rx="3" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="0.75"/>
  <text x="974" y="305" font-family="monospace" font-size="9" fill="#F59E0B">[p.4]</text>

  <text x="800" y="340" font-family="monospace" font-size="11" fill="#F8FAFC">2. Enterprise SSO launch</text>
  <rect x="974" y="329" width="38" height="14" rx="3" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="0.75"/>
  <text x="980" y="340" font-family="monospace" font-size="9" fill="#F59E0B">[p.11]</text>

  <text x="800" y="375" font-family="monospace" font-size="11" fill="#F8FAFC">3. Latency SLA reduction</text>
  <rect x="974" y="364" width="38" height="14" rx="3" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="0.75"/>
  <text x="980" y="375" font-family="monospace" font-size="9" fill="#F59E0B">[p.17]</text>

  <!-- Footer -->
  <line x1="780" y1="520" x2="1140" y2="520" stroke="#1E2035" stroke-width="1"/>
  <rect x="800" y="532" width="60" height="16" rx="8" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.2)" stroke-width="0.75"/>
  <text x="812" y="544" font-family="monospace" font-size="9" fill="#F59E0B">&lt;187ms</text>
  <text x="1040" y="544" font-family="monospace" font-size="10" fill="#64748B">Copy as JSON</text>

  <!-- Bottom bar -->
  <rect y="595" width="1200" height="35" fill="#111118"/>
  <text x="60" y="617" font-family="monospace" font-size="11" fill="#64748B">Day 13 of 365 · Free MIT Template · allanninal.dev/templates</text>
</svg>
