<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: charcoal -->
  <rect width="1200" height="630" fill="#1C1C1C"/>

  <!-- Flame stripe top -->
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63329"/>
      <stop offset="50%" stop-color="#F0A500"/>
      <stop offset="100%" stop-color="#E63329"/>
    </linearGradient>
  </defs>
  <rect y="0" width="1200" height="6" fill="url(#flameGrad)"/>

  <!-- Diagonal texture lines -->
  <g opacity="0.04" stroke="#FAF7F2" stroke-width="1">
    <line x1="0" y1="0" x2="200" y2="630"/>
    <line x1="100" y1="0" x2="300" y2="630"/>
    <line x1="200" y1="0" x2="400" y2="630"/>
    <line x1="300" y1="0" x2="500" y2="630"/>
    <line x1="400" y1="0" x2="600" y2="630"/>
    <line x1="500" y1="0" x2="700" y2="630"/>
    <line x1="600" y1="0" x2="800" y2="630"/>
    <line x1="700" y1="0" x2="900" y2="630"/>
    <line x1="800" y1="0" x2="1000" y2="630"/>
    <line x1="900" y1="0" x2="1100" y2="630"/>
    <line x1="1000" y1="0" x2="1200" y2="630"/>
    <line x1="1100" y1="0" x2="1300" y2="630"/>
  </g>

  <!-- Left: large flame triangle accent -->
  <polygon points="0,630 120,630 0,300" fill="#E63329" opacity="0.3"/>

  <!-- Eyebrow text -->
  <text x="80" y="195" font-family="Barlow Condensed, Impact, sans-serif" font-size="22" font-weight="700" fill="#F0A500" letter-spacing="6" text-transform="uppercase">AUSTIN, TX · ROLLING SINCE 2019</text>

  <!-- Main title: ROLLED SMOKE -->
  <text x="80" y="320" font-family="Barlow Condensed, Impact, sans-serif" font-size="130" font-weight="800" fill="#FAF7F2" letter-spacing="2">ROLLED</text>
  <text x="80" y="455" font-family="Barlow Condensed, Impact, sans-serif" font-size="130" font-weight="800" fill="#E63329" letter-spacing="2">SMOKE</text>

  <!-- Tagline -->
  <text x="80" y="510" font-family="Barlow Condensed, Impact, sans-serif" font-size="28" font-weight="600" fill="#9A938A" letter-spacing="3">WOOD-SMOKED BBQ TACOS ON WHEELS</text>

  <!-- Right: truck icon graphic -->
  <g transform="translate(850, 200)">
    <!-- Smoker cylinder -->
    <rect x="40" y="140" width="200" height="90" rx="5" fill="#3A3A3A"/>
    <rect x="60" y="120" width="160" height="30" rx="4" fill="#4A4A4A"/>
    <!-- Chimney -->
    <rect x="220" y="60" width="25" height="80" rx="3" fill="#3A3A3A"/>
    <!-- Smoke wisps -->
    <path d="M232 55 Q225 30 235 10" stroke="#F0A500" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M240 50 Q250 25 240 5" stroke="#E63329" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="80" cy="238" r="22" fill="#1C1C1C" stroke="#6B6B6B" stroke-width="3"/>
    <circle cx="200" cy="238" r="22" fill="#1C1C1C" stroke="#6B6B6B" stroke-width="3"/>
    <!-- Hitch -->
    <rect x="0" y="185" width="45" height="12" rx="2" fill="#4A4A4A"/>
    <!-- Flame accent on smoker -->
    <rect x="40" y="140" width="200" height="5" rx="0" fill="#E63329" opacity="0.7"/>
    <!-- $ price tags -->
    <text x="105" y="175" font-family="Barlow Condensed, sans-serif" font-size="32" font-weight="800" fill="#F0A500">$4–$7</text>
  </g>

  <!-- Bottom stripe -->
  <rect y="624" width="1200" height="6" fill="url(#flameGrad)"/>
</svg>
