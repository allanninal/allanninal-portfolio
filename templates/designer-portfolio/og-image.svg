<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: warm near-black -->
  <rect width="1200" height="630" fill="#1A1410"/>

  <!-- Parchment texture block (decorative) -->
  <rect x="700" y="0" width="500" height="630" fill="#F0ECE6" opacity="0.06"/>

  <!-- Terracotta accent block — right side -->
  <rect x="1080" y="0" width="8" height="630" fill="#C45B3A"/>

  <!-- Terracotta horizontal rule -->
  <rect x="80" y="290" width="160" height="4" fill="#C45B3A"/>

  <!-- Main name — MARA VOSS in display style -->
  <text
    x="80"
    y="230"
    font-family="'Archivo Black', 'Arial Black', 'Impact', sans-serif"
    font-size="96"
    font-weight="900"
    fill="#FAFAF8"
    letter-spacing="-2"
  >MARA VOSS</text>

  <!-- Role — italic serif style simulation -->
  <text
    x="80"
    y="350"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    fill="#F0ECE6"
    font-style="italic"
    letter-spacing="0.5"
    opacity="0.85"
  >Brand &amp; Editorial Designer</text>

  <!-- Location + availability -->
  <text
    x="80"
    y="410"
    font-family="'Arial', sans-serif"
    font-size="14"
    fill="#9A8F87"
    letter-spacing="3"
  >AMSTERDAM · AVAILABLE FOR SELECT PROJECTS</text>

  <!-- Divider line -->
  <rect x="80" y="460" width="1040" height="1" fill="#F0ECE6" opacity="0.12"/>

  <!-- Bottom: project count -->
  <text
    x="80"
    y="510"
    font-family="'Arial', sans-serif"
    font-size="13"
    fill="#6B6055"
    letter-spacing="2"
  >SELECTED WORKS · BRAND IDENTITY · EDITORIAL · PACKAGING · ART DIRECTION</text>

  <!-- Decorative number -->
  <text
    x="980"
    y="240"
    font-family="'Archivo Black', 'Arial Black', sans-serif"
    font-size="200"
    font-weight="900"
    fill="#F0ECE6"
    opacity="0.04"
    text-anchor="middle"
  >04</text>
</svg>
