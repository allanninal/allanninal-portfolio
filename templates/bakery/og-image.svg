<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background: cocoa dark -->
  <rect width="1200" height="630" fill="#3D2314"/>

  <!-- Warm gradient circle -->
  <circle cx="900" cy="315" r="360" fill="#E8C87A" fill-opacity="0.08"/>
  <circle cx="200" cy="500" r="200" fill="#C0405E" fill-opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#C0405E"/>

  <!-- Decorative wheat band bottom -->
  <rect x="0" y="590" width="1200" height="40" fill="#E8C87A" fill-opacity="0.12"/>

  <!-- Brand name -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#FFF4E0" letter-spacing="-1">The Golden Crumb</text>

  <!-- Tagline -->
  <text x="80" y="272" font-family="Georgia, serif" font-size="36" fill="#E8C87A" font-style="italic">Baked fresh daily. Gone by noon.</text>

  <!-- Divider -->
  <rect x="80" y="300" width="60" height="3" fill="#C0405E" rx="2"/>

  <!-- Sub-text -->
  <text x="80" y="360" font-family="Georgia, serif" font-size="24" fill="#C9A44A">Artisan Bakery &#x26; Custom Cakes &#xB7; Portland, OR</text>

  <!-- Bakery icon -->
  <text x="1020" y="360" font-size="180" fill="#E8C87A" fill-opacity="0.2">🍞</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Georgia, serif" font-size="20" fill="#7A5040">templates.allanninal.dev/bakery/</text>

  <!-- Day badge -->
  <rect x="80" y="470" width="160" height="40" rx="20" fill="#C0405E" fill-opacity="0.3" stroke="#C0405E" stroke-width="1.5"/>
  <text x="160" y="496" font-family="Georgia, serif" font-size="18" fill="#F7D6DC" text-anchor="middle" font-weight="700">Day 37 of 365</text>
</svg>
