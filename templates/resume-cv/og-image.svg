<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Dark slate base -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Subtle warm-paper border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Eyebrow -->
  <text x="80" y="130" text-anchor="start"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="3.2">RESUME / CV</text>

  <!-- Display name -->
  <text x="80" y="280" text-anchor="start"
    font-family="'Source Serif 4', Georgia, serif"
    font-size="120" font-weight="700" fill="#F1F5F9" letter-spacing="-3">Nadia Costa</text>

  <!-- Title -->
  <text x="80" y="345" text-anchor="start"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="32" font-weight="400" fill="#CBD5E1">Senior Software Engineer</text>

  <!-- Meta line -->
  <text x="80" y="395" text-anchor="start"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="20" font-weight="400" fill="#94A3B8">Lisbon, Portugal · Open to remote · 8 years experience</text>

  <!-- Bottom: contact strip -->
  <line x1="80" y1="465" x2="640" y2="465" stroke="#334155" stroke-width="1"/>
  <text x="80" y="510" text-anchor="start"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="18" font-weight="500" fill="#CBD5E1">nadia@nadiacosta.dev</text>
  <text x="80" y="540" text-anchor="start"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="14" font-weight="400" fill="#94A3B8">linkedin.com/in/nadiacosta · github.com/nadiacosta</text>

  <!-- Right side: large mark -->
  <text x="1080" y="380" text-anchor="end"
    font-family="'Source Serif 4', Georgia, serif"
    font-size="320" font-weight="600" fill="#1E293B" letter-spacing="-12">N</text>

  <!-- "Download PDF" badge -->
  <rect x="80" y="565" width="180" height="32" rx="4" fill="#F1F5F9"/>
  <text x="170" y="585" text-anchor="middle"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-size="13" font-weight="600" fill="#0F172A" letter-spacing="0.5">PRINT-FRIENDLY · A4 / LETTER</text>
</svg>
