<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Barber pole icon -->
  <rect width="32" height="32" rx="4" fill="#0E0E0E"/>
  <!-- Pole cylinder -->
  <rect x="11" y="4" width="10" height="24" rx="5" fill="#1A1A1A" stroke="#A67C00" stroke-width="1"/>
  <!-- Stripes -->
  <clipPath id="pole">
    <rect x="11" y="4" width="10" height="24" rx="5"/>
  </clipPath>
  <g clip-path="url(#pole)">
    <rect x="11" y="4" width="10" height="6" fill="#8B1A1A"/>
    <rect x="11" y="10" width="10" height="3" fill="#F5F0E6"/>
    <rect x="11" y="13" width="10" height="6" fill="#A67C00"/>
    <rect x="11" y="19" width="10" height="3" fill="#F5F0E6"/>
    <rect x="11" y="22" width="10" height="6" fill="#8B1A1A"/>
  </g>
  <!-- Cap top -->
  <rect x="9" y="3" width="14" height="3" rx="2" fill="#A67C00"/>
  <!-- Cap bottom -->
  <rect x="9" y="26" width="14" height="3" rx="2" fill="#A67C00"/>
</svg>
