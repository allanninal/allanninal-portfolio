<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF7F4"/>

  <!-- Blush radial backdrop -->
  <radialGradient id="blush" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F0D8D4" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#FAF7F4" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#blush)"/>

  <!-- Top + bottom decorative lines -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#E8E0D8" stroke-width="1"/>
  <line x1="80" y1="570" x2="1120" y2="570" stroke="#E8E0D8" stroke-width="1"/>

  <!-- Corner ornaments -->
  <text x="80" y="90" font-family="Georgia, serif" font-size="20" fill="#C4847A" text-anchor="start">◇</text>
  <text x="1120" y="90" font-family="Georgia, serif" font-size="20" fill="#C4847A" text-anchor="end">◇</text>
  <text x="80" y="575" font-family="Georgia, serif" font-size="20" fill="#C4847A" text-anchor="start">◇</text>
  <text x="1120" y="575" font-family="Georgia, serif" font-size="20" fill="#C4847A" text-anchor="end">◇</text>

  <!-- Eyebrow label -->
  <text x="600" y="190" font-family="'DM Sans', Arial, sans-serif" font-size="16" letter-spacing="6" fill="#7A6E6A" text-anchor="middle" text-transform="uppercase">TOGETHER WITH THEIR FAMILIES</text>

  <!-- Names — main headline -->
  <text x="600" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-style="italic" fill="#2C2420" text-anchor="middle">Emma &amp; James</text>

  <!-- Divider line -->
  <line x1="460" y1="345" x2="560" y2="345" stroke="#E8E0D8" stroke-width="1"/>
  <text x="600" y="352" font-family="Georgia, serif" font-size="18" fill="#C4847A" text-anchor="middle">◇</text>
  <line x1="640" y1="345" x2="740" y2="345" stroke="#E8E0D8" stroke-width="1"/>

  <!-- Date -->
  <text x="600" y="400" font-family="'DM Sans', Arial, sans-serif" font-size="22" letter-spacing="4" fill="#7A6E6A" text-anchor="middle">SEPTEMBER 19, 2026</text>

  <!-- Venue -->
  <text x="600" y="440" font-family="'DM Sans', Arial, sans-serif" font-size="16" letter-spacing="3" fill="#B0A49E" text-anchor="middle">THE ORCHARD AT SUNRISE FARM · NAPA, CA</text>
</svg>
