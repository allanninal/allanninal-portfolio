<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#E4E5E0"/>

  <!-- The archive is the page: three sheets in right-to-left order, the
       leftmost one a spread, which is the thing this template is about. -->
  <g stroke="#17191B" stroke-width="3">
    <g transform="translate(700,150)">
      <rect x="0" y="0" width="140" height="200" fill="#F2F3EF"/>
      <rect x="10" y="10" width="120" height="70" fill="#C4C7C1"/>
      <rect x="10" y="88" width="57" height="50" fill="#F2F3EF"/>
      <rect x="73" y="88" width="57" height="50" fill="#F2F3EF"/>
      <rect x="10" y="146" width="120" height="44" fill="#F2F3EF"/>
    </g>
    <g transform="translate(870,150)">
      <rect x="0" y="0" width="140" height="200" fill="#F2F3EF"/>
      <rect x="10" y="10" width="120" height="56" fill="#F2F3EF"/>
      <rect x="10" y="74" width="120" height="56" fill="#C4C7C1"/>
      <rect x="10" y="138" width="120" height="52" fill="#F2F3EF"/>
    </g>
    <g transform="translate(1040,150)">
      <rect x="0" y="0" width="140" height="200" fill="#F2F3EF"/>
      <rect x="10" y="10" width="120" height="120" fill="#ADB1AA"/>
      <rect x="10" y="138" width="120" height="52" fill="#F2F3EF"/>
    </g>
  </g>
  <text x="1040" y="380" font-family="'Zen Kaku Gothic New', system-ui, sans-serif" font-size="20" font-weight="700" fill="#54585A" letter-spacing="3">&#8592; READS THIS WAY</text>

  <text x="80" y="180" font-family="'Zen Kaku Gothic New', system-ui, sans-serif" font-size="22" font-weight="700" fill="#8F2A1C" letter-spacing="5">ONGOING &#183; ALL AGES &#183; RIGHT TO LEFT</text>

  <text x="80" y="290" font-family="'Shippori Mincho', Georgia, serif" font-size="86" font-weight="700" fill="#17191B" letter-spacing="-2">Low Tide Radio</text>

  <text x="80" y="350" font-family="system-ui, sans-serif" font-size="27" fill="#54585A">The archive is the front page.</text>
  <text x="80" y="392" font-family="system-ui, sans-serif" font-size="27" fill="#54585A">19 chapters, 490 pages, three ways in.</text>

  <rect x="80" y="452" width="12" height="60" fill="#8F2A1C"/>
  <text x="112" y="480" font-family="'Zen Kaku Gothic New', system-ui, sans-serif" font-size="22" font-weight="700" fill="#17191B">Free Astro template &#183; Day 127 of 365</text>
  <text x="112" y="508" font-family="system-ui, sans-serif" font-size="20" fill="#54585A">allanninal.dev/templates</text>
</svg>
