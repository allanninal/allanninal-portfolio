<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Dark espresso background -->
  <rect width="1200" height="630" fill="#1C1410"/>

  <!-- Rose accent left panel -->
  <rect x="0" y="0" width="6" height="630" fill="#C9857A"/>

  <!-- Decorative rose circle -->
  <circle cx="950" cy="315" r="280" fill="none" stroke="#C9857A" stroke-width="1" opacity="0.15"/>
  <circle cx="950" cy="315" r="200" fill="none" stroke="#C9857A" stroke-width="1" opacity="0.10"/>

  <!-- Eye / lash decorative icon -->
  <g transform="translate(870, 240)" opacity="0.3">
    <ellipse cx="80" cy="70" rx="75" ry="55" fill="none" stroke="#C9857A" stroke-width="3"/>
    <circle cx="80" cy="70" r="25" fill="#C9857A"/>
    <!-- Lash lines -->
    <line x1="80" y1="15" x2="72" y2="-10" stroke="#C9857A" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="17" x2="96" y2="-8" stroke="#C9857A" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="25" x2="125" y2="0" stroke="#C9857A" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="17" x2="50" y2="-6" stroke="#C9857A" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="30" x2="28" y2="8" stroke="#C9857A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Studio name -->
  <text x="80" y="160" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#C9857A" letter-spacing="6">LUMIÈRE LASH STUDIO</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#FBF7F4">Eyelash</text>
  <text x="80" y="360" font-family="Georgia, serif" font-size="72" font-weight="700" font-style="italic" fill="#C9857A">Extensions</text>

  <!-- Tagline -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="22" fill="rgba(245,239,233,0.65)">Classic · Hybrid · Volume · Mega-Volume</text>

  <!-- Location -->
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="18" fill="rgba(245,239,233,0.45)">Austin, TX · Private Studio Suite · Online Booking</text>

  <!-- Divider -->
  <line x1="80" y1="540" x2="340" y2="540" stroke="#C9857A" stroke-width="1" opacity="0.4"/>

  <!-- Footer -->
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="15" fill="rgba(245,239,233,0.35)" letter-spacing="2">Day 58 of 365 — templates.allanninal.dev</text>
</svg>
