<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0A0A"/>
      <stop offset="40%" stop-color="#7A1F1F"/>
      <stop offset="75%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E8C4A0"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Noise texture -->
  <rect width="1200" height="630" opacity="0.12" filter="url(#noise)" fill="#FF9900"/>

  <!-- Italian-flag accent strip -->
  <rect x="0" y="0" width="12" height="630" fill="#2D6A4F"/>
  <rect x="12" y="0" width="12" height="630" fill="#FFFFFF" opacity="0.9"/>
  <rect x="24" y="0" width="12" height="630" fill="#C0392B"/>

  <!-- Pizza circle illustration -->
  <circle cx="960" cy="315" r="260" fill="#D4A96A" opacity="0.25"/>
  <circle cx="960" cy="315" r="220" fill="#C0392B" opacity="0.3"/>
  <circle cx="960" cy="315" r="180" fill="#F5E642" opacity="0.15"/>

  <!-- Text block -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="-2">Napoli's</text>
  <line x1="80" y1="255" x2="520" y2="255" stroke="#C0392B" stroke-width="4"/>
  <line x1="80" y1="265" x2="420" y2="265" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>

  <text x="80" y="330" font-family="Georgia, serif" font-size="36" font-style="italic" fill="rgba(255,255,255,0.90)">Authentic Neapolitan Pizzeria</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" letter-spacing="3">LITTLE ITALY, MANHATTAN · EST. 1974</text>

  <!-- CTA pill -->
  <rect x="80" y="440" width="300" height="64" rx="8" fill="#FFFFFF"/>
  <text x="230" y="480" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#C0392B" text-anchor="middle">Order Online — Slice</text>

  <!-- Day badge -->
  <rect x="80" y="530" width="200" height="40" rx="6" fill="rgba(255,255,255,0.12)"/>
  <text x="180" y="556" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)" text-anchor="middle">Day 32 of 365 · Free MIT Template</text>
</svg>
