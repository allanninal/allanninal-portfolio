<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Meridian Paint Studio — clear coat does not grow back, Boulder Colorado">
  <rect width="1200" height="630" fill="#F5F5F7"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="640" y="120" font-size="15" fill="#54555F" letter-spacing="3">PANEL DEPTH &#183; 2019 AUDI A4</text>

    <!-- Four panels, one thin, one repainted. -->
    <g font-size="21" fill="#15161C">
      <text x="640" y="176">Bonnet</text><text x="640" y="252">Roof</text>
      <text x="640" y="328">Boot lid</text><text x="640" y="404">Front door, left</text>
    </g>
    <g font-size="21" font-weight="bold" fill="#15161C" font-family="monospace">
      <text x="1060" y="176">42 &#181;m</text><text x="1060" y="328">46 &#181;m</text>
    </g>
    <g font-size="21" font-weight="bold" fill="#262E72" font-family="monospace">
      <text x="1060" y="252">31 &#181;m</text><text x="1060" y="404">140 &#181;m</text>
    </g>

    <g>
      <rect x="800" y="160" width="230" height="14" fill="#DCDCE4"/><rect x="800" y="160" width="60" height="14" fill="#15161C"/>
      <rect x="800" y="236" width="230" height="14" fill="#DCDCE4"/><rect x="800" y="236" width="44" height="14" fill="#2B3480"/>
      <rect x="800" y="312" width="230" height="14" fill="#DCDCE4"/><rect x="800" y="312" width="66" height="14" fill="#15161C"/>
      <rect x="800" y="388" width="230" height="14" fill="#DCDCE4"/><rect x="800" y="388" width="201" height="14" fill="#2B3480"/>
      <!-- the floor -->
      <path d="M836 152v98" stroke="#2B3480" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <g font-size="14" fill="#54555F">
      <text x="640" y="196">Healthy</text>
      <text x="640" y="272" fill="#262E72">Do not polish</text>
      <text x="640" y="348">Healthy</text>
      <text x="640" y="424" fill="#262E72">Repainted</text>
    </g>
    <path d="M640 452h420" stroke="#15161C" stroke-width="3"/>
    <text x="640" y="484" font-size="15" fill="#54555F">Floor is 25 &#181;m. The roof has six left.</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="126" font-size="19" font-weight="bold" fill="#15161C" letter-spacing="4">MERIDIAN PAINT STUDIO</text>
    <text x="72" y="256" font-size="56" font-weight="bold" fill="#15161C">Clear coat does</text>
    <text x="72" y="324" font-size="56" font-weight="bold" fill="#262E72">not grow back.</text>
    <text x="72" y="392" font-size="23" fill="#54555F">We measure before we polish, and</text>
    <text x="72" y="424" font-size="23" fill="#54555F">sometimes the measurement is a no.</text>
    <text x="72" y="500" font-size="18" fill="#15161C">Day 89 of 365 &#183; allanninal.dev/templates</text>
  </g>
</svg>
