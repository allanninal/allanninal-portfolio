<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="55%" stop-color="#F2ECE3"/>
      <stop offset="100%" stop-color="#EEE6DA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Sage left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="#4A6557"/>

  <!-- Botanical lotus decoration right side -->
  <ellipse cx="960" cy="315" rx="140" ry="200" fill="none" stroke="#4A6557" stroke-width="1.5" opacity="0.12" transform="rotate(0 960 315)"/>
  <ellipse cx="960" cy="315" rx="140" ry="200" fill="none" stroke="#4A6557" stroke-width="1.5" opacity="0.10" transform="rotate(60 960 315)"/>
  <ellipse cx="960" cy="315" rx="140" ry="200" fill="none" stroke="#4A6557" stroke-width="1.5" opacity="0.10" transform="rotate(120 960 315)"/>
  <ellipse cx="960" cy="315" rx="70" ry="100" fill="none" stroke="#A05540" stroke-width="1" opacity="0.15" transform="rotate(30 960 315)"/>
  <ellipse cx="960" cy="315" rx="70" ry="100" fill="none" stroke="#A05540" stroke-width="1" opacity="0.12" transform="rotate(90 960 315)"/>
  <ellipse cx="960" cy="315" rx="70" ry="100" fill="none" stroke="#A05540" stroke-width="1" opacity="0.12" transform="rotate(150 960 315)"/>
  <circle cx="960" cy="315" r="20" fill="#C0D8C8" opacity="0.5"/>

  <!-- Studio name -->
  <text x="70" y="220" font-family="Georgia, serif" font-size="80" font-weight="400" fill="#2C2420" letter-spacing="0">Sattva</text>
  <text x="70" y="310" font-family="Georgia, serif" font-size="80" font-weight="400" fill="#4A6557" letter-spacing="0" font-style="italic">Yoga Studio</text>

  <!-- Tagline -->
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="28" fill="#7A6F6A" letter-spacing="4">FIND YOUR STILLNESS.</text>

  <!-- Divider line -->
  <rect x="70" y="405" width="140" height="2" fill="#4A6557"/>
  <rect x="218" y="405" width="50" height="2" fill="#A05540"/>

  <!-- Location -->
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="20" fill="#7A6F6A" letter-spacing="2">PORTLAND, OR</text>

  <!-- Class type badges -->
  <rect x="70" y="470" width="130" height="32" rx="5" fill="#4A6557"/>
  <text x="135" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VINYASA</text>

  <rect x="214" y="470" width="110" height="32" rx="5" fill="#F4EFE8" stroke="#A05540" stroke-width="1"/>
  <text x="269" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#A05540" text-anchor="middle" letter-spacing="1">HATHA</text>

  <rect x="338" y="470" width="90" height="32" rx="5" fill="#C0D8C8"/>
  <text x="383" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2420" text-anchor="middle" letter-spacing="1">YIN</text>

  <rect x="442" y="470" width="150" height="32" rx="5" fill="#F4EFE8" stroke="#4A6557" stroke-width="1"/>
  <text x="517" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4A6557" text-anchor="middle" letter-spacing="1">RESTORATIVE</text>

  <rect x="606" y="470" width="130" height="32" rx="5" fill="#F4EFE8" stroke="#A05540" stroke-width="1"/>
  <text x="671" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#A05540" text-anchor="middle" letter-spacing="1">PRENATAL</text>

  <!-- New student offer CTA -->
  <rect x="70" y="520" width="360" height="52" rx="6" fill="#4A6557"/>
  <text x="250" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NEW STUDENT: $30 / 30 DAYS</text>

  <!-- Site URL -->
  <text x="1180" y="610" font-family="Arial, sans-serif" font-size="16" fill="#A09080" text-anchor="end">allanninal.dev/templates</text>
