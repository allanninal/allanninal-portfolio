<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F9F0"/>
      <stop offset="100%" stop-color="#FEFFFE"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="80" r="200" fill="#1D6B1D" opacity="0.06"/>
  <circle cx="220" cy="550" r="160" fill="#B53500" opacity="0.05"/>
  <circle cx="1100" cy="500" r="120" fill="#1D6B1D" opacity="0.04"/>

  <!-- Green accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#1D6B1D"/>

  <!-- Main juice bottle illustration -->
  <g transform="translate(820, 80)">
    <!-- Bottle body -->
    <rect x="30" y="120" width="110" height="200" rx="18" fill="url(#bottleGrad)"/>
    <rect x="30" y="120" width="110" height="200" rx="18" fill="#A5D6A7" opacity="0.3"/>
    <!-- Neck -->
    <rect x="48" y="88" width="74" height="40" rx="8" fill="#C8E6C9"/>
    <!-- Cap -->
    <rect x="44" y="70" width="82" height="26" rx="7" fill="#1D6B1D"/>
    <!-- Label -->
    <rect x="38" y="138" width="94" height="140" rx="8" fill="white" opacity="0.88"/>
    <text x="85" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#1A2E1A">PRESSED &amp;</text>
    <text x="85" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#1A2E1A">NOURISHED</text>
    <text x="85" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#4A6B4A">COLD-PRESSED</text>
    <rect x="38" y="200" width="94" height="2" fill="#1D6B1D" opacity="0.35"/>
    <text x="85" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="#4A6B4A">Cucumber · Kale</text>
    <text x="85" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="#4A6B4A">Apple · Lemon · Ginger</text>
    <circle cx="85" cy="256" r="12" fill="#E8F5E8"/>
    <path d="M85 248c-3 0-6 3.5-6 6.5s2 5.5 3.5 6c0-1.5.8-3 2.5-3.5-1.5.5-2 1.5-2 3 .5.1 1.5.25 2 .25 3 0 6-2.5 6-5.5S88 248 85 248z" fill="#1D6B1D"/>
    <!-- Leaf decorations -->
    <ellipse cx="20" cy="180" rx="20" ry="35" fill="#2D7A1D" opacity="0.65" transform="rotate(-25 20 180)"/>
  </g>

  <!-- Orange slice accent -->
  <g transform="translate(940, 340)">
    <circle cx="0" cy="0" r="50" fill="#FFF0E6"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#B53500" stroke-width="3" opacity="0.4"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#B53500" stroke-width="2" opacity="0.3"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#B53500" stroke-width="2" opacity="0.3"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#B53500" stroke-width="1.5" opacity="0.2"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#B53500" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="28" fill="#FFE8D6" opacity="0.7"/>
  </g>

  <!-- Text content -->
  <!-- Eyebrow -->
  <text x="80" y="160" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1D6B1D" letter-spacing="4">COLD-PRESSED · ORGANIC · PORTLAND OR</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="system-ui,sans-serif" font-size="88" font-weight="900" fill="#1A2E1A" letter-spacing="-3">Pressed &amp;</text>
  <text x="80" y="368" font-family="system-ui,sans-serif" font-size="88" font-weight="900" fill="#1A2E1A" letter-spacing="-3">Nourished.</text>

  <!-- Sub -->
  <text x="80" y="435" font-family="system-ui,sans-serif" font-size="24" fill="#4A6B4A">Cold-pressed juices · Smoothies · Açaí Bowls · Wellness Shots</text>

  <!-- Green divider line -->
  <rect x="80" y="468" width="500" height="3" fill="#1D6B1D" opacity="0.3" rx="2"/>

  <!-- Stats row -->
  <text x="80" y="520" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1D6B1D">6 Organic Farms</text>
  <text x="80" y="544" font-family="system-ui,sans-serif" font-size="14" fill="#4A6B4A">300+ juices cold-pressed daily</text>

  <!-- Bottom attribution -->
  <text x="80" y="600" font-family="system-ui,sans-serif" font-size="16" fill="#5C7C5C">Day 41 of 365 · allanninal.dev/templates</text>
</svg>
