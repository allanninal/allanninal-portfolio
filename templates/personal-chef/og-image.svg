<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background — deep aubergine -->
  <rect width="1200" height="630" fill="#2E1520"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Decorative circles — plate motif -->
  <circle cx="980" cy="315" r="260" stroke="rgba(232,196,184,0.08)" stroke-width="1.5"/>
  <circle cx="980" cy="315" r="210" stroke="rgba(232,196,184,0.06)" stroke-width="1"/>
  <circle cx="980" cy="315" r="160" stroke="rgba(232,196,184,0.05)" stroke-width="0.75"/>

  <!-- Accent lines -->
  <rect x="80" y="190" width="60" height="2" fill="#B8884A"/>

  <!-- Chef hat suggestion top right -->
  <ellipse cx="980" cy="240" rx="60" ry="22" fill="rgba(232,196,184,0.08)"/>
  <rect x="930" y="218" width="100" height="8" rx="3" fill="rgba(232,196,184,0.06)"/>

  <!-- Main name -->
  <text x="80" y="270" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#FDF9F5" letter-spacing="-1">Marcus Elliot</text>

  <!-- Title line -->
  <text x="80" y="330" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#E8C4B8">Private Chef · New York City</text>

  <!-- Tagline -->
  <text x="80" y="400" font-family="'Arial', sans-serif" font-size="22" font-weight="300" fill="rgba(253,249,245,0.65)" letter-spacing="0.5">Michelin-trained cuisine in the intimacy of your home</text>

  <!-- Service pills -->
  <rect x="80" y="440" width="180" height="34" rx="2" fill="rgba(184,136,74,0.15)" stroke="rgba(184,136,74,0.4)" stroke-width="1"/>
  <text x="170" y="462" font-family="'Arial', sans-serif" font-size="13" font-weight="600" fill="#D4A96A" text-anchor="middle" letter-spacing="1">PRIVATE DINNERS</text>

  <rect x="274" y="440" width="160" height="34" rx="2" fill="rgba(184,136,74,0.12)" stroke="rgba(184,136,74,0.3)" stroke-width="1"/>
  <text x="354" y="462" font-family="'Arial', sans-serif" font-size="13" font-weight="600" fill="#D4A96A" text-anchor="middle" letter-spacing="1">MEAL PREP</text>

  <rect x="448" y="440" width="190" height="34" rx="2" fill="rgba(184,136,74,0.10)" stroke="rgba(184,136,74,0.25)" stroke-width="1"/>
  <text x="543" y="462" font-family="'Arial', sans-serif" font-size="13" font-weight="600" fill="#D4A96A" text-anchor="middle" letter-spacing="1">COOKING LESSONS</text>

  <!-- Day badge -->
  <rect x="1060" y="30" width="110" height="42" rx="4" fill="rgba(184,136,74,0.2)"/>
  <text x="1115" y="46" font-family="'Arial', sans-serif" font-size="11" font-weight="600" fill="#D4A96A" text-anchor="middle" letter-spacing="1">DAY 49</text>
  <text x="1115" y="62" font-family="'Arial', sans-serif" font-size="10" fill="rgba(253,249,245,0.5)" text-anchor="middle">OF 365</text>

  <!-- Bottom border -->
  <rect x="0" y="610" width="1200" height="20" fill="rgba(184,136,74,0.12)"/>
  <text x="80" y="624" font-family="'Arial', sans-serif" font-size="12" fill="rgba(253,249,245,0.4)" letter-spacing="1">365-TEMPLATE ROADMAP · allanninal.dev/templates</text>
</svg>
