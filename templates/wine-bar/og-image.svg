<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5C1530" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1A0A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9965A" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C9965A" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#C9965A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9965A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1A0A14"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Subtle vertical divider -->
  <line x1="600" y1="60" x2="600" y2="570" stroke="#4A2840" stroke-width="1" opacity="0.5"/>

  <!-- Gold horizontal accent -->
  <rect x="0" y="314" width="1200" height="1" fill="url(#gold-line)" opacity="0.3"/>

  <!-- Left panel: logo + tagline -->
  <g transform="translate(80, 160)">
    <!-- Wine glass icon -->
    <svg x="0" y="0" width="52" height="68" viewBox="0 0 22 28" fill="none">
      <path d="M3 2 H19 L16 12 C15 16 12 18 11 18 C10 18 7 16 6 12 Z" stroke="#C9965A" stroke-width="1.2" fill="none"/>
      <line x1="11" y1="18" x2="11" y2="25" stroke="#C9965A" stroke-width="1.2"/>
      <line x1="6" y1="25" x2="16" y2="25" stroke="#C9965A" stroke-width="1.2"/>
    </svg>

    <!-- Wordmark -->
    <text x="68" y="30" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="5" fill="#F2E8DC" text-transform="uppercase">MAISON</text>
    <text x="68" y="62" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="5" fill="#F2E8DC">VELOURS</text>

    <!-- Gold line -->
    <rect x="0" y="90" width="50" height="2" fill="#C9965A"/>

    <!-- Tagline -->
    <text x="0" y="125" font-family="Georgia, serif" font-size="18" fill="#B89FAE" font-style="italic">A Wine Bar of Unhurried Pleasures.</text>

    <!-- Location -->
    <text x="0" y="165" font-family="Arial, sans-serif" font-size="13" fill="#7B5869" letter-spacing="2">WEST VILLAGE, NEW YORK CITY  ·  EST. 2019</text>
  </g>

  <!-- Right panel: wine info -->
  <g transform="translate(650, 120)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#C9965A" letter-spacing="3" font-weight="600">THE CELLAR</text>
    <text x="0" y="40" font-family="Georgia, serif" font-size="22" fill="#F2E8DC" font-weight="600">Curated Natural Wines</text>
    <text x="0" y="68" font-family="Georgia, serif" font-size="22" fill="#F2E8DC" font-weight="600">Small Plates · Events</text>

    <rect x="0" y="88" width="40" height="1" fill="#C9965A" opacity="0.6"/>

    <!-- Wine categories -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="6" height="24" fill="#7B1D42" rx="2"/>
      <text x="16" y="17" font-family="Arial, sans-serif" font-size="14" fill="#DDD0C4">Red &amp; Orange Wines</text>
    </g>
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="6" height="24" fill="#B89FAE" rx="2" opacity="0.6"/>
      <text x="16" y="17" font-family="Arial, sans-serif" font-size="14" fill="#DDD0C4">White &amp; Sparkling</text>
    </g>
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="6" height="24" fill="#C9965A" rx="2"/>
      <text x="16" y="17" font-family="Arial, sans-serif" font-size="14" fill="#DDD0C4">Tastings &amp; Winemaker Dinners</text>
    </g>

    <rect x="0" y="225" width="80" height="1" fill="#4A2840"/>

    <text x="0" y="255" font-family="Arial, sans-serif" font-size="12" fill="#7B5869" letter-spacing="1">14 GROVE ST · WEST VILLAGE · NYC</text>
    <text x="0" y="278" font-family="Arial, sans-serif" font-size="12" fill="#7B5869" letter-spacing="1">WED–SUN  ·  RESERVATIONS VIA RESY</text>

    <!-- Day label -->
    <text x="0" y="340" font-family="Arial, sans-serif" font-size="11" fill="#4A2840" letter-spacing="2">DAY 43 OF 365 · TEMPLATES.ALLANNINAL.DEV</text>
  </g>

  <!-- Corner accents -->
  <path d="M0,0 L60,0 L0,60" fill="none" stroke="#4A2840" stroke-width="1" opacity="0.4"/>
  <path d="M1200,0 L1140,0 L1200,60" fill="none" stroke="#4A2840" stroke-width="1" opacity="0.4"/>
  <path d="M0,630 L60,630 L0,570" fill="none" stroke="#4A2840" stroke-width="1" opacity="0.4"/>
  <path d="M1200,630 L1140,630 L1200,570" fill="none" stroke="#4A2840" stroke-width="1" opacity="0.4"/>
</svg>
