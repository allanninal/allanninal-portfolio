<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1318"/>
      <stop offset="60%" style="stop-color:#1C2128"/>
      <stop offset="100%" style="stop-color:#252D38"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(201,124,46,0)"/>
      <stop offset="100%" style="stop-color:rgba(201,124,46,0.08)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Diagonal stripe -->
  <polygon points="700,0 1200,0 1200,630 900,630" fill="url(#stripe)"/>

  <!-- Left copper bar -->
  <rect x="60" y="60" width="4" height="80" fill="#C97C2E"/>

  <!-- Hop icon -->
  <g transform="translate(930, 280)">
    <circle cx="0" cy="0" r="100" stroke="#C97C2E" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="70" stroke="#C97C2E" stroke-width="1.5" fill="none" opacity="0.2"/>
    <ellipse cx="0" cy="0" rx="30" ry="70" fill="#C97C2E" opacity="0.4"/>
    <line x1="-65" y1="-40" x2="0" y2="0" stroke="#C97C2E" stroke-width="2" opacity="0.5"/>
    <line x1="65" y1="-40" x2="0" y2="0" stroke="#C97C2E" stroke-width="2" opacity="0.5"/>
    <line x1="-65" y1="40" x2="0" y2="0" stroke="#C97C2E" stroke-width="2" opacity="0.5"/>
    <line x1="65" y1="40" x2="0" y2="0" stroke="#C97C2E" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="18" font-weight="400" letter-spacing="8" fill="#C97C2E" text-anchor="start" text-transform="uppercase">ASHEVILLE, NC · EST. 2016</text>

  <!-- Main title -->
  <text x="80" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#F5F0E8" text-anchor="start">Iron &amp; Grain</text>
  <text x="80" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#F5F0E8" text-anchor="start">Brewing Co.</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="Georgia, serif" font-size="26" fill="#8A9BB0" text-anchor="start">Brewed Slow. Poured Proud.</text>

  <!-- Divider -->
  <rect x="80" y="460" width="80" height="2" fill="#C97C2E"/>

  <!-- Footer -->
  <text x="80" y="510" font-family="Georgia, serif" font-size="18" fill="#8A9BB0" text-anchor="start">Craft Ales · Lagers · Taproom · Brewery Tours</text>

  <!-- Template badge -->
  <rect x="80" y="548" width="280" height="28" rx="2" fill="rgba(201,124,46,0.15)" stroke="#C97C2E" stroke-width="1"/>
  <text x="220" y="567" font-family="Georgia, serif" font-size="13" fill="#C97C2E" text-anchor="middle" letter-spacing="2">FREE MIT TEMPLATE · DAY 42 / 365</text>
</svg>
