<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2E2A18"/>
      <stop offset="60%" stop-color="#1A1A13"/>
      <stop offset="100%" stop-color="#0F0F0A"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grain overlay -->
  <rect width="1200" height="630" opacity="0.15" filter="url(#grain)"/>

  <!-- Top gold rule -->
  <rect x="0" y="0" width="1200" height="3" fill="#C4973A" opacity="0.6"/>

  <!-- Bottom gold rule -->
  <rect x="0" y="627" width="1200" height="3" fill="#C4973A" opacity="0.6"/>

  <!-- Left vertical accent -->
  <rect x="80" y="120" width="1" height="390" fill="#C4973A" opacity="0.3"/>

  <!-- Right vertical accent -->
  <rect x="1119" y="120" width="1" height="390" fill="#C4973A" opacity="0.3"/>

  <!-- Restaurant name -->
  <text
    x="600"
    y="270"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="86"
    font-weight="700"
    fill="#F0EDE4"
    letter-spacing="-1"
  >The Cedar &amp; Rye</text>

  <!-- Gold decorative rule -->
  <line x1="440" y1="305" x2="560" y2="305" stroke="#C4973A" stroke-width="1" opacity="0.6"/>
  <circle cx="600" cy="305" r="4" fill="#C4973A"/>
  <line x1="640" y1="305" x2="760" y2="305" stroke="#C4973A" stroke-width="1" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="600"
    y="355"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="400"
    fill="#9A9480"
    letter-spacing="4"
  >SEASONAL AMERICAN KITCHEN</text>

  <!-- Neighborhood -->
  <text
    x="600"
    y="392"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    fill="#5A5548"
    letter-spacing="2"
  >WILLIAMSBURG, BROOKLYN</text>

  <!-- Bottom label -->
  <text
    x="600"
    y="530"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    fill="#5A5548"
    letter-spacing="2"
  >Day 22 of 365 — Free Template by allanninal.dev</text>
</svg>
