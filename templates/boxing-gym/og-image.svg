<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120C05"/>
      <stop offset="60%" stop-color="#1C1108"/>
      <stop offset="100%" stop-color="#251810"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Red left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#EF4444"/>
  <rect x="6" y="0" width="3" height="630" fill="#C09030" opacity="0.6"/>

  <!-- Ring ropes right side -->
  <line x1="500" y1="120" x2="1200" y2="120" stroke="#EF4444" stroke-width="3" opacity="0.18"/>
  <line x1="500" y1="200" x2="1200" y2="200" stroke="#EF4444" stroke-width="2" opacity="0.12"/>
  <line x1="500" y1="280" x2="1200" y2="280" stroke="#C09030" stroke-width="1.5" opacity="0.10"/>
  <!-- Corner post -->
  <rect x="488" y="80" width="10" height="500" rx="5" fill="#EF4444" opacity="0.20"/>

  <!-- Grid texture -->
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#332718" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Boxing glove silhouette -->
  <ellipse cx="980" cy="320" rx="160" ry="120" fill="#EF4444" opacity="0.06"/>
  <ellipse cx="990" cy="340" rx="110" ry="80" fill="#EF4444" opacity="0.04"/>

  <!-- Gym name -->
  <text x="80" y="220" font-family="Impact, sans-serif" font-size="96" font-weight="900" fill="#F5EFE0" letter-spacing="2">CORNER CLUB</text>
  <text x="80" y="320" font-family="Impact, sans-serif" font-size="96" font-weight="900" fill="#EF4444" letter-spacing="2">BOXING</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="32" fill="#9B8B75" letter-spacing="4">STEP INTO THE RING.</text>

  <!-- Divider line -->
  <rect x="80" y="415" width="180" height="3" fill="#EF4444"/>
  <rect x="268" y="415" width="60" height="3" fill="#C09030"/>

  <!-- Location + class types -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="22" fill="#9B8B75" letter-spacing="2">PHILADELPHIA, PA</text>

  <!-- Class types badges -->
  <rect x="80" y="490" width="160" height="36" rx="4" fill="#EF4444"/>
  <text x="160" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1108" text-anchor="middle" letter-spacing="1">BOXING</text>

  <rect x="252" y="490" width="180" height="36" rx="4" fill="#2A1D0E" stroke="#EF4444" stroke-width="1"/>
  <text x="342" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F5EFE0" text-anchor="middle" letter-spacing="1">KICKBOXING</text>

  <rect x="444" y="490" width="150" height="36" rx="4" fill="#2A1D0E" stroke="#C09030" stroke-width="1"/>
  <text x="519" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F5EFE0" text-anchor="middle" letter-spacing="1">SPARRING</text>

  <rect x="606" y="490" width="180" height="36" rx="4" fill="#2A1D0E" stroke="#EF4444" stroke-width="1"/>
  <text x="696" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F5EFE0" text-anchor="middle" letter-spacing="1">CONDITIONING</text>

  <!-- Free intro CTA -->
  <rect x="80" y="550" width="340" height="50" rx="4" fill="#EF4444"/>
  <text x="250" y="582" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1108" text-anchor="middle" letter-spacing="1">FIRST SESSION FREE</text>

  <!-- Site URL -->
  <text x="1180" y="610" font-family="Arial, sans-serif" font-size="18" fill="#9B8B75" text-anchor="end">templates.allanninal.dev</text>
</svg>
