<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: warm cream -->
  <rect width="1200" height="630" fill="#F9F5EE"/>

  <!-- Accent bar top -->
  <rect width="1200" height="8" fill="#0D7377"/>

  <!-- Left accent column -->
  <rect x="0" y="8" width="6" height="622" fill="#0D7377" opacity="0.4"/>

  <!-- Background texture circles -->
  <circle cx="950" cy="100" r="320" fill="#0D7377" opacity="0.04"/>
  <circle cx="1050" cy="520" r="200" fill="#0D7377" opacity="0.05"/>

  <!-- Cohort badge -->
  <rect x="72" y="72" width="148" height="34" rx="17" fill="#CCF0EE"/>
  <text x="146" y="94" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#094E51" letter-spacing="0.08em">COHORT 5 · LIVE</text>

  <!-- Course title line 1 -->
  <text x="72" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#1C1917" letter-spacing="-0.02em">Systems Thinking</text>

  <!-- Course title line 2 (accent) -->
  <text x="72" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#0D7377" letter-spacing="-0.02em">for Product Managers</text>

  <!-- Tagline -->
  <text x="72" y="340" font-family="'Public Sans', system-ui, sans-serif" font-size="22" fill="#57534E">Stop firefighting. Start building products that compound.</text>

  <!-- Divider -->
  <line x1="72" y1="378" x2="680" y2="378" stroke="#E7E0D5" stroke-width="1.5"/>

  <!-- Stats row -->
  <text x="72" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0D7377">4</text>
  <text x="72" y="444" font-family="'Public Sans', system-ui, sans-serif" font-size="13" fill="#57534E">cohorts</text>

  <text x="176" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0D7377">160+</text>
  <text x="176" y="444" font-family="'Public Sans', system-ui, sans-serif" font-size="13" fill="#57534E">PM alumni</text>

  <text x="300" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0D7377">40</text>
  <text x="300" y="444" font-family="'Public Sans', system-ui, sans-serif" font-size="13" fill="#57534E">seats max</text>

  <text x="390" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0D7377">4.9/5</text>
  <text x="390" y="444" font-family="'Public Sans', system-ui, sans-serif" font-size="13" fill="#57534E">avg rating</text>

  <!-- Start date -->
  <text x="72" y="510" font-family="'Public Sans', system-ui, sans-serif" font-size="15" fill="#57534E">6 weeks · Live calls Tue &amp; Thu · Starting March 10, 2026</text>

  <!-- Instructor / brand -->
  <text x="72" y="555" font-family="'Public Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1917">Allan Ninal</text>
  <text x="72" y="577" font-family="'Public Sans', system-ui, sans-serif" font-size="13" fill="#57534E">templates.allanninal.dev</text>

  <!-- Right: decorative element -->
  <rect x="820" y="100" width="300" height="430" rx="16" fill="#0D7377" opacity="0.06"/>
  <rect x="840" y="130" width="260" height="4" rx="2" fill="#0D7377" opacity="0.2"/>

  <!-- Week pills in right column -->
  <rect x="840" y="160" width="200" height="32" rx="8" fill="#CCF0EE"/>
  <text x="940" y="181" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#094E51">WEEK 1 · Systems Mindset</text>

  <rect x="840" y="206" width="220" height="32" rx="8" fill="#CCF0EE" opacity="0.8"/>
  <text x="950" y="227" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#094E51">WEEK 2 · User Behavior</text>

  <rect x="840" y="252" width="240" height="32" rx="8" fill="#CCF0EE" opacity="0.65"/>
  <text x="960" y="273" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#094E51">WEEK 3 · Prioritization</text>

  <rect x="840" y="298" width="220" height="32" rx="8" fill="#CCF0EE" opacity="0.5"/>
  <text x="950" y="319" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#094E51">WEEK 4 · Metrics</text>

  <rect x="840" y="344" width="230" height="32" rx="8" fill="#CCF0EE" opacity="0.35"/>
  <text x="955" y="365" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#094E51">WEEK 5 · Roadmapping</text>

  <rect x="840" y="390" width="210" height="32" rx="8" fill="#0D7377" opacity="0.8"/>
  <text x="945" y="411" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F9F5EE">WEEK 6 · Capstone</text>

  <!-- Accent bar bottom -->
  <rect x="0" y="622" width="1200" height="8" fill="#0D7377"/>
</svg>
