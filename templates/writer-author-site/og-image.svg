<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: warm ivory -->
  <rect width="1200" height="630" fill="#F7F4EE"/>

  <!-- Prussian blue accent bars -->
  <rect x="0" y="0" width="8" height="630" fill="#1B4F72"/>
  <rect x="1192" y="0" width="8" height="630" fill="#1B4F72"/>

  <!-- Top and bottom rules -->
  <rect x="0" y="60" width="1200" height="1" fill="#1B4F72" opacity="0.2"/>
  <rect x="0" y="569" width="1200" height="1" fill="#1B4F72" opacity="0.2"/>

  <!-- CSS Book cover illustration (simplified) -->
  <!-- Book shadow -->
  <rect x="120" y="150" width="200" height="310" rx="3" fill="#0F3254"/>
  <!-- Book face -->
  <rect x="112" y="143" width="200" height="310" rx="3" fill="#1B4F72"/>
  <!-- Book publisher strip -->
  <rect x="112" y="143" width="200" height="36" rx="3" fill="#163F5C"/>
  <rect x="112" y="170" width="200" height="10" fill="#163F5C"/>
  <!-- Book ornament rules -->
  <rect x="124" y="192" width="176" height="1.5" fill="#D4E8F7" opacity="0.6"/>
  <rect x="124" y="209" width="176" height="0.75" fill="#D4E8F7" opacity="0.35"/>
  <!-- Book title area -->
  <text x="212" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#F7F4EE">The Salt</text>
  <text x="212" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" font-style="italic" fill="#F7F4EE">Archive</text>
  <!-- Book ornament dot -->
  <circle cx="212" cy="333" r="4" fill="#D4E8F7" opacity="0.7"/>
  <circle cx="212" cy="320" r="2" fill="#D4E8F7" opacity="0.45"/>
  <circle cx="212" cy="346" r="2" fill="#D4E8F7" opacity="0.45"/>
  <!-- Book author strip -->
  <rect x="112" y="416" width="200" height="37" rx="0" fill="#163F5C"/>
  <rect x="112" y="416" width="200" height="1" fill="#F7F4EE" opacity="0.2"/>
  <text x="212" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#F7F4EE" opacity="0.85">Eleanor Voss</text>

  <!-- Publisher year text in top strip -->
  <text x="130" y="165" font-family="Arial, sans-serif" font-size="9" fill="#F7F4EE" opacity="0.7" letter-spacing="2">RIVERHEAD</text>
  <text x="285" y="165" font-family="Arial, sans-serif" font-size="9" fill="#F7F4EE" opacity="0.7">2023</text>

  <!-- Additional ghost books -->
  <!-- Book 2 -->
  <rect x="348" y="175" width="160" height="248" rx="2" fill="#2C2520" opacity="0.7"/>
  <rect x="342" y="170" width="160" height="248" rx="2" fill="#2C2520" opacity="0.85"/>
  <rect x="342" y="170" width="160" height="30" rx="2" fill="#231D18"/>
  <text x="422" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#F7F4EE" opacity="0.9">Where Silence</text>
  <text x="422" y="273" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#F7F4EE" opacity="0.9">Accumulates</text>
  <text x="422" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#F7F4EE" opacity="0.6">Eleanor Voss</text>

  <!-- Book 3 -->
  <rect x="524" y="195" width="130" height="200" rx="2" fill="#D4C9A8" opacity="0.5"/>
  <rect x="519" y="190" width="130" height="200" rx="2" fill="#DDD8CE" opacity="0.8"/>
  <text x="584" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1A1410" opacity="0.8">The Glass</text>
  <text x="584" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1A1410" opacity="0.8">Inheritance</text>
  <text x="584" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#1A1410" opacity="0.5">Eleanor Voss</text>

  <!-- Main text block -->
  <!-- Author name -->
  <text x="690" y="218" font-family="Georgia, serif" font-size="14" fill="#1B4F72" letter-spacing="3" font-style="italic">ELEANOR VOSS</text>

  <!-- Main heading -->
  <text x="690" y="290" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1A1410" letter-spacing="-1">Writer /</text>
  <text x="690" y="358" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1A1410" letter-spacing="-1">Author Site</text>

  <!-- Subtitle line -->
  <rect x="690" y="378" width="60" height="2" fill="#1B4F72"/>

  <!-- Tagline -->
  <text x="690" y="420" font-family="Georgia, serif" font-size="20" fill="#6B6059" font-style="italic">Four novels. Riverhead Books.</text>
  <text x="690" y="450" font-family="Georgia, serif" font-size="20" fill="#6B6059" font-style="italic">Edinburgh, Scotland.</text>

  <!-- Day badge -->
  <rect x="690" y="496" width="130" height="34" rx="2" fill="#1B4F72"/>
  <text x="755" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F7F4EE" letter-spacing="1">DAY 17 / 365</text>

  <!-- Bottom credit -->
  <text x="600" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B6059" opacity="0.6">allanninal.dev/templates</text>
</svg>
