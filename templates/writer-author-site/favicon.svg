<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#1B4F72" rx="4"/>
  <!-- Book shape -->
  <rect x="8" y="6" width="14" height="20" rx="1" fill="#F7F4EE"/>
  <!-- Spine -->
  <rect x="8" y="6" width="2.5" height="20" fill="#D4E8F7" opacity="0.6"/>
  <!-- Title lines suggesting text -->
  <rect x="13" y="10" width="7" height="1.5" rx="0.5" fill="#1B4F72" opacity="0.7"/>
  <rect x="13" y="13.5" width="5" height="1" rx="0.5" fill="#1B4F72" opacity="0.4"/>
  <!-- Ornament dot -->
  <circle cx="16.5" cy="19" r="1.5" fill="#1B4F72" opacity="0.5"/>
  <!-- Author line -->
  <rect x="11" y="22" width="10" height="1" rx="0.5" fill="#1B4F72" opacity="0.3"/>
</svg>
