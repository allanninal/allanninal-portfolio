<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A12"/>
      <stop offset="100%" stop-color="#10121C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C58E0"/>
      <stop offset="100%" stop-color="#1448C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Large dojo circle motif (right side) -->
  <circle cx="880" cy="315" r="280" stroke="#1C58E0" stroke-width="1.5" fill="none" opacity="0.15"/>
  <circle cx="880" cy="315" r="210" stroke="#1C58E0" stroke-width="1" fill="none" opacity="0.10"/>
  <circle cx="880" cy="315" r="140" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.15"/>
  <circle cx="880" cy="315" r="70"  stroke="#1C58E0" stroke-width="1" fill="none" opacity="0.18"/>

  <!-- Diamond / focus lines -->
  <polygon points="880,35 1160,315 880,595 600,315" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.12"/>

  <!-- Belt stripe band (top) -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Left content area -->
  <!-- Eyebrow -->
  <text x="72" y="180" font-family="'Oswald', system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#D4AF37" text-transform="uppercase">PORTLAND, OR · MARTIAL ARTS DOJO</text>

  <!-- Main heading -->
  <text x="72" y="280" font-family="'Oswald', system-ui, sans-serif" font-size="90" font-weight="700" fill="#F2F0F8" letter-spacing="2">BUSHIDO</text>
  <text x="72" y="370" font-family="'Oswald', system-ui, sans-serif" font-size="90" font-weight="700" fill="#F2F0F8" letter-spacing="2">ACADEMY</text>

  <!-- Tagline -->
  <text x="72" y="430" font-family="'Inter', system-ui, sans-serif" font-size="26" fill="#9898B0">Discipline. Respect. Power.</text>

  <!-- Disciplines row -->
  <text x="72" y="500" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#70AAFF" letter-spacing="1">BJJ · Muay Thai · Judo · Karate · MMA</text>

  <!-- Intro offer tag -->
  <rect x="72" y="528" width="260" height="40" rx="4" fill="#1C58E0"/>
  <text x="202" y="553" font-family="'Oswald', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">FIRST WEEK FREE</text>

  <!-- Logo mark (bottom right of left panel) -->
  <circle cx="880" cy="315" r="45" fill="#1C58E0" opacity="0.20"/>
  <circle cx="880" cy="315" r="20" fill="#1C58E0"/>
  <polygon points="880,295 894,315 880,335 866,315" stroke="#D4AF37" stroke-width="2" fill="none"/>

  <!-- Bottom strip -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.40"/>
</svg>
