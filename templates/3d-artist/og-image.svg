<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Noor Haddad — 3D artist, Tulsa">
  <rect width="1200" height="630" fill="#F4F5F8"/>
  <text x="80" y="212" font-family="Arial Narrow, Impact, sans-serif" font-weight="bold" font-size="128" fill="#14161C" letter-spacing="-2">Ask for the</text>
  <text x="80" y="330" font-family="Arial Narrow, Impact, sans-serif" font-weight="bold" font-size="128" fill="#263ED9" letter-spacing="-2">wireframe.</text>
  <text x="80" y="392" font-family="ui-monospace, Menlo, monospace" font-size="23" fill="#636779" letter-spacing="3">NOOR HADDAD &#183; 3D ARTIST &#183; TULSA, OK</text>
  <text x="80" y="452" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="27" fill="#14161C">A beauty render is the easiest thing in 3D to fake</text>
  <text x="80" y="490" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="27" fill="#14161C">and the hardest thing to use.</text>
  <!-- Quads left, triangulated right: the figure the page draws, at poster scale. -->
  <g transform="translate(760 430)">
    <g fill="none" stroke="#157746" stroke-width="1.6">
      <path d="M0 0 H160 M0 20 H160 M0 40 H160 M0 60 H160 M0 80 H160 M0 100 H160"/>
      <path d="M0 0 V100 M24 0 V100 M48 0 V100 M72 0 V100 M92 0 V100 M108 0 V100 M122 0 V100 M134 0 V100 M145 0 V100 M160 0 V100"/>
    </g>
    <g transform="translate(200 0)" fill="none" stroke="#BA352C" stroke-width="1.6">
      <path d="M0 0 H160 M0 33 H160 M0 66 H160 M0 100 H160"/>
      <path d="M0 0 V100 M40 0 V100 M80 0 V100 M120 0 V100 M160 0 V100"/>
      <path d="M0 0 L40 33 M40 0 L80 33 M80 0 L120 33 M120 0 L160 33"/>
      <path d="M0 33 L40 66 M40 33 L80 66 M80 33 L120 66 M120 33 L160 66"/>
      <path d="M0 66 L40 100 M40 66 L80 100 M80 66 L120 100 M120 66 L160 100"/>
    </g>
  </g>
  <text x="80" y="600" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#636779">SEVEN CHECKS &#183; NONE NEED 3D SOFTWARE</text>
</svg>
