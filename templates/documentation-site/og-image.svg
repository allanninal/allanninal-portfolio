<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Cobalt fill -->
  <rect width="1200" height="630" fill="#0F1117"/>

  <!-- Subtle grid pattern (decorative) -->
  <defs>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top stripe (cobalt) -->
  <rect width="1200" height="14" fill="#2563EB"/>

  <!-- Logo block -->
  <rect x="80" y="92" width="74" height="74" rx="14" fill="#2563EB"/>
  <path d="M 100 113 H 124 A 14 14 0 0 1 124 141 H 100 Z M 100 127 H 124 M 117 141 L 134 158" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Library name (mono) -->
  <text x="80" y="288" text-anchor="start"
    font-family="'IBM Plex Mono', 'SF Mono', monospace"
    font-size="92" font-weight="600" fill="#F8FAFC"
    letter-spacing="-3">routekit</text>

  <!-- Tagline -->
  <text x="80" y="350" text-anchor="start"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-size="32" font-weight="400" fill="#CBD5E1"
    letter-spacing="-0.3">Type-safe client-side routing for TypeScript.</text>

  <!-- Mock install snippet -->
  <rect x="80" y="400" width="540" height="68" rx="10" fill="#16202E" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="445" text-anchor="start"
    font-family="'IBM Plex Mono', 'SF Mono', monospace"
    font-size="22" font-weight="500" fill="#60A5FA">$</text>
  <text x="130" y="445" text-anchor="start"
    font-family="'IBM Plex Mono', 'SF Mono', monospace"
    font-size="22" font-weight="500" fill="#F8FAFC">npm install routekit</text>

  <!-- Footer badges -->
  <rect x="80" y="510" width="76" height="32" rx="6" fill="#2563EB"/>
  <text x="118" y="531" text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-size="13" font-weight="600" fill="white">v1.0.0</text>

  <rect x="166" y="510" width="60" height="32" rx="6" fill="#16202E" stroke="#1E293B" stroke-width="1"/>
  <text x="196" y="531" text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-size="13" font-weight="600" fill="#60A5FA">MIT</text>

  <rect x="236" y="510" width="78" height="32" rx="6" fill="#16202E" stroke="#1E293B" stroke-width="1"/>
  <text x="275" y="531" text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-size="13" font-weight="600" fill="#60A5FA">3.0 kB</text>
</svg>
