<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Warm charcoal base -->
  <rect width="1200" height="630" fill="#1A1917"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F5F3EF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Burnt-orange top stripe -->
  <rect width="1200" height="14" fill="#C2410C"/>

  <!-- Studio eyebrow -->
  <text x="80" y="120" text-anchor="start"
    font-family="'Bricolage Grotesque', system-ui, sans-serif"
    font-size="20" font-weight="600" fill="#C2410C"
    letter-spacing="3.2">FIELDWORK STUDIO · EST. 2019 · TORONTO</text>

  <!-- Display tagline (Fraunces) -->
  <text x="80" y="280" text-anchor="start"
    font-family="'Fraunces', Georgia, serif"
    font-size="120" font-weight="400" fill="#F5F3EF"
    letter-spacing="-3">Clear, distinctive,</text>
  <text x="80" y="400" text-anchor="start"
    font-family="'Fraunces', Georgia, serif"
    font-size="120" font-weight="400" fill="#C2410C"
    letter-spacing="-3">durable.</text>

  <!-- Subhead -->
  <text x="80" y="475" text-anchor="start"
    font-family="'Bricolage Grotesque', system-ui, sans-serif"
    font-size="22" font-weight="400" fill="#948A82">A brand &amp; digital design studio for software companies that take craft seriously.</text>

  <!-- Bottom service strip -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" text-anchor="start"
      font-family="'Bricolage Grotesque', system-ui, sans-serif"
      font-size="18" font-weight="600" fill="#F5F3EF" letter-spacing="2">IDENTITY  ·  WEB  ·  CREATIVE DIRECTION</text>
  </g>

  <!-- Decorative letterform on right -->
  <text x="1090" y="410" text-anchor="end"
    font-family="'Fraunces', Georgia, serif"
    font-size="380" font-weight="400" fill="#C2410C" fill-opacity="0.18"
    letter-spacing="-12">F</text>
</svg>
