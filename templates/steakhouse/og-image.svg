<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background: near-black obsidian -->
  <rect width="1200" height="630" fill="#0F0D0B"/>

  <!-- Diagonal grain pattern -->
  <defs>
    <pattern id="grain" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40L40 0M-5 5L5 -5M35 45L45 35" stroke="#C49A3C" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grain)" opacity="0.15"/>

  <!-- Oxblood atmospheric glow bottom-left -->
  <radialGradient id="oxbloodGlow" cx="0%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#6B1B1B" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#6B1B1B" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#oxbloodGlow)"/>

  <!-- Brass glow top-right -->
  <radialGradient id="brassGlow" cx="100%" cy="0%" r="50%">
    <stop offset="0%" stop-color="#9A7828" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#9A7828" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#brassGlow)"/>

  <!-- Left content area -->
  <!-- Ornamental rule line top -->
  <line x1="80" y1="140" x2="200" y2="140" stroke="#C49A3C" stroke-width="1"/>
  <text x="210" y="145" font-family="Georgia, serif" font-size="13" fill="#C49A3C" letter-spacing="4" font-weight="bold">CHICAGO, IL · EST. 2009</text>

  <!-- Main title -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="96" fill="#F5F0E8" letter-spacing="-2">Ember &amp; Bone</text>

  <!-- Italic tagline -->
  <text x="82" y="330" font-family="Georgia, serif" font-size="28" fill="#D4B05E" font-style="italic">Prime Dry-Age Chophouse</text>

  <!-- Brass horizontal rule -->
  <line x1="80" y1="370" x2="380" y2="370" stroke="#C49A3C" stroke-width="1.5"/>

  <!-- Descriptor line -->
  <text x="80" y="415" font-family="Georgia, serif" font-size="20" fill="#9A9080">Hand-selected USDA Prime &amp; A5 Wagyu · In-house 28–60 day dry-aging</text>
  <text x="80" y="445" font-family="Georgia, serif" font-size="20" fill="#9A9080">Live-fire finishing · 600-label wine cellar</text>

  <!-- Stats strip -->
  <text x="80" y="520" font-family="Georgia, serif" font-size="36" fill="#C49A3C">28–60</text>
  <text x="80" y="545" font-family="Georgia, serif" font-size="11" fill="#9A9080" letter-spacing="3">DAYS DRY-AGED</text>

  <line x1="190" y1="500" x2="190" y2="550" stroke="#3A3228" stroke-width="1"/>

  <text x="205" y="520" font-family="Georgia, serif" font-size="36" fill="#C49A3C">4</text>
  <text x="205" y="545" font-family="Georgia, serif" font-size="11" fill="#9A9080" letter-spacing="3">RANCH PARTNERS</text>

  <line x1="280" y1="500" x2="280" y2="550" stroke="#3A3228" stroke-width="1"/>

  <text x="295" y="520" font-family="Georgia, serif" font-size="36" fill="#C49A3C">600+</text>
  <text x="295" y="545" font-family="Georgia, serif" font-size="11" fill="#9A9080" letter-spacing="3">WINE LABELS</text>

  <!-- Right: steak illustration panel -->
  <rect x="780" y="60" width="360" height="510" fill="#1A1714" stroke="#3A3228" stroke-width="1"/>

  <!-- Steak SVG simplified for OG image -->
  <ellipse cx="960" cy="430" rx="130" ry="18" fill="#111" opacity="0.5"/>
  <ellipse cx="960" cy="420" rx="125" ry="70" fill="#1C1915" stroke="#2E291F" stroke-width="1"/>

  <!-- Steak body -->
  <path d="M870 385 C865 360 875 330 895 315 C915 300 940 295 960 293 C980 291 1005 296 1020 310 C1038 325 1048 350 1050 375 C1052 400 1045 422 1030 435 C1015 448 990 455 965 454 C940 453 912 446 893 430 C876 416 875 412 870 385Z" fill="#4A2010"/>

  <!-- Marbling -->
  <path d="M910 308 Q920 325 912 348 Q904 368 915 388" stroke="#E8D9C8" stroke-width="1.5" opacity="0.5" fill="none"/>
  <path d="M950 298 Q958 316 950 340 Q942 360 953 380" stroke="#E8D9C8" stroke-width="1.2" opacity="0.4" fill="none"/>
  <path d="M985 300 Q994 318 986 342 Q978 362 990 382" stroke="#E8D9C8" stroke-width="1" opacity="0.35" fill="none"/>

  <!-- Grill marks -->
  <path d="M890 315 L915 375" stroke="#180B03" stroke-width="7" opacity="0.65" stroke-linecap="round"/>
  <path d="M920 305 L945 365" stroke="#180B03" stroke-width="7" opacity="0.55" stroke-linecap="round"/>
  <path d="M950 300 L975 360" stroke="#180B03" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
  <path d="M980 303 L1005 363" stroke="#180B03" stroke-width="5.5" opacity="0.38" stroke-linecap="round"/>

  <!-- Butter pat melting -->
  <ellipse cx="958" cy="355" rx="24" ry="12" fill="#C49A3C" opacity="0.7" transform="rotate(-8 958 355)"/>
  <ellipse cx="958" cy="355" rx="18" ry="8" fill="#D4B05E" opacity="0.6" transform="rotate(-8 958 355)"/>

  <!-- Bone -->
  <path d="M1010 310 L1038 280" stroke="#EAE0D0" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <circle cx="1040" cy="278" r="7" fill="#EAE0D0" opacity="0.8"/>

  <!-- Brass corner ornaments on panel -->
  <line x1="780" y1="60" x2="820" y2="60" stroke="#C49A3C" stroke-width="2"/>
  <line x1="780" y1="60" x2="780" y2="100" stroke="#C49A3C" stroke-width="2"/>
  <line x1="1100" y1="60" x2="1140" y2="60" stroke="#C49A3C" stroke-width="2"/>
  <line x1="1140" y1="60" x2="1140" y2="100" stroke="#C49A3C" stroke-width="2"/>
  <line x1="780" y1="530" x2="820" y2="530" stroke="#C49A3C" stroke-width="2"/>
  <line x1="780" y1="530" x2="780" y2="490" stroke="#C49A3C" stroke-width="2"/>
  <line x1="1100" y1="530" x2="1140" y2="530" stroke="#C49A3C" stroke-width="2"/>
  <line x1="1140" y1="530" x2="1140" y2="490" stroke="#C49A3C" stroke-width="2"/>

  <!-- Label on panel -->
  <text x="960" y="195" font-family="Georgia, serif" font-size="13" fill="#C49A3C" letter-spacing="3" text-anchor="middle">45-DAY DRY-AGED RIBEYE</text>
  <line x1="870" y1="210" x2="1050" y2="210" stroke="#C49A3C" stroke-width="0.75" opacity="0.6"/>

  <!-- Steam wisps -->
  <path d="M940 280 Q945 265 940 252 Q935 242 940 230" stroke="#C49A3C" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M960 275 Q967 260 960 247 Q955 237 962 224" stroke="#C49A3C" stroke-width="1.2" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M980 278 Q986 263 980 250 Q975 240 982 227" stroke="#C49A3C" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Bottom brand bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0A0806"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#3A3228" stroke-width="1"/>
  <text x="80" y="613" font-family="Georgia, serif" font-size="13" fill="#9A9080" letter-spacing="2">EMBERANDBONE.COM</text>
  <text x="600" y="613" font-family="Georgia, serif" font-size="13" fill="#3A3228" text-anchor="middle" letter-spacing="2">· · ·</text>
  <text x="1120" y="613" font-family="Georgia, serif" font-size="13" fill="#9A9080" text-anchor="end" letter-spacing="1">ASTRO TEMPLATE · DAY 36 OF 365</text>
</svg>
