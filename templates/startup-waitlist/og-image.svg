<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#111113"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:rgba(191,255,0,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Product name -->
  <text x="600" y="260" text-anchor="middle"
    font-family="'Geist', 'Inter', system-ui, sans-serif"
    font-size="110" font-weight="800" fill="#BFFF00"
    letter-spacing="-4">
    Nexus
  </text>
  <!-- Tagline -->
  <text x="600" y="330" text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="26" font-weight="400" fill="#71717A"
    letter-spacing="-0.5">
    The AI workspace that thinks with you.
  </text>
  <!-- Launch date badge -->
  <rect x="480" y="390" width="240" height="40" rx="20"
    fill="rgba(191,255,0,0.12)" stroke="rgba(191,255,0,0.3)" stroke-width="1"/>
  <text x="600" y="414" text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="14" font-weight="600" fill="#BFFF00" letter-spacing="1">
    LAUNCHING SEPT 2026
  </text>
</svg>
