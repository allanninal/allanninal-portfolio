<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E3A5F"/>

  <!-- Dot grid pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D4E3F5" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#D4931A"/>

  <!-- Mangrove leaf mark (large) -->
  <g transform="translate(80, 150)">
    <circle cx="60" cy="60" r="60" fill="#D4E3F5" fill-opacity="0.15"/>
    <path d="M60 100 C60 100 30 75 30 48 C30 33 43.5 22 60 22 C76.5 22 90 33 90 48 C90 75 60 100 60 100Z" fill="#D4E3F5" fill-opacity="0.6"/>
    <path d="M60 100 L60 55" stroke="#D4E3F5" stroke-width="3" stroke-opacity="0.4"/>
    <path d="M60 68 C52 62 43 63 38 60" stroke="#D4E3F5" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M60 78 C68 72 77 73 82 70" stroke="#D4E3F5" stroke-width="2" stroke-opacity="0.4"/>
  </g>

  <!-- Tag -->
  <text x="220" y="220" font-family="Georgia, serif" font-size="16" fill="#D4E3F5" fill-opacity="0.7" letter-spacing="4">ENVIRONMENTAL CONSERVATION · 501(c)(3)</text>

  <!-- Org name -->
  <text x="220" y="290" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white" letter-spacing="-1">Mangrove Coast</text>
  <text x="220" y="360" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white" letter-spacing="-1">Foundation</text>

  <!-- Tagline -->
  <text x="220" y="420" font-family="system-ui, sans-serif" font-size="24" fill="#D4E3F5" fill-opacity="0.8">Restoring Philippine Coastlines, One Mangrove at a Time</text>

  <!-- Stats strip -->
  <rect x="220" y="460" width="760" height="1" fill="#D4E3F5" fill-opacity="0.2"/>
  <text x="220" y="500" font-family="Georgia, serif" font-size="20" font-weight="600" fill="white">2.3M+ seedlings planted</text>
  <text x="520" y="500" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#D4E3F5" fill-opacity="0.5">·</text>
  <text x="545" y="500" font-family="Georgia, serif" font-size="20" font-weight="600" fill="white">38 communities</text>
  <text x="745" y="500" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#D4E3F5" fill-opacity="0.5">·</text>
  <text x="770" y="500" font-family="Georgia, serif" font-size="20" font-weight="600" fill="white">12 years</text>

  <!-- Gold accent line at bottom -->
  <rect x="0" y="615" width="1200" height="15" fill="#D4931A" fill-opacity="0.6"/>
</svg>
