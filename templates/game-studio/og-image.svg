<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Slate Harbour Games — nine people in Lawrence, Kansas">
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <text x="80" y="188" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="92" fill="#1A1814" letter-spacing="-2">We publish the</text>
  <text x="80" y="284" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="92" fill="#4D7413" letter-spacing="-2">salary bands.</text>
  <text x="80" y="344" font-family="ui-monospace, Menlo, monospace" font-size="21" fill="#706A5F" letter-spacing="3">SLATE HARBOUR GAMES &#183; LAWRENCE, KS &#183; NINE PEOPLE</text>
  <!-- The bands themselves, drawn to their real ranges. -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="20">
    <text x="80" y="418" fill="#706A5F">JUNIOR</text>
    <rect x="290" y="402" width="106" height="18" rx="4" fill="#4D7413"/>
    <text x="418" y="418" fill="#1A1814">$58k &#8211; $68k</text>

    <text x="80" y="466" fill="#706A5F">MID</text>
    <rect x="290" y="450" width="180" height="18" rx="4" fill="#4D7413"/>
    <text x="492" y="466" fill="#1A1814">$78k &#8211; $95k</text>

    <text x="80" y="514" fill="#706A5F">SENIOR</text>
    <rect x="290" y="498" width="238" height="18" rx="4" fill="#4D7413"/>
    <text x="550" y="514" fill="#1A1814">$102k &#8211; $124k</text>

    <text x="80" y="562" fill="#706A5F">LEAD</text>
    <rect x="290" y="546" width="278" height="18" rx="4" fill="#4D7413"/>
    <text x="590" y="562" fill="#1A1814">$128k &#8211; $145k</text>
  </g>
  <text x="80" y="606" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#706A5F">3 CRUNCH PERIODS IN 7 YEARS &#183; ALL LISTED</text>
</svg>
