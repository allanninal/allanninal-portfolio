<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FEF9F0"/>
  <!-- Decorative circles -->
  <circle cx="950" cy="80" r="180" fill="#EBF7F0" opacity="0.8"/>
  <circle cx="100" cy="550" r="140" fill="#FFE5EA" opacity="0.5"/>
  <!-- Large scoop illustration -->
  <g transform="translate(800, 50)">
    <!-- Cone -->
    <path d="M90 280 L170 500 L250 280 Z" fill="#C0304A" opacity="0.85"/>
    <!-- Waffle lines -->
    <line x1="110" y1="300" x2="170" y2="490" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <line x1="150" y1="295" x2="170" y2="495" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <line x1="190" y1="295" x2="170" y2="495" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <line x1="115" y1="330" x2="225" y2="330" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <line x1="108" y1="365" x2="232" y2="365" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <line x1="112" y1="400" x2="228" y2="400" stroke="#8B1A2F" stroke-width="2" opacity="0.3"/>
    <!-- Scoop 1 vanilla -->
    <ellipse cx="170" cy="290" rx="90" ry="85" fill="#FFFDF7"/>
    <ellipse cx="170" cy="278" rx="90" ry="85" fill="#FEF9F0"/>
    <!-- Scoop 2 strawberry -->
    <ellipse cx="170" cy="200" rx="82" ry="78" fill="#D84B5A"/>
    <ellipse cx="170" cy="191" rx="82" ry="78" fill="#E85C6A"/>
    <!-- Scoop 3 pistachio -->
    <ellipse cx="170" cy="122" rx="75" ry="72" fill="#3A9464"/>
    <ellipse cx="170" cy="113" rx="75" ry="72" fill="#4CAF7D"/>
    <!-- Highlights -->
    <ellipse cx="148" cy="96" rx="18" ry="12" fill="white" opacity="0.28"/>
    <ellipse cx="150" cy="173" rx="16" ry="10" fill="white" opacity="0.2"/>
    <ellipse cx="152" cy="252" rx="14" ry="9" fill="white" opacity="0.15"/>
    <!-- Cherry -->
    <circle cx="170" cy="45" r="18" fill="#C0304A"/>
    <circle cx="170" cy="42" r="18" fill="#D84B5A"/>
    <circle cx="162" cy="36" r="6" fill="white" opacity="0.3"/>
    <path d="M170 34 Q188 18 200 24" stroke="#2E7D52" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Drip -->
    <path d="M244 170 Q256 185 250 210" stroke="#B8432A" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Left content -->
  <!-- Tagline eyebrow -->
  <text x="80" y="130" font-family="Source Sans 3, sans-serif" font-size="22" font-weight="700" fill="#2E7D52" letter-spacing="3" text-transform="uppercase">ARTISAN GELATO &amp; ICE CREAM</text>
  <!-- Brand name in Pacifico style -->
  <text x="78" y="240" font-family="Pacifico, cursive" font-size="108" fill="#2E7D52" font-weight="400">Scooped</text>
  <!-- Subline -->
  <text x="80" y="300" font-family="Source Sans 3, sans-serif" font-size="28" fill="#3A5C47">Small-batch gelato, churned fresh daily.</text>
  <text x="80" y="340" font-family="Source Sans 3, sans-serif" font-size="28" fill="#3A5C47">Three locations across Austin, TX.</text>

  <!-- Divider -->
  <rect x="80" y="380" width="120" height="4" rx="2" fill="#2E7D52"/>

  <!-- Flavour pills -->
  <rect x="80" y="410" width="160" height="38" rx="19" fill="#EBF7F0"/>
  <text x="160" y="434" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="16" font-weight="700" fill="#1F5C3A">Pistachio</text>

  <rect x="252" y="410" width="180" height="38" rx="19" fill="#FFE5EA"/>
  <text x="342" y="434" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="16" font-weight="700" fill="#8B1A2F">Strawberry</text>

  <rect x="444" y="410" width="160" height="38" rx="19" fill="#F5EDD8"/>
  <text x="524" y="434" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="16" font-weight="700" fill="#5A3C00">Vanilla</text>

  <!-- Bottom strip -->
  <rect x="0" y="560" width="1200" height="70" fill="#2E7D52"/>
  <text x="80" y="604" font-family="Source Sans 3, sans-serif" font-size="20" fill="#FEF9F0" opacity="0.9">allanninal.dev/templates/ice-cream-shop/</text>
  <text x="1120" y="604" text-anchor="end" font-family="Source Sans 3, sans-serif" font-size="20" fill="#FEF9F0" opacity="0.9">Day 40 of 365</text>
</svg>
