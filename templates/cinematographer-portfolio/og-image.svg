<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Halden Rask — director of photography, Pittsburgh">
  <rect width="1200" height="630" fill="#0A0D13"/>
  <!-- Four ratios nested at a shared projected width — 4:3, 16:9, 1.85 and
       2.39 — the same diagram the page draws, at poster scale. -->
  <g transform="translate(890 315)" fill="none" stroke="#67707F" stroke-width="2">
    <rect x="-200" y="-150.4" width="400" height="300.8"/>
    <rect x="-200" y="-112.4" width="400" height="224.7"/>
    <rect x="-200" y="-108.1" width="400" height="216.2"/>
  </g>
  <rect x="690" y="231.3" width="400" height="167.4" fill="none" stroke="#7FB2E8" stroke-width="4"/>
  <text x="80" y="250" font-family="Impact, 'Arial Narrow', sans-serif" font-size="82" fill="#E9EDF4" letter-spacing="2">HALDEN RASK</text>
  <text x="80" y="312" font-family="ui-monospace, Menlo, monospace" font-size="25" fill="#7FB2E8" letter-spacing="4">DIRECTOR OF PHOTOGRAPHY</text>
  <text x="80" y="368" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="26" fill="#9BA5B5">You cannot judge cinematography</text>
  <text x="80" y="404" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="26" fill="#9BA5B5">from a frame.</text>
  <text x="80" y="496" font-family="ui-monospace, Menlo, monospace" font-size="21" fill="#9BA5B5">PITTSBURGH, PA &#183; 12 SETUPS &#183; 58 TAKES</text>
  <rect x="80" y="536" width="180" height="5" fill="#7FB2E8"/>
</svg>
