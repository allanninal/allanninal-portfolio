<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Dark base -->
  <rect width="1200" height="630" fill="#0D1117"/>

  <!-- Subtle dot grid -->
  <defs>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Heron glyph (top-right faint) -->
  <g transform="translate(900, 110)">
    <path d="M150 30 L260 110 L240 250 L80 250 L60 110 Z" stroke="#14B8A6" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="M130 130 L170 170 L170 220" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="155" text-anchor="start"
    font-family="'Geist Mono', ui-monospace, monospace"
    font-size="22" font-weight="500" fill="#14B8A6"
    letter-spacing="3.4">GO · MIT · v0.9.1</text>

  <!-- Project name (large display) -->
  <text x="80" y="295" text-anchor="start"
    font-family="'Outfit', system-ui, sans-serif"
    font-size="120" font-weight="700" fill="#E6EDF3"
    letter-spacing="-3.5">heron</text>

  <!-- Tagline split: "Upload once. " then accent "Never twice." -->
  <text x="80" y="380" text-anchor="start"
    font-family="'Outfit', system-ui, sans-serif"
    font-size="48" font-weight="600" fill="#E6EDF3"
    letter-spacing="-1.5">Upload once.<tspan fill="#14B8A6"> Never twice.</tspan></text>

  <!-- Subhead -->
  <text x="80" y="440" text-anchor="start"
    font-family="'Outfit', system-ui, sans-serif"
    font-size="22" font-weight="400" fill="#8B949E">Static-asset uploader for S3, R2, B2 — with deduplication.</text>

  <!-- Mock terminal -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="540" height="100" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="20" y="42" text-anchor="start"
      font-family="'Geist Mono', ui-monospace, monospace"
      font-size="18" font-weight="500" fill="#14B8A6">$</text>
    <text x="40" y="42" text-anchor="start"
      font-family="'Geist Mono', ui-monospace, monospace"
      font-size="18" font-weight="500" fill="#E6EDF3">brew install heron-cli/heron/heron</text>
    <text x="20" y="76" text-anchor="start"
      font-family="'Geist Mono', ui-monospace, monospace"
      font-size="14" font-weight="400" fill="#8B949E">★ 2.1k · 38 contributors · 184k downloads/month</text>
  </g>
</svg>
