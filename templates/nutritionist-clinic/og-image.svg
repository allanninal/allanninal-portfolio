<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAF8"/>

  <!-- Left accent panel -->
  <rect width="420" height="630" fill="#EEF6F1"/>

  <!-- Herb-green accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#1F7A54"/>

  <!-- Decorative circles -->
  <circle cx="210" cy="120" r="90" fill="#D4EBDB" opacity="0.6"/>
  <circle cx="380" cy="520" r="60" fill="#D4EBDB" opacity="0.4"/>
  <circle cx="1100" cy="60" r="100" fill="#EEF6F1"/>

  <!-- Logo leaf icon -->
  <circle cx="90" cy="80" r="32" fill="#1F7A54"/>
  <path d="M90 58c0 0-12 8-12 18 0 6.6 5.4 12 12 12s12-5.4 12-12c0-10-12-18-12-18z" fill="white" opacity="0.9"/>

  <!-- Practice name -->
  <text x="134" y="90" font-family="'Josefin Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A2118">Nourish Well Nutrition</text>

  <!-- Eyebrow -->
  <text x="480" y="175" font-family="'Josefin Sans', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#1F7A54">REGISTERED DIETITIAN NUTRITIONIST · SEATTLE, WA</text>

  <!-- Main headline -->
  <text x="480" y="255" font-family="'Josefin Sans', system-ui, sans-serif" font-size="56" font-weight="700" fill="#1A2118">Nutrition that works</text>
  <text x="480" y="320" font-family="'Josefin Sans', system-ui, sans-serif" font-size="56" font-weight="700" fill="#1F7A54">with your biology.</text>

  <!-- Description -->
  <text x="480" y="390" font-family="Georgia, serif" font-size="20" fill="#4A5247">Evidence-based counseling for gut health, hormonal</text>
  <text x="480" y="418" font-family="Georgia, serif" font-size="20" fill="#4A5247">balance, and sustainable weight management.</text>

  <!-- CTA button simulation -->
  <rect x="480" y="455" width="230" height="52" rx="8" fill="#1F7A54"/>
  <text x="595" y="486" font-family="'Josefin Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Book a Discovery Call</text>

  <!-- Credential chips -->
  <rect x="480" y="530" width="58" height="24" rx="4" fill="#EEF6F1" stroke="#AADABB" stroke-width="1"/>
  <text x="509" y="546" font-family="'Josefin Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F7A54" text-anchor="middle">RDN</text>
  <rect x="546" y="530" width="42" height="24" rx="4" fill="#EEF6F1" stroke="#AADABB" stroke-width="1"/>
  <text x="567" y="546" font-family="'Josefin Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F7A54" text-anchor="middle">LD</text>
  <rect x="596" y="530" width="120" height="24" rx="4" fill="#EEF6F1" stroke="#AADABB" stroke-width="1"/>
  <text x="656" y="546" font-family="'Josefin Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F7A54" text-anchor="middle">MS Nutrition Sciences</text>

  <!-- Left panel — stats -->
  <text x="210" y="260" font-family="'Josefin Sans', system-ui, sans-serif" font-size="44" font-weight="700" fill="#1F7A54" text-anchor="middle">12+</text>
  <text x="210" y="288" font-family="'Josefin Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#4A5247" text-anchor="middle">YEARS</text>
  <line x1="160" y1="310" x2="260" y2="310" stroke="#D4EBDB" stroke-width="1"/>
  <text x="210" y="348" font-family="'Josefin Sans', system-ui, sans-serif" font-size="44" font-weight="700" fill="#1F7A54" text-anchor="middle">1,800+</text>
  <text x="210" y="376" font-family="'Josefin Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#4A5247" text-anchor="middle">CLIENTS SERVED</text>
  <line x1="160" y1="398" x2="260" y2="398" stroke="#D4EBDB" stroke-width="1"/>
  <text x="210" y="436" font-family="'Josefin Sans', system-ui, sans-serif" font-size="44" font-weight="700" fill="#1F7A54" text-anchor="middle">4.9★</text>
  <text x="210" y="464" font-family="'Josefin Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#4A5247" text-anchor="middle">AVERAGE RATING</text>

  <!-- Day badge -->
  <text x="1110" y="600" font-family="'Josefin Sans', system-ui, sans-serif" font-size="13" fill="#C2BAA8" text-anchor="end">Day 59 of 365</text>
</svg>
