  <rect x="660" y="420" width="100" height="28" fill="#F0F3ED" stroke="#5A7048" stroke-width="0.5"/>
  <text x="710" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3D5233" letter-spacing="2">ASTRO</text>
  <rect x="774" y="420" width="110" height="28" fill="#F0F3ED" stroke="#5A7048" stroke-width="0.5"/>
  <text x="829" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3D5233" letter-spacing="2">TAILWIND</text>
  <rect x="898" y="420" width="80" height="28" fill="#F0F3ED" stroke="#5A7048" stroke-width="0.5"/>
  <text x="938" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3D5233" letter-spacing="2">MIT</text>
  <rect x="992" y="420" width="120" height="28" fill="#1C1917"/>
  <text x="1052" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FAF5EE" letter-spacing="2">WCAG AA</text>

  <!-- URL -->
  <text x="870" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6B5E54" letter-spacing="2">templates.allanninal.dev/patisserie</text>
