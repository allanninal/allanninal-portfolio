  <!-- Description -->
  <text x="870" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4A4038">Entremets · Viennoiserie · Macarons</text>
  <text x="870" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4A4038">Bespoke Gâteaux · Seasonal Collections</text>

