<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: champagne ivory -->
  <rect width="1200" height="630" fill="#FAF5EE"/>

  <!-- Left dark panel -->
  <rect x="0" y="0" width="540" height="630" fill="#1C1917"/>

