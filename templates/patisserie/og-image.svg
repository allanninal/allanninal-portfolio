  <!-- Entremet illustration -->
  <!-- Plate shadow -->
  <ellipse cx="270" cy="490" rx="130" ry="18" fill="#2C2520" opacity="0.6"/>
  <!-- Entremet body -->
  <rect x="150" y="340" width="240" height="148" rx="4" fill="#F5EFE6" opacity="0.12"/>
  <!-- Mousse layer -->
  <rect x="150" y="340" width="240" height="52" rx="4" fill="#C8A09A" opacity="0.55"/>
  <!-- Gelée -->
  <rect x="150" y="388" width="240" height="22" fill="#E8C8C0" opacity="0.45"/>
  <!-- Dacquoise -->
  <rect x="150" y="408" width="240" height="20" fill="#C9A96E" opacity="0.4"/>
  <!-- Croustillant -->
  <rect x="150" y="426" width="240" height="16" fill="#9A7840" opacity="0.35"/>
  <!-- Base -->
  <rect x="150" y="440" width="240" height="48" fill="#EDE6DB" opacity="0.2"/>
  <!-- Mirror glaze top -->
  <rect x="150" y="340" width="240" height="10" rx="4 4 0 0" fill="#D4A5A0" opacity="0.4"/>
  <!-- Gold leaf -->
  <rect x="215" y="342" width="110" height="5" rx="2" fill="#C9A96E" opacity="0.7"/>
  <!-- Silver sparkles -->
  <circle cx="175" cy="346" r="4" fill="white" opacity="0.4"/>
  <circle cx="365" cy="344" r="3" fill="white" opacity="0.35"/>
  <circle cx="340" cy="347" r="2" fill="white" opacity="0.3"/>
  <!-- Rose petal -->
  <ellipse cx="270" cy="336" rx="18" ry="9" fill="#C8A09A" opacity="0.7" transform="rotate(-12 270 336)"/>
  <ellipse cx="292" cy="333" rx="14" ry="7" fill="#D4B5B0" opacity="0.6" transform="rotate(8 292 333)"/>

  <!-- Day badge -->
  <rect x="150" y="292" width="240" height="30" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
  <text x="270" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C9A96E" letter-spacing="5" opacity="0.8">DAY 38 OF 365</text>

  <!-- Right side content -->
  <!-- Decorative border on light side -->
  <rect x="570" y="30" width="600" height="570" fill="none" stroke="#DDD4C8" stroke-width="0.5" opacity="0.5"/>

