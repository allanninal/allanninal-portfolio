  <!-- Decorative border on dark side -->
  <rect x="30" y="30" width="480" height="570" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.4"/>
  <!-- Corner marks -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="80" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="30" x2="460" y2="30" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="30" x2="510" y2="80" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="600" x2="80" y2="600" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="600" x2="30" y2="550" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="600" x2="460" y2="600" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>
  <line x1="510" y1="600" x2="510" y2="550" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>

  <!-- Brand name on dark side -->
  <text x="270" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#FAF5EE" letter-spacing="4">Maison Véron</text>

