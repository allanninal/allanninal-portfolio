<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9F9FB"/>
      <stop offset="100%" style="stop-color:#EEF2FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent band (left) -->
  <rect x="0" y="0" width="8" height="630" fill="#4F46E5"/>

  <!-- Bottom accent line -->
  <rect x="0" y="590" width="1200" height="40" fill="#4F46E5"/>

  <!-- Product logomark -->
  <rect x="70" y="70" width="52" height="52" rx="11" fill="#4F46E5"/>
  <rect x="82" y="82" width="28" height="20" rx="3" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M82 111h9M88 111l4-6M104 111h-9M104 111l-4-6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Product name -->
  <text x="136" y="104" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#111827" letter-spacing="-0.5">Inkframe</text>

  <!-- Eyebrow label -->
  <text x="70" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="600" fill="#4F46E5" letter-spacing="2" text-transform="uppercase">CHANGELOG</text>

  <!-- Main headline -->
  <text x="70" y="290" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#111827" letter-spacing="-2">Design reviews</text>
  <text x="70" y="370" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#4F46E5" letter-spacing="-2">that don't require</text>
  <text x="70" y="450" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#111827" letter-spacing="-2">a meeting.</text>

  <!-- Tag pills -->
  <rect x="70" y="490" width="68" height="28" rx="14" fill="#EEF2FF"/>
  <text x="104" y="509" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#3730A3" text-anchor="middle">New</text>

  <rect x="148" y="490" width="110" height="28" rx="14" fill="#ECFDF5"/>
  <text x="203" y="509" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">Improvement</text>

  <rect x="268" y="490" width="58" height="28" rx="14" fill="#FFFBEB"/>
  <text x="297" y="509" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">Fix</text>

  <rect x="336" y="490" width="82" height="28" rx="14" fill="#FEF2F2"/>
  <text x="377" y="509" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Breaking</text>

  <!-- Date/version (bottom right, white on accent band) -->
  <text x="1130" y="613" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="rgba(255,255,255,0.8)" text-anchor="end">Free MIT template · Day 29 of 365</text>
</svg>
