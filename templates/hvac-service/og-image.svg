<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12"/>
      <stop offset="100%" stop-color="#1F242C"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#CE8C46" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#CE8C46" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Copper accent rail -->
  <rect x="0" y="0" width="6" height="630" fill="#CE8C46"/>

  <!-- Decorative: supply duct run with airflow, clear of the type block -->
  <rect x="742" y="120" width="362" height="70" rx="8" fill="none" stroke="#E0A868" stroke-width="2.5" opacity="0.16"/>
  <line x1="812" y1="120" x2="812" y2="190" stroke="#E0A868" stroke-width="2" opacity="0.13"/>
  <line x1="882" y1="120" x2="882" y2="190" stroke="#E0A868" stroke-width="2" opacity="0.13"/>
  <line x1="952" y1="120" x2="952" y2="190" stroke="#E0A868" stroke-width="2" opacity="0.13"/>
  <line x1="1022" y1="120" x2="1022" y2="190" stroke="#E0A868" stroke-width="2" opacity="0.13"/>
  <!-- Airflow leaving the register, curving away from the headline -->
  <path d="M742 142 C 700 142, 688 116, 648 116" fill="none" stroke="#E0A868" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
  <path d="M742 168 C 694 168, 678 194, 632 194" fill="none" stroke="#E0A868" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <!-- Return grille -->
  <rect x="1042" y="404" width="112" height="86" rx="6" fill="none" stroke="#E0A868" stroke-width="2.5" opacity="0.12"/>
  <line x1="1042" y1="424" x2="1154" y2="424" stroke="#E0A868" stroke-width="2" opacity="0.10"/>
  <line x1="1042" y1="447" x2="1154" y2="447" stroke="#E0A868" stroke-width="2" opacity="0.10"/>
  <line x1="1042" y1="470" x2="1154" y2="470" stroke="#E0A868" stroke-width="2" opacity="0.10"/>

  <!-- Logo mark: duct section with a copper line through it -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="#191D24"/>
  <rect x="96" y="98" width="32" height="28" rx="4" fill="none" stroke="#CE8C46" stroke-width="3"/>
  <line x1="104" y1="105" x2="104" y2="119" stroke="#CE8C46" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="105" x2="112" y2="119" stroke="#CE8C46" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="105" x2="120" y2="119" stroke="#CE8C46" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Business name -->
  <text x="80" y="222" font-family="Chivo, system-ui, sans-serif" font-size="58" font-weight="800" fill="#E8EBEF">Meridian Air</text>

  <!-- Tagline -->
  <text x="80" y="268" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="23" font-weight="500" fill="#A0AAB8">Kansas City Heating &amp; Cooling — NATE-Certified, 24/7 No-Heat Response</text>

  <!-- Service pills -->
  <rect x="80" y="306" width="150" height="40" rx="20" fill="#CE8C46"/>
  <text x="155" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0C0E12" text-anchor="middle">AC Repair</text>

  <rect x="242" y="306" width="168" height="40" rx="20" fill="none" stroke="#333B47" stroke-width="1.5"/>
  <text x="326" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C6CEDA" text-anchor="middle">Furnace Service</text>

  <rect x="422" y="306" width="152" height="40" rx="20" fill="none" stroke="#333B47" stroke-width="1.5"/>
  <text x="498" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C6CEDA" text-anchor="middle">Heat Pumps</text>

  <rect x="586" y="306" width="176" height="40" rx="20" fill="none" stroke="#333B47" stroke-width="1.5"/>
  <text x="674" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C6CEDA" text-anchor="middle">24/7 Emergency</text>

  <!-- Credential line -->
  <text x="80" y="404" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="500" fill="#A0AAB8">MO HVAC License #MC-41207  ·  EPA 608 Universal  ·  Manual J on every install</text>

  <!-- Phone -->
  <text x="80" y="472" font-family="Chivo, system-ui, sans-serif" font-size="34" font-weight="700" fill="#CE8C46">(816) 555-0193</text>

  <!-- Footer rule -->
  <line x1="80" y1="524" x2="1120" y2="524" stroke="#262C35" stroke-width="1.5"/>

  <!-- Day badge -->
  <rect x="80" y="548" width="132" height="34" rx="17" fill="#CE8C46"/>
  <text x="146" y="570" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0C0E12" text-anchor="middle">Day 71 of 365</text>

  <!-- Attribution -->
  <text x="1120" y="571" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="500" fill="#7E8898" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
</svg>
