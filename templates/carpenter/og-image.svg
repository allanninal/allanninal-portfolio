<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A15"/>
      <stop offset="100%" stop-color="#2A251E"/>
    </linearGradient>
    <pattern id="scribeHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#A3B86A" stroke-width="2.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Moss accent rail -->
  <rect x="0" y="0" width="6" height="630" fill="#4F6127"/>

  <!-- Decorative: the same scribe diagram the hero runs on. The case is plumb,
       the wall is not, and the hatched wedge between them is the work. Kept
       right of the type block. -->
  <path d="M1128,66 L1080,562" fill="none" stroke="#6B6459" stroke-width="5" stroke-linecap="round"/>
  <path d="M812,552 L1132,566" fill="none" stroke="#6B6459" stroke-width="5" stroke-linecap="round"/>
  <path d="M1080,562 L1128,66 L1080,66 Z" fill="url(#scribeHatch)" opacity="0.55"/>
  <path d="M1080,562 L1128,66 L1080,66 Z" fill="none" stroke="#A3B86A" stroke-width="2"/>
  <rect x="856" y="66" width="224" height="496" fill="#2E2822" stroke="#A3B86A" stroke-width="3"/>
  <line x1="856" y1="158" x2="1080" y2="158" stroke="#A3B86A" stroke-width="2.2"/>
  <line x1="856" y1="250" x2="1080" y2="250" stroke="#A3B86A" stroke-width="2.2"/>
  <line x1="856" y1="342" x2="1080" y2="342" stroke="#A3B86A" stroke-width="2.2"/>
  <line x1="856" y1="434" x2="1080" y2="434" stroke="#A3B86A" stroke-width="2.2"/>
  <rect x="856" y="500" width="224" height="62" fill="#4F6127"/>
  <!-- Species boards standing in the case -->
  <rect x="878" y="266" width="24" height="60" fill="#C6A878"/>
  <rect x="908" y="266" width="24" height="60" fill="#5C4433"/>
  <rect x="938" y="266" width="24" height="60" fill="#D9C7A3"/>
  <rect x="968" y="266" width="24" height="60" fill="#B4714A"/>
  <!-- Plumb bob -->
  <line x1="836" y1="66" x2="836" y2="470" stroke="#B9B2A4" stroke-width="1.6" stroke-dasharray="6 7"/>
  <path d="M830,470 L842,470 L836,492 Z" fill="#B9B2A4"/>

  <!-- Logo mark: the try square -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="#2E2822"/>
  <path d="M96,96 L96,128 L130,128" fill="none" stroke="#A3B86A" stroke-width="4" stroke-linecap="square"/>
  <path d="M104,96 L104,120 L130,120" fill="none" stroke="#A3B86A" stroke-width="2" opacity="0.75"/>

  <!-- Business name -->
  <text x="80" y="224" font-family="Familjen Grotesk, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#F4F0E6">Foursquare Joinery</text>

  <!-- Tagline -->
  <text x="80" y="270" font-family="Commissioner, system-ui, sans-serif" font-size="22" font-weight="500" fill="#B9B2A4">Grand Rapids Built-Ins — Scribed To Walls That Are Not Plumb</text>

  <!-- Piece pills -->
  <rect x="80" y="308" width="180" height="40" rx="20" fill="#4F6127"/>
  <text x="170" y="334" font-family="Commissioner, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alcove Bookcases</text>

  <rect x="272" y="308" width="150" height="40" rx="20" fill="none" stroke="#4A443A" stroke-width="1.5"/>
  <text x="347" y="334" font-family="Commissioner, system-ui, sans-serif" font-size="15" font-weight="600" fill="#CFC8BA" text-anchor="middle">Window Seats</text>

  <rect x="434" y="308" width="164" height="40" rx="20" fill="none" stroke="#4A443A" stroke-width="1.5"/>
  <text x="516" y="334" font-family="Commissioner, system-ui, sans-serif" font-size="15" font-weight="600" fill="#CFC8BA" text-anchor="middle">Mudroom Lockers</text>

  <rect x="610" y="308" width="112" height="40" rx="20" fill="none" stroke="#4A443A" stroke-width="1.5"/>
  <text x="666" y="334" font-family="Commissioner, system-ui, sans-serif" font-size="15" font-weight="600" fill="#CFC8BA" text-anchor="middle">Pantries</text>

  <!-- Credential line -->
  <text x="80" y="406" font-family="Commissioner, system-ui, sans-serif" font-size="16" font-weight="500" fill="#B9B2A4">Michigan M&amp;A Contractor, carpentry class  ·  Insured  ·  5-year warranty on the joint</text>

  <!-- Phone -->
  <text x="80" y="476" font-family="Familjen Grotesk, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#A3B86A">(616) 555-0148</text>

  <line x1="80" y1="524" x2="1120" y2="524" stroke="#3A342C" stroke-width="1.5"/>

  <rect x="80" y="548" width="132" height="34" rx="17" fill="#4F6127"/>
  <text x="146" y="570" font-family="Commissioner, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 74 of 365</text>

  <text x="1120" y="571" font-family="Commissioner, system-ui, sans-serif" font-size="15" font-weight="500" fill="#B9B2A4" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
</svg>
