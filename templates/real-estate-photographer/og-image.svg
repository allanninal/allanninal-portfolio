  <g transform="translate(640,100) scale(0.86)">
    <g fill="#FFFFFF" stroke="#12161B" stroke-width="4">
      <rect x="0" y="0" width="300" height="220"/><rect x="0" y="220" width="300" height="180"/>
      <rect x="300" y="0" width="260" height="200"/><rect x="300" y="200" width="260" height="200"/>
    </g>
    <g font-family="monospace" font-size="17" fill="#4F5964">
      <text x="14" y="28">Living</text><text x="14" y="248">Kitchen</text>
      <text x="314" y="28">Bed 1</text><text x="314" y="228">Bed 2</text>
    </g>
    <g stroke="#1B4770" stroke-width="2" stroke-dasharray="6 5">
      <path d="M26 26L150 110M276 196L150 110M26 376L150 310M276 244L150 310"/>
      <path d="M536 26L430 100M326 176L430 100M536 376L430 300M326 224L430 300"/>
