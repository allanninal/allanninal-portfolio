  <g font-family="Georgia, serif">
    <text x="72" y="118" font-family="monospace" font-size="15" fill="#4F5964" letter-spacing="4">MERIDIAN LINE &#183; FORT COLLINS, CO</text>
    <text x="72" y="252" font-size="54" fill="#12161B">Twenty-four</text>
    <text x="72" y="316" font-size="54" fill="#12161B">millimetres,</text>
    <text x="72" y="380" font-size="54" fill="#1B4770">not fourteen.</text>
    <text x="72" y="444" font-size="20" fill="#4F5964">A wider lens does not photograph a bigger</text>
    <text x="72" y="474" font-size="20" fill="#4F5964">room. It photographs a lie about one.</text>
    <text x="72" y="546" font-family="monospace" font-size="15" fill="#12161B">Day 97 of 365 &#183; allanninal.dev/templates</text>
