      <circle cx="26" cy="376" r="17"/><circle cx="276" cy="244" r="17"/>
      <circle cx="536" cy="26" r="17"/><circle cx="326" cy="176" r="17"/>
      <circle cx="536" cy="376" r="17"/><circle cx="326" cy="224" r="17"/>
    </g>
    <g font-family="monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
