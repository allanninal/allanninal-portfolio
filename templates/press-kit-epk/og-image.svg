<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="60%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Red accent bar -->
  <rect x="72" y="0" width="3" height="630" fill="#E63946" opacity="0.6"/>

  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#E63946" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#E63946" stroke-width="0.5" opacity="0.08"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#E63946" stroke-width="0.5" opacity="0.08"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#E63946" stroke-width="0.5" opacity="0.08"/>

  <!-- EPK watermark -->
  <text x="1050" y="580" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="#E63946" opacity="0.05" text-anchor="middle">EPK</text>

  <!-- Label -->
  <text x="100" y="200" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E63946" letter-spacing="4" text-transform="uppercase">ELECTRONIC PRESS KIT · DAY 27 OF 365</text>

  <!-- Artist name -->
  <text x="100" y="340" font-family="Georgia, serif" font-size="120" font-weight="400" fill="#F5F5F5" letter-spacing="-3">Lila Marin</text>

  <!-- Tagline -->
  <text x="100" y="400" font-family="'Manrope', system-ui, sans-serif" font-size="22" fill="#888888" font-weight="400">Indie acoustic-electronic · Portland, OR · Ambient folk meets electronic production</text>

  <!-- Stats -->
  <text x="100" y="510" font-family="Georgia, serif" font-size="36" fill="#E63946">80K</text>
  <text x="100" y="540" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#555555" letter-spacing="2">MONTHLY LISTENERS</text>

  <text x="260" y="510" font-family="Georgia, serif" font-size="36" fill="#E63946">3</text>
  <text x="260" y="540" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#555555" letter-spacing="2">STUDIO ALBUMS</text>

  <text x="380" y="510" font-family="Georgia, serif" font-size="36" fill="#E63946">NPR</text>
  <text x="380" y="540" font-family="'Manrope', system-ui, sans-serif" font-size="11" fill="#555555" letter-spacing="2">TINY DESK 2024</text>

  <!-- URL -->
  <text x="1150" y="590" font-family="'Manrope', system-ui, sans-serif" font-size="13" fill="#3D3D3D" text-anchor="end">allanninal.dev/templates</text>
</svg>
