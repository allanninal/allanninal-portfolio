<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F2EE"/>
      <stop offset="100%" stop-color="#EDE3DD"/>
    </linearGradient>
    <pattern id="partHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#B96AA0" stroke-width="2.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Damson accent rail -->
  <rect x="0" y="0" width="6" height="630" fill="#8F3474"/>

  <!-- The week strip itself, cropped. It is the only image in the trades set
       that is not a photograph of finished work, which is the point: a marble
       island proves a kitchen was built and nothing else. Solid means the
       condition held all week, hatched means part of the week, outline means
       not at all. -->
  <g>
    <!-- Row labels -->
    <text x="640" y="120" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4A3D42" text-anchor="end">Kitchen sink</text>
    <text x="640" y="168" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4A3D42" text-anchor="end">Cooking</text>
    <text x="640" y="216" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4A3D42" text-anchor="end">Dust wall up</text>
    <text x="640" y="264" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4A3D42" text-anchor="end">Crew on site</text>

    <!-- Week heads -->
    <text x="686" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W1</text>
    <text x="750" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W2</text>
    <text x="814" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W3</text>
    <text x="878" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W4</text>
    <text x="942" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W5</text>
    <text x="1006" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W6</text>
    <text x="1070" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W7</text>
    <text x="1134" y="80" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6A5A5E" text-anchor="middle">W8</text>

    <!-- Kitchen sink: gone until week six -->
    <rect x="658" y="100" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="722" y="100" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="786" y="100" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="850" y="100" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="914" y="100" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="978" y="100" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="1042" y="100" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="1106" y="100" width="56" height="26" rx="3" fill="#8F3474"/>

    <!-- Cooking -->
    <rect x="658" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="722" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="786" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="850" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="914" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="978" y="148" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="1042" y="148" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="1106" y="148" width="56" height="26" rx="3" fill="#8F3474"/>

    <!-- Dust wall up -->
    <rect x="658" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="722" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="786" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="850" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="914" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="978" y="196" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="1042" y="196" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="1106" y="196" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>

    <!-- Crew on site, with the gaps in the middle -->
    <rect x="658" y="244" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="722" y="244" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="786" y="244" width="56" height="26" rx="3" fill="#FFFFFF" stroke="#8F7F85" stroke-width="1.6"/>
    <rect x="850" y="244" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="914" y="244" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="978" y="244" width="56" height="26" rx="3" fill="#8F3474"/>
    <rect x="1042" y="244" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
    <rect x="1106" y="244" width="56" height="26" rx="3" fill="url(#partHatch)" stroke="#B96AA0" stroke-width="1.6"/>
  </g>

  <!-- The one visible line, which is the whole hook -->
  <text x="658" y="316" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="21" font-weight="700" fill="#8F3474">22 days without a kitchen sink</text>
  <text x="658" y="346" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4A3D42">9 weekdays nobody came, and why on each one</text>

  <!-- Logo mark: a kitchen elevation -->
  <rect x="80" y="80" width="64" height="64" rx="10" fill="#1F1519"/>
  <rect x="93" y="93" width="17" height="14" rx="1.6" fill="none" stroke="#E2ABD2" stroke-width="2.4"/>
  <rect x="115" y="93" width="17" height="14" rx="1.6" fill="none" stroke="#E2ABD2" stroke-width="2.4"/>
  <rect x="93" y="117" width="39" height="15" rx="1.6" fill="none" stroke="#E2ABD2" stroke-width="2.4"/>
  <circle cx="112.5" cy="112" r="2.2" fill="#E2ABD2"/>

  <!-- Business name -->
  <text x="80" y="228" font-family="Faustina, Georgia, serif" font-size="56" font-weight="700" fill="#1F1519">Longfellow</text>
  <text x="80" y="288" font-family="Faustina, Georgia, serif" font-size="56" font-weight="700" fill="#1F1519">Kitchen Co.</text>

  <!-- Tagline -->
  <text x="80" y="332" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="20" font-weight="600" fill="#6A5A5E">We will tell you the day you</text>
  <text x="80" y="360" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="20" font-weight="600" fill="#6A5A5E">get your sink back.</text>

  <!-- Scope-band pills -->
  <rect x="80" y="396" width="164" height="38" rx="4" fill="#8F3474"/>
  <text x="162" y="421" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Keep the Layout</text>

  <rect x="256" y="396" width="184" height="38" rx="4" fill="none" stroke="#8F7F85" stroke-width="1.5"/>
  <text x="348" y="421" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4A3D42" text-anchor="middle">Move the Plumbing</text>

  <rect x="452" y="396" width="164" height="38" rx="4" fill="none" stroke="#8F7F85" stroke-width="1.5"/>
  <text x="534" y="421" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4A3D42" text-anchor="middle">Take the Wall Out</text>

  <!-- Credential line -->
  <text x="80" y="470" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="500" fill="#6A5A5E">South Minneapolis  ·  One crew, one kitchen at a time  ·  Lead-safe certified</text>

  <!-- Phone -->
  <text x="80" y="522" font-family="Faustina, Georgia, serif" font-size="34" font-weight="700" fill="#8F3474">(612) 555-0173</text>

  <line x1="80" y1="548" x2="1120" y2="548" stroke="#D9CCC5" stroke-width="1.5"/>

  <rect x="80" y="566" width="132" height="34" rx="4" fill="#8F3474"/>
  <text x="146" y="588" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 76 of 365</text>

  <text x="1120" y="589" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="15" font-weight="500" fill="#6A5A5E" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
</svg>
