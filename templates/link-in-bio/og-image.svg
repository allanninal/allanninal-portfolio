<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="warmth" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFEDE5"/>
      <stop offset="100%" style="stop-color:#FFF5F0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E64A29"/>
      <stop offset="100%" style="stop-color:#C73E20"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#warmth)"/>

  <!-- Avatar disc -->
  <circle cx="600" cy="220" r="86" fill="url(#dot)"/>
  <text x="600" y="248" text-anchor="middle"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="76" font-weight="700" fill="#FFFFFF"
    letter-spacing="-3">
    AN
  </text>

  <!-- Name -->
  <text x="600" y="370" text-anchor="middle"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="64" font-weight="700" fill="#1A1A1A"
    letter-spacing="-2">
    Allan Ninal
  </text>

  <!-- Tagline -->
  <text x="600" y="424" text-anchor="middle"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="26" font-weight="400" fill="#6B5B54">
    Recipes for people who don't have time to hate cooking.
  </text>

  <!-- Mock pill row -->
  <g transform="translate(0, 480)">
    <rect x="380" y="0" width="440" height="48" rx="14" fill="#E64A29"/>
    <text x="600" y="30" text-anchor="middle"
      font-family="'DM Sans', system-ui, sans-serif"
      font-size="18" font-weight="600" fill="#FFFFFF">
      Free 30-recipe weeknight cookbook (PDF)
    </text>
  </g>
  <g transform="translate(0, 540)">
    <rect x="380" y="0" width="440" height="44" rx="13" fill="#FFFFFF" stroke="rgba(26,26,26,0.10)"/>
    <text x="600" y="28" text-anchor="middle"
      font-family="'DM Sans', system-ui, sans-serif"
      font-size="16" font-weight="500" fill="#1A1A1A">
      Sunday newsletter — short and warm
    </text>
  </g>
</svg>
