    <circle cx="7" cy="32" r="3.2"/><circle cx="12" cy="32" r="3.2"/><circle cx="19" cy="32" r="3.2"/>
    <circle cx="29" cy="32" r="3.2"/><circle cx="41" cy="32" r="3.2"/>
    <circle cx="50" cy="32" r="3.2"/><circle cx="56" cy="32" r="3.2"/>
  </g>
  <rect x="4" y="12" width="56" height="2" fill="#70735E"/>
  <rect x="4" y="50" width="56" height="2" fill="#70735E"/>
</svg>
