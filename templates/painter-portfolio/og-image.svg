<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#E8DCC0"/>

  <!-- Floor and the 145 cm hang-line, same device the page draws every room with -->
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#241F19" stroke-width="2"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#5C5340" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- A 170 cm reference figure -->
  <circle cx="960" cy="220" r="26" fill="none" stroke="#241F19" stroke-width="4"/>
  <rect x="915" y="252" width="90" height="228" rx="14" fill="none" stroke="#241F19" stroke-width="4"/>

  <!-- Two scale rectangles, largest and smallest on this page -->
  <rect x="1030" y="120" width="150" height="112" fill="#F1E8D3" stroke="#255F27" stroke-width="4"/>
  <rect x="700" y="386" width="44" height="32" fill="#F1E8D3" stroke="#5C5340" stroke-width="3" stroke-dasharray="4 4"/>

  <text x="80" y="176" font-family="'Sen', system-ui, sans-serif" font-size="21" font-weight="700" fill="#255F27" letter-spacing="5">PAINTER &#183; PORT VERREN, MAINE</text>

  <text x="80" y="290" font-family="'Cormorant', Georgia, serif" font-size="80" font-weight="600" fill="#241F19">122 &#215; 91 cm on the wall,</text>
  <text x="80" y="370" font-family="'Cormorant', Georgia, serif" font-size="80" font-weight="600" fill="#241F19">not on your screen.</text>

  <text x="80" y="430" font-family="'Sen', system-ui, sans-serif" font-size="24" fill="#5C5340">Every painting drawn true to scale. No photographs anywhere.</text>

  <rect x="80" y="524" width="12" height="56" fill="#255F27"/>
  <text x="112" y="550" font-family="'Sen', system-ui, sans-serif" font-size="22" font-weight="700" fill="#241F19">Free Astro template &#183; Day 130 of 365</text>
  <text x="112" y="576" font-family="system-ui, sans-serif" font-size="20" fill="#5C5340">allanninal.dev/templates</text>
</svg>
