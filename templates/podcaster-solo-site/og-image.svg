<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Long Way Round — a solo podcast from Fargo">
  <rect width="1200" height="630" fill="#131210"/>
  <text x="80" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="94" fill="#F2EFE9" letter-spacing="-3">A download is</text>
  <text x="80" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="94" fill="#D4BA11" letter-spacing="-3">not a listen.</text>
  <text x="80" y="330" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#8E8978" letter-spacing="3">THE LONG WAY ROUND &#183; NELL BRAITHWAITE &#183; FARGO, ND</text>
    <text x="80" y="386" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8E8978">DOWNLOADS, 7 DAYS</text>
    <rect x="470" y="371" width="384" height="19" rx="2" fill="#D4BA11"/>
    <text x="868" y="386" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F2EFE9">18,400</text>
