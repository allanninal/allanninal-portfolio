    <rect x="470" y="415" width="520" height="19" rx="2" fill="#D4BA11"/>
    <text x="1004" y="430" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F2EFE9">24,900</text>
    <text x="80" y="474" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8E8978">UNIQUE DEVICES</text>
    <rect x="470" y="459" width="297" height="19" rx="2" fill="#D4BA11"/>
    <text x="781" y="474" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F2EFE9">14,200</text>
    <text x="80" y="518" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8E8978">PAST THE MID-ROLL</text>
    <rect x="470" y="503" width="203" height="19" rx="2" fill="#3892C0"/>
    <text x="687" y="518" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F2EFE9">9,700</text>
    <text x="80" y="562" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8E8978">PAST THE POST-ROLL</text>
    <rect x="470" y="547" width="127" height="19" rx="2" fill="#3892C0"/>
    <text x="611" y="562" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F2EFE9">6,100</text>
  <text x="80" y="604" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8E8978">YELLOW: WHAT THE SERVER SAW &#183; BLUE: WHAT A PERSON DID</text>
