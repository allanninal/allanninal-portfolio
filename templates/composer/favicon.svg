    <rect x="10" y="12" width="30" height="4" rx="2"/>
    <rect x="10" y="24" width="30" height="4" rx="2"/>
    <rect x="10" y="36" width="30" height="4" rx="2"/>
    <rect x="10" y="48" width="30" height="4" rx="2"/>
  </g>
  <g fill="#349DB2">
    <rect x="46" y="24" width="8" height="4" rx="2"/>
    <rect x="46" y="48" width="8" height="4" rx="2"/>
  </g>
  <rect x="46" y="12" width="8" height="4" rx="2" fill="#DA627A"/>
</svg>
