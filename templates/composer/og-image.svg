<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aurelio Sandoval — composer, Santa Fe">
  <rect width="1200" height="630" fill="#161214"/>
  <text x="80" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#F0EAEC">Fourteen works.</text>
  <text x="80" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#DA627A">Six played twice.</text>
  <text x="80" y="322" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#978488" letter-spacing="3">AURELIO SANDOVAL &#183; COMPOSER &#183; SANTA FE, NM</text>
    <text x="80" y="396" font-family="Georgia, serif" font-size="26" fill="#F0EAEC">Second Room</text>
    <text x="470" y="396" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">8'</text>
    <text x="560" y="396" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">Solo piano</text>
    <text x="960" y="396" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#349DB2">9</text>
    <text x="1000" y="396" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#978488">PLAYED AGAIN</text>
    <rect x="80" y="410" width="1040" height="1" fill="#2E2528"/>
    <text x="80" y="442" font-family="Georgia, serif" font-size="26" fill="#F0EAEC">Kindling</text>
    <text x="470" y="442" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">4'</text>
    <text x="560" y="442" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">Solo clarinet</text>
    <text x="960" y="442" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#349DB2">12</text>
    <text x="1000" y="442" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#978488">PLAYED AGAIN</text>
    <rect x="80" y="456" width="1040" height="1" fill="#2E2528"/>
    <text x="80" y="488" font-family="Georgia, serif" font-size="26" fill="#F0EAEC">Quarry Light</text>
    <text x="470" y="488" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">14'</text>
    <text x="560" y="488" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">Wind quintet</text>
    <text x="960" y="488" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#349DB2">5</text>
    <text x="1000" y="488" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#978488">PLAYED AGAIN</text>
    <rect x="80" y="502" width="1040" height="1" fill="#2E2528"/>
    <text x="80" y="534" font-family="Georgia, serif" font-size="26" fill="#F0EAEC">Salt Cantos</text>
    <text x="470" y="534" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">24'</text>
    <text x="560" y="534" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">Chamber orch.</text>
    <text x="960" y="534" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#978488">0</text>
    <text x="1000" y="534" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#978488">NEVER PERFORMED</text>
    <rect x="80" y="548" width="1040" height="1" fill="#2E2528"/>
    <text x="80" y="580" font-family="Georgia, serif" font-size="26" fill="#F0EAEC">Low Water Mark</text>
    <text x="470" y="580" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">27'</text>
    <text x="560" y="580" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#978488">Orch. and choir</text>
    <text x="960" y="580" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#978488">0</text>
    <text x="1000" y="580" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#978488">NEVER PERFORMED</text>
    <rect x="80" y="594" width="1040" height="1" fill="#2E2528"/>
  <text x="80" y="606" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#978488">THE COLUMN NO CATALOGUE PUBLISHES</text>
</svg>
