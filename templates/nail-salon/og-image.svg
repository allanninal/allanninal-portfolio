<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F5"/>
      <stop offset="100%" stop-color="#F5EDE8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8735A"/>
      <stop offset="100%" stop-color="#C9483A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Right-side colour swatches -->
  <rect x="900" y="0" width="75" height="630" fill="#F5C5C8"/>
  <rect x="975" y="0" width="75" height="630" fill="#E8735A"/>
  <rect x="1050" y="0" width="75" height="630" fill="#C4956A"/>
  <rect x="1125" y="0" width="75" height="630" fill="#D8C8E8"/>

  <!-- Decorative circle -->
  <circle cx="980" cy="315" r="280" fill="#E8735A" fill-opacity="0.08"/>

  <!-- Nail art decorative shapes -->
  <path d="M820 160 Q820 80 860 60 Q900 80 900 160 Q900 195 860 195 Q820 195 820 160Z" fill="url(#accentGrad)" opacity="0.6"/>
  <path d="M760 200 Q760 135 795 118 Q830 135 830 200 Q830 228 795 228 Q760 228 760 200Z" fill="#C4956A" opacity="0.5"/>
  <path d="M700 230 Q700 175 730 160 Q760 175 760 230 Q760 255 730 255 Q700 255 700 230Z" fill="#D8C8E8" opacity="0.6"/>

  <!-- Star/sparkle -->
  <text x="140" y="120" font-size="28" fill="#B03028" font-family="serif" opacity="0.8">&#10022;</text>

  <!-- Day badge -->
  <rect x="140" y="148" width="110" height="30" rx="15" fill="#B03028"/>
  <text x="195" y="168" text-anchor="middle" font-size="12" fill="white" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="1">DAY 52 OF 365</text>

  <!-- Main heading -->
  <text x="140" y="290" font-size="82" fill="#3D1A24" font-family="Georgia, serif" font-weight="400">Petal &amp;</text>
  <text x="140" y="380" font-size="82" fill="#3D1A24" font-family="Georgia, serif" font-weight="400">Polish</text>

  <!-- Tagline -->
  <text x="140" y="435" font-size="24" fill="#7A4A56" font-family="system-ui, sans-serif" font-weight="400">Where Nails Become Art&#160;</text>

  <!-- Divider -->
  <line x1="140" y1="470" x2="420" y2="470" stroke="#E0CEC6" stroke-width="1.5"/>

  <!-- Features -->
  <text x="140" y="505" font-size="16" fill="#9E7350" font-family="system-ui, sans-serif">Gel · Acrylic · Nail Art · Pedicures · Non-Toxic</text>

  <!-- URL -->
  <text x="140" y="565" font-size="15" fill="#B03028" font-family="system-ui, sans-serif" font-weight="500">templates.allanninal.dev/nail-salon</text>
