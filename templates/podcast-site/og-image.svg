<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Grid background pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E8D5C0" stroke-width="0.4" opacity="0.08"/>
    </pattern>
    <!-- Gradient for waveform accent -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#E84040;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.3"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8D5C0"/>
      <stop offset="60%" style="stop-color:#F5C6C0"/>
      <stop offset="100%" style="stop-color:#E84040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1C1310"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#C0392B" opacity="0.7"/>

  <!-- Waveform decoration — bottom -->
  <g transform="translate(0, 530)" opacity="0.4">
    <rect x="80"  y="0"  width="8"  height="40" rx="2" fill="url(#waveGrad)"/>
    <rect x="100" y="10" width="8"  height="30" rx="2" fill="url(#waveGrad)"/>
    <rect x="120" y="5"  width="8"  height="45" rx="2" fill="url(#waveGrad)"/>
    <rect x="140" y="15" width="8"  height="25" rx="2" fill="url(#waveGrad)"/>
    <rect x="160" y="0"  width="8"  height="50" rx="2" fill="url(#waveGrad)"/>
    <rect x="180" y="8"  width="8"  height="35" rx="2" fill="url(#waveGrad)"/>
    <rect x="200" y="20" width="8"  height="20" rx="2" fill="url(#waveGrad)"/>
    <rect x="220" y="3"  width="8"  height="48" rx="2" fill="url(#waveGrad)"/>
    <rect x="240" y="12" width="8"  height="28" rx="2" fill="url(#waveGrad)"/>
    <rect x="260" y="0"  width="8"  height="50" rx="2" fill="url(#waveGrad)"/>
    <rect x="280" y="8"  width="8"  height="35" rx="2" fill="url(#waveGrad)"/>
    <rect x="300" y="18" width="8"  height="22" rx="2" fill="url(#waveGrad)"/>
    <rect x="320" y="5"  width="8"  height="40" rx="2" fill="url(#waveGrad)"/>
    <rect x="340" y="14" width="8"  height="28" rx="2" fill="url(#waveGrad)"/>
    <rect x="360" y="0"  width="8"  height="50" rx="2" fill="url(#waveGrad)"/>
    <rect x="380" y="22" width="8"  height="18" rx="2" fill="url(#waveGrad)"/>
    <rect x="400" y="6"  width="8"  height="44" rx="2" fill="url(#waveGrad)"/>
    <rect x="420" y="16" width="8"  height="24" rx="2" fill="url(#waveGrad)"/>
    <rect x="440" y="2"  width="8"  height="48" rx="2" fill="url(#waveGrad)"/>
    <rect x="460" y="10" width="8"  height="30" rx="2" fill="url(#waveGrad)"/>
    <rect x="480" y="0"  width="8"  height="50" rx="2" fill="url(#waveGrad)"/>
  </g>

  <!-- Microphone icon — large right side -->
  <g transform="translate(900, 180)" opacity="0.15">
    <rect x="100" y="20" width="80" height="160" rx="40" fill="#E8D5C0"/>
    <path d="M60 130 Q60 220 140 220 Q220 220 220 130" fill="none" stroke="#E8D5C0" stroke-width="12" stroke-linecap="round"/>
    <line x1="140" y1="220" x2="140" y2="270" stroke="#E8D5C0" stroke-width="10" stroke-linecap="round"/>
    <line x1="100" y1="270" x2="180" y2="270" stroke="#E8D5C0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Content area -->
  <!-- Podcast label -->
  <rect x="80" y="120" width="110" height="28" rx="2" fill="#C0392B" opacity="0.85"/>
  <text x="91" y="139" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#E8D5C0" letter-spacing="0.08em" text-transform="uppercase">PODCAST</text>

  <!-- Show name -->
  <text x="80" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" fill="url(#textGrad)" letter-spacing="-0.02em">The Deep</text>
  <text x="80" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" fill="url(#textGrad)" letter-spacing="-0.02em">Dive</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="-apple-system, system-ui, sans-serif" font-size="22" fill="#A89080" letter-spacing="0.01em">Conversations with builders, thinkers &amp; operators</text>

  <!-- Stats row -->
  <g transform="translate(80, 440)">
    <text x="0"   y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E8D5C0">187 Episodes</text>
    <text x="0"   y="40" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89080">Weekly since 2020</text>
    <text x="210" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E8D5C0">2.4M+ Downloads</text>
    <text x="210" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89080">~50K per episode</text>
    <text x="430" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E8D5C0">4.9★ on Apple</text>
    <text x="430" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89080">3,200+ reviews</text>
  </g>

  <!-- Bottom URL -->
  <text x="80" y="590" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#A89080" opacity="0.6">allanninal.dev/templates/podcast-site</text>
</svg>
