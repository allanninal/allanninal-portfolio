<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0A4A3A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#00E5A0" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#00E5A0" opacity="0.6"/>

  <!-- Cipher diamond icon (large, decorative) -->
  <polygon points="960,315 1100,180 1240,315 1100,450" stroke="#00E5A0" stroke-width="2" fill="none" opacity="0.15"/>
  <polygon points="960,315 1060,230 1160,315 1060,400" stroke="#00E5A0" stroke-width="1" fill="none" opacity="0.1"/>
  <circle cx="1100" cy="315" r="10" fill="#00E5A0" opacity="0.12"/>

  <!-- Small cipher icon -->
  <polygon points="72,56 92,76 72,96 52,76" stroke="#00E5A0" stroke-width="2" fill="none"/>
  <polygon points="72,62 86,76 72,90 58,76" stroke="#00E5A0" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="72" cy="76" r="3" fill="#00E5A0"/>

  <!-- Wordmark -->
  <text x="104" y="88" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#F0E6CF" letter-spacing="2">The Velvet Cipher</text>

  <!-- Eyebrow -->
  <text x="60" y="240" font-family="'Courier New', monospace" font-size="16" fill="#00E5A0" letter-spacing="5" font-weight="500">COCKTAIL LOUNGE  ·  LOWER EAST SIDE NYC</text>

  <!-- Main headline -->
  <text x="60" y="320" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F0E6CF" letter-spacing="-1">Drinks That</text>
  <text x="60" y="410" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F0E6CF" letter-spacing="-1">Demand an Alias.</text>

  <!-- Neon rule -->
  <line x1="60" y1="445" x2="340" y2="445" stroke="#00E5A0" stroke-width="2" opacity="0.7"/>

  <!-- Subline -->
  <text x="60" y="490" font-family="'Courier New', monospace" font-size="20" fill="#C8B99A">Signature cocktails · DJ sets · Speakeasy Lower East Side</text>

  <!-- Day badge -->
  <rect x="60" y="530" width="180" height="40" rx="2" fill="#0A4A3A" stroke="#00E5A0" stroke-width="1"/>
  <text x="150" y="555" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00E5A0" letter-spacing="2">DAY 44 OF 365</text>
</svg>
