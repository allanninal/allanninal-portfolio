<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative amber accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#92400E"/>

  <!-- Circuit/wiring motif (decorative, right side) -->
  <rect x="720" y="240" width="380" height="6" rx="3" fill="#F59E0B" opacity="0.12"/>
  <rect x="820" y="160" width="6" height="86" rx="3" fill="#F59E0B" opacity="0.10"/>
  <rect x="820" y="160" width="70" height="90" rx="5" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.12"/>
  <!-- Lightning bolt large -->
  <polygon points="1060,80 1030,170 1050,170 1040,260 1080,165 1060,165" fill="#F59E0B" opacity="0.14"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="12" fill="#27272A"/>
  <polygon points="117,92 101,121 109,121 108,140 121,113 113,113" fill="#F59E0B"/>

  <!-- Business name -->
  <text x="80" y="220" font-family="Archivo, system-ui, sans-serif" font-size="54" font-weight="800" fill="#FAFAF9" letter-spacing="-1">Voltage Masters Electric</text>

  <!-- Tagline -->
  <text x="80" y="278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="24" font-weight="400" fill="#A8A29E">Nashville's Trusted Master Electrician — Licensed, Insured &amp; 24/7</text>

  <!-- Divider line -->
  <rect x="80" y="310" width="120" height="3" rx="1.5" fill="#92400E"/>

  <!-- Service pills -->
  <rect x="80" y="340" width="190" height="38" rx="19" fill="#27272A"/>
  <text x="175" y="364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8A29E" text-anchor="middle">Panel Upgrades</text>

  <rect x="284" y="340" width="220" height="38" rx="19" fill="#27272A"/>
  <text x="394" y="364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8A29E" text-anchor="middle">EV Charger Install</text>

  <rect x="518" y="340" width="180" height="38" rx="19" fill="#27272A"/>
  <text x="608" y="364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8A29E" text-anchor="middle">24/7 Emergency</text>

  <rect x="712" y="340" width="150" height="38" rx="19" fill="#27272A"/>
  <text x="787" y="364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8A29E" text-anchor="middle">Safety Checks</text>

  <!-- Trust line -->
  <text x="80" y="440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="20" font-weight="600" fill="#57534E">TN Master Electrician License #ME-29518  ·  Licensed &amp; Insured  ·  Bonded</text>

  <!-- Phone CTA -->
  <rect x="80" y="470" width="320" height="56" rx="8" fill="#B91C1C"/>
  <text x="240" y="505" font-family="Archivo, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">(615) 555-0147</text>

  <!-- Day badge -->
  <rect x="80" y="560" width="130" height="32" rx="16" fill="#92400E"/>
  <text x="145" y="581" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Day 70 of 365</text>

  <text x="230" y="581" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#57534E">allanninal.dev/templates</text>
</svg>
