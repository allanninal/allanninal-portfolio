<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: espresso dark -->
  <rect width="1200" height="630" fill="#2E1A0E"/>

  <!-- Grain texture (simple noise pattern) -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.08"/>

  <!-- Left decorative area: large abstract coffee illustration -->
  <g transform="translate(80, 60)" opacity="0.15">
    <!-- Pour-over dripper -->
    <path d="M0 0 L280 0 L210 360 L70 360 Z" fill="#C9531F"/>
    <path d="M20 20 L260 20 L193 340 L87 340 Z" fill="#3D2314"/>
    <!-- Carafe -->
    <ellipse cx="140" cy="430" rx="110" ry="120" fill="#C9531F"/>
    <rect cx="110" cy="360" width="60" height="40" fill="#C9531F"/>
    <ellipse cx="140" cy="360" rx="45" ry="12" fill="#C9531F"/>
    <!-- Handle -->
    <path d="M250 380 Q300 380 300 430 Q300 480 250 480" stroke="#C9531F" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right decorative: latte art circle -->
  <circle cx="1050" cy="315" r="220" fill="#3D2314" opacity="0.3"/>
  <circle cx="1050" cy="315" r="180" fill="#5C3520" opacity="0.2"/>
  <!-- Tulip art suggestion -->
  <ellipse cx="1050" cy="350" rx="80" ry="55" fill="#D4B98A" opacity="0.12"/>
  <ellipse cx="1050" cy="300" rx="60" ry="42" fill="#D4B98A" opacity="0.10"/>
  <ellipse cx="1050" cy="258" rx="40" ry="30" fill="#D4B98A" opacity="0.08"/>

  <!-- Main content: left-aligned text block -->
  <!-- Eyebrow label -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="22" fill="#E8845A" font-weight="700" letter-spacing="4">SPECIALTY COFFEE · PORTLAND, OR</text>

  <!-- Main headline -->
  <text x="80" y="285" font-family="Georgia, serif" font-size="88" fill="#FAF5E8" font-weight="700">We open</text>
  <text x="80" y="385" font-family="Georgia, serif" font-size="88" fill="#FAF5E8" font-weight="700">at 7.</text>

  <!-- Tagline -->
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="24" fill="#D4B98A">Direct-trade beans · Roasted in-house · Daytime only</text>

  <!-- Site name -->
  <text x="80" y="530" font-family="Georgia, serif" font-size="32" fill="#C9531F" font-weight="700">Mansa Coffee</text>

  <!-- Divider -->
  <rect x="80" y="550" width="500" height="2" fill="#5C3520"/>

  <!-- URL -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="18" fill="#A89B8A">templates.allanninal.dev · Day 23 of 365</text>

  <!-- Small badge -->
  <rect x="1060" y="540" width="100" height="36" rx="6" fill="#C9531F"/>
  <text x="1110" y="563" font-family="Arial, sans-serif" font-size="14" fill="#FAF5E8" text-anchor="middle" font-weight="700">Free MIT</text>
</svg>
