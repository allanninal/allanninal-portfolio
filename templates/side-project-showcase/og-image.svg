<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E8DFD0" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Copper accent band (bottom) -->
  <rect y="570" width="1200" height="60" fill="#B5541C"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#B5541C"/>

  <!-- Name -->
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#1C1510">Mira Kovač</text>

  <!-- Subtitle -->
  <text x="80" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#7A6A5A">Side Projects</text>

  <!-- Project count -->
  <text x="80" y="380" font-family="ui-monospace, monospace" font-size="22" font-weight="500" fill="#B5541C">10 projects · Go · TypeScript · Postgres</text>

  <!-- Status badges -->
  <rect x="80" y="420" width="65" height="28" rx="14" fill="#D1FAE5"/>
  <text x="112" y="439" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Live</text>

  <rect x="158" y="420" width="82" height="28" rx="14" fill="#DBEAFE"/>
  <text x="199" y="439" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">Sold</text>

  <rect x="253" y="420" width="60" height="28" rx="14" fill="#EDE9FE"/>
  <text x="283" y="439" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">OSS</text>

  <rect x="326" y="420" width="60" height="28" rx="14" fill="#FEF3C7"/>
  <text x="356" y="439" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">WIP</text>

  <!-- GitHub handle in bottom band -->
  <text x="80" y="603" font-family="ui-monospace, monospace" font-size="20" font-weight="600" fill="#FDF0E8">@mirakovac</text>

  <!-- Template attribution -->
  <text x="1120" y="603" font-family="ui-monospace, monospace" font-size="16" fill="#FDF0E8" text-anchor="end" opacity="0.7">allanninal.dev/templates</text>
</svg>
