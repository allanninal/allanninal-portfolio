<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1A1A"/>

  <!-- Subtle grid pattern -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.05"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Color swatches — one per error page -->
  <rect x="0" y="580" width="300" height="50" fill="#1A1A1A"/>
  <rect x="300" y="580" width="300" height="50" fill="#FAF8F5"/>
  <rect x="600" y="580" width="300" height="50" fill="#FFFFFF"/>
  <rect x="900" y="580" width="300" height="50" fill="#F5F0E8"/>

  <!-- 404 preview -->
  <text x="100" y="290" font-family="system-ui, sans-serif" font-size="120" font-weight="800" fill="#EAB308" opacity="0.9">404</text>

  <!-- Divider -->
  <line x1="580" y1="80" x2="580" y2="520" stroke="#333333" stroke-width="1"/>

  <!-- Right side: pack info -->
  <text x="640" y="160" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#888888" letter-spacing="3">DAY 26 OF 365</text>
  <text x="640" y="230" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Error Pages</text>
  <text x="640" y="295" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Pack</text>

  <!-- Page list -->
  <text x="640" y="380" font-family="system-ui, sans-serif" font-size="18" fill="#EAB308">404 Not Found</text>
  <text x="640" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#B94A2C">500 Server Error</text>
  <text x="640" y="450" font-family="system-ui, sans-serif" font-size="18" fill="#475569">Maintenance</text>
  <text x="640" y="485" font-family="system-ui, sans-serif" font-size="18" fill="#78716C">Offline</text>

  <!-- Bottom brand -->
  <text x="640" y="556" font-family="system-ui, sans-serif" font-size="14" fill="#555555">templates.allanninal.dev · Free MIT License</text>
</svg>
