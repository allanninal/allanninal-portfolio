<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- Forest green top stripe -->
  <rect width="1200" height="14" fill="#1C4A2E"/>

  <!-- Eyebrow -->
  <text x="600" y="160" text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="22" font-weight="600" fill="#6B6B63"
    letter-spacing="6">
    SLOW DISPATCH
  </text>

  <!-- Title (italic Newsreader) -->
  <text x="600" y="290" text-anchor="middle"
    font-family="'Newsreader', Georgia, Cambria, serif"
    font-style="italic" font-size="78" font-weight="700" fill="#1A1A18"
    letter-spacing="-2">
    Long-form notes on
  </text>
  <text x="600" y="380" text-anchor="middle"
    font-family="'Newsreader', Georgia, Cambria, serif"
    font-style="italic" font-size="78" font-weight="700" fill="#1A1A18"
    letter-spacing="-2">
    building software, slowly.
  </text>

  <!-- Author -->
  <text x="600" y="490" text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="26" font-weight="500" fill="#6B6B63">
    by Allan Ninal
  </text>

  <!-- Bottom decorative dot -->
  <circle cx="600" cy="560" r="6" fill="#1C4A2E"/>
</svg>
