<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8E5DC"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A9E87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4D7A5C" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8C7B6A" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A9E87"/>
      <stop offset="100%" stop-color="#4D7A5C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative leaf shapes -->
  <ellipse cx="1050" cy="160" rx="280" ry="280" fill="url(#leaf1)" transform="rotate(25 1050 160)"/>
  <ellipse cx="900" cy="520" rx="200" ry="200" fill="url(#leaf2)" transform="rotate(-15 900 520)"/>
  <ellipse cx="150" cy="500" rx="160" ry="160" fill="url(#leaf1)" transform="rotate(10 150 500)"/>

  <!-- Brand mark circle -->
  <circle cx="140" cy="120" r="52" fill="url(#accent)"/>
  <text x="140" y="127" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">S&amp;S</text>

  <!-- Spa name -->
  <text x="212" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" fill="#2C2A27">Serenity &amp; Stone</text>
  <text x="214" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7A6E63" letter-spacing="3">DAY SPA · BROOKLYN, NY</text>

  <!-- Divider -->
  <rect x="140" y="188" width="920" height="1" fill="#D5CEC5"/>

  <!-- Hero headline -->
  <text x="140" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="600" fill="#2C2A27">Where stillness</text>
  <text x="140" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="600" font-style="italic" fill="#7A9E87">restores you.</text>

  <!-- Subtitle -->
  <text x="140" y="438" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7A6E63">Massage · Facials · Body Treatments · Infrared Sauna</text>

  <!-- Divider -->
  <rect x="140" y="476" width="920" height="1" fill="#D5CEC5"/>

  <!-- Stats row -->
  <text x="140" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#2C2A27">12+ Years</text>
  <text x="140" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A6E63" letter-spacing="1">IN BROOKLYN</text>

  <text x="380" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#2C2A27">7 Suites</text>
  <text x="380" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A6E63" letter-spacing="1">PRIVATE ROOMS</text>

  <text x="580" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#2C2A27">4,800+ Guests</text>
  <text x="580" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A6E63" letter-spacing="1">WELCOMED</text>

  <text x="840" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#2C2A27">4.9 ★</text>
  <text x="840" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A6E63" letter-spacing="1">AVERAGE RATING</text>

  <!-- Right accent bar -->
  <rect x="1140" y="0" width="60" height="630" fill="url(#accent)" opacity="0.7"/>
</svg>
