<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Teal accent bar top -->
  <rect x="60" y="60" width="120" height="4" rx="2" fill="#0D9488"/>

  <!-- Avatar initials circle -->
  <circle cx="120" cy="168" r="44" fill="#0D9488" opacity="0.2"/>
  <circle cx="120" cy="168" r="38" fill="#0D9488"/>
  <text x="120" y="176" text-anchor="middle" fill="#0B1120" font-family="system-ui, sans-serif" font-size="28" font-weight="700">A</text>

  <!-- Name + role -->
  <text x="186" y="158" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Allan Ninal</text>
  <text x="186" y="188" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="18">Solopreneur · Indie Maker · Builder</text>

  <!-- Main headline -->
  <text x="60" y="288" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Solopreneur Hub</text>

  <!-- Sub-headline -->
  <text x="60" y="348" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="26">Bio · Projects · Revenue · Newsletter · Contact</text>

  <!-- MRR badge -->
  <rect x="60" y="404" width="260" height="56" rx="28" fill="#134E4A"/>
  <circle cx="100" cy="432" r="6" fill="#34D399">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="118" y="437" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="16">Current MRR:</text>
  <text x="238" y="437" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$4,020</text>

  <!-- Day badge -->
  <rect x="60" y="480" width="180" height="40" rx="8" fill="#1F2937"/>
  <text x="88" y="505" fill="#0D9488" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Day 31 of 365</text>
  <rect x="68" y="492" width="4" height="16" rx="2" fill="#0D9488"/>

  <!-- Right side decoration: metrics grid -->
  <rect x="780" y="200" width="360" height="280" rx="16" fill="#1F2937" opacity="0.8"/>
  <text x="960" y="240" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">PUBLIC METRICS</text>

  <!-- Metric 1: MRR -->
  <text x="840" y="295" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">$4,020</text>
  <text x="840" y="318" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">MRR · +18% 30d</text>

  <!-- Metric 2: Users -->
  <text x="1000" y="295" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">1,540</text>
  <text x="1000" y="318" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">Customers</text>

  <!-- Divider -->
  <line x1="800" y1="340" x2="1120" y2="340" stroke="#374151" stroke-width="1"/>

  <!-- Metric 3: Products -->
  <text x="840" y="385" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">2</text>
  <text x="840" y="408" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">Live products</text>

  <!-- Metric 4: Churn -->
  <text x="1000" y="385" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">2.1%</text>
  <text x="1000" y="408" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">Churn rate</text>

  <!-- URL at bottom -->
  <text x="600" y="590" text-anchor="middle" fill="#4B5563" font-family="system-ui, sans-serif" font-size="15">allanninal.dev/templates/solopreneur-hub</text>

  <!-- Teal accent bar bottom -->
  <rect x="60" y="566" width="80" height="3" rx="1.5" fill="#0D9488" opacity="0.5"/>
</svg>
