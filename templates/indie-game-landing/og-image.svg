<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Lowtide — a game by Hollow Pine Games">
  <rect width="1200" height="630" fill="#0C1512"/>
  <text x="80" y="170" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="86" fill="#EDF2EE" letter-spacing="-2">Keep the light.</text>
  <text x="80" y="262" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="86" fill="#D69729" letter-spacing="-2">The water is not</text>
  <text x="80" y="354" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="86" fill="#D69729" letter-spacing="-2">going to stop.</text>
  <text x="80" y="418" font-family="ui-monospace, Menlo, monospace" font-size="21" fill="#7D948C" letter-spacing="3">LOWTIDE &#183; HOLLOW PINE GAMES &#183; BELLINGHAM, WA</text>
  <!-- The three facts, in the poster as in the hero. -->
  <g font-family="ui-monospace, Menlo, monospace">
    <rect x="80" y="470" width="300" height="3" fill="#D69729"/>
    <text x="80" y="500" font-size="17" fill="#7D948C">HOW LONG</text>
    <text x="80" y="542" font-size="40" fill="#EDF2EE">11 hours</text>
    <rect x="440" y="470" width="300" height="3" fill="#D69729"/>
    <text x="440" y="500" font-size="17" fill="#7D948C">HOW MUCH</text>
    <text x="440" y="542" font-size="40" fill="#EDF2EE">$19</text>
    <rect x="800" y="470" width="320" height="3" fill="#D69729"/>
    <text x="800" y="500" font-size="17" fill="#7D948C">AFTER LAUNCH</text>
    <text x="800" y="542" font-size="40" fill="#EDF2EE">Nothing</text>
  </g>
  <text x="80" y="596" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#7D948C">NO COMBAT &#183; NO FAIL STATE &#183; NO DLC</text>
</svg>
