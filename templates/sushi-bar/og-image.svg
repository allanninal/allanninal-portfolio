<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: sumi-ink black -->
  <rect width="1200" height="630" fill="#0F0E0B"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="0" x2="0" y2="630" stroke="rgba(247,245,240,0.03)" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="630" stroke="rgba(247,245,240,0.02)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="rgba(247,245,240,0.02)" stroke-width="1"/>

  <!-- Decorative kanji — large, faint -->
  <text x="900" y="480" font-family="serif" font-size="380" fill="rgba(247,245,240,0.04)" font-weight="300">花</text>

  <!-- Left accent bar (indigo) -->
  <rect x="80" y="200" width="2" height="230" fill="#3730A3" opacity="0.8"/>

  <!-- Restaurant name -->
  <text x="110" y="290" font-family="Georgia, serif" font-size="72" fill="#F7F5F0" font-weight="600" letter-spacing="-1">Hana Omakase</text>

  <!-- Japanese subtitle -->
  <text x="112" y="340" font-family="Georgia, serif" font-size="22" fill="rgba(247,245,240,0.35)" font-style="italic" letter-spacing="4">Omakase &amp; Sushi Bar</text>

  <!-- Thin rule -->
  <rect x="112" y="370" width="48" height="1" fill="#3730A3"/>

  <!-- Neighborhood + year -->
  <text x="112" y="400" font-family="sans-serif" font-size="16" fill="rgba(247,245,240,0.4)" letter-spacing="3">WEST VILLAGE, NEW YORK  ·  EST. 2018</text>

  <!-- Tagline -->
  <text x="112" y="440" font-family="Georgia, serif" font-size="20" fill="rgba(247,245,240,0.6)">12 seats · 12 courses · one chef</text>
</svg>
