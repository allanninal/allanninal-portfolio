<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- Sage accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#4A6741"/>

  <!-- Honey highlight band -->
  <rect x="80" y="80" width="520" height="6" rx="3" fill="#F5E6C8"/>

  <!-- Name -->
  <text x="80" y="160" font-family="Raleway, sans-serif" font-weight="800" font-size="64" fill="#1C1F1A">Jordan Steele</text>

  <!-- Role -->
  <text x="80" y="220" font-family="Nunito, sans-serif" font-weight="600" font-size="28" fill="#4A6741">Executive Coach for Engineering Leaders</text>

  <!-- Tagline -->
  <text x="80" y="290" font-family="Nunito, sans-serif" font-weight="400" font-size="22" fill="#5C6359">ICF-ACC Certified · 47 clients promoted to VP or Director</text>

  <!-- Divider -->
  <line x1="80" y1="340" x2="560" y2="340" stroke="#D4D1CA" stroke-width="1"/>

  <!-- Stats row -->
  <text x="80" y="400" font-family="Raleway, sans-serif" font-weight="800" font-size="36" fill="#4A6741">47</text>
  <text x="80" y="428" font-family="Nunito, sans-serif" font-size="14" fill="#5C6359">VP promotions</text>

  <text x="220" y="400" font-family="Raleway, sans-serif" font-weight="800" font-size="36" fill="#4A6741">91%</text>
  <text x="220" y="428" font-family="Nunito, sans-serif" font-size="14" fill="#5C6359">client renewal</text>

  <text x="380" y="400" font-family="Raleway, sans-serif" font-weight="800" font-size="36" fill="#4A6741">$2.4M</text>
  <text x="380" y="428" font-family="Nunito, sans-serif" font-size="14" fill="#5C6359">raised by clients</text>

  <!-- CTA box -->
  <rect x="80" y="490" width="280" height="64" rx="8" fill="#4A6741"/>
  <text x="220" y="530" font-family="Raleway, sans-serif" font-weight="700" font-size="20" fill="#FAFAF7" text-anchor="middle">Book a Free Call →</text>

  <!-- Right side avatar placeholder -->
  <rect x="800" y="80" width="320" height="380" rx="20" fill="#E1EAE0"/>
  <text x="960" y="290" font-family="Raleway, sans-serif" font-weight="800" font-size="80" fill="#4A6741" text-anchor="middle">JS</text>

  <!-- Domain -->
  <text x="80" y="600" font-family="Nunito, sans-serif" font-size="16" fill="#9BA29A">jordansteele.coach</text>
</svg>
