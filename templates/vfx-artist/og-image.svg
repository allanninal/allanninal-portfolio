<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Idris Falk — VFX artist, Reno">
  <rect width="1200" height="630" fill="#F1F1F3"/>
  <text x="80" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="72" fill="#17181C" letter-spacing="-2">You have already seen</text>
  <text x="80" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="72" fill="#17181C" letter-spacing="-2">my best work.</text>
  <text x="80" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="44" fill="#C32036" letter-spacing="-1">You did not notice it.</text>
  <text x="80" y="392" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#636370" letter-spacing="3">IDRIS FALK &#183; VFX ARTIST &#183; RENO, NV</text>
  <!-- Nine bars, one per invisible category, at their hour counts. -->
  <g>
    <rect x="80" y="452" width="245" height="14" fill="#17181C"/>
    <rect x="80" y="472" width="165" height="14" fill="#17181C"/>
    <rect x="80" y="492" width="309" height="14" fill="#17181C"/>
    <rect x="80" y="512" width="144" height="14" fill="#17181C"/>
    <rect x="80" y="532" width="181" height="14" fill="#17181C"/>
    <rect x="80" y="552" width="117" height="14" fill="#17181C"/>
    <rect x="620" y="452" width="101" height="14" fill="#17181C"/>
    <rect x="620" y="472" width="218" height="14" fill="#17181C"/>
    <rect x="620" y="492" width="154" height="14" fill="#17181C"/>
  </g>
  <text x="620" y="546" font-family="ui-monospace, Menlo, monospace" font-size="34" fill="#C32036">307 HOURS</text>
  <text x="620" y="578" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#636370">155 SHOTS &#183; NONE ON A REEL</text>
</svg>
