<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: ivory -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- Decorative mauve circle top-right -->
  <circle cx="1050" cy="80" r="300" fill="rgba(200,167,201,0.15)"/>

  <!-- Decorative champagne circle bottom-left -->
  <circle cx="150" cy="580" r="250" fill="rgba(240,222,180,0.18)"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="3" height="120" fill="#C8A7C9"/>

  <!-- Salon name — display serif style -->
  <text x="110" y="185" font-family="Georgia, serif" font-size="72" fill="#2C1810" letter-spacing="4">Maison Lumière</text>

  <!-- Tagline -->
  <text x="112" y="234" font-family="Georgia, serif" font-size="26" fill="#9D6B9E" letter-spacing="8" font-style="italic">Hair As Art</text>

  <!-- Description -->
  <text x="112" y="296" font-family="Arial, sans-serif" font-size="20" fill="#6B4A3A" letter-spacing="2">Precision cuts · Colour · Balayage · Styling</text>

  <!-- Bottom CTA -->
  <rect x="112" y="340" width="220" height="48" fill="#2C1810"/>
  <text x="222" y="370" font-family="Arial, sans-serif" font-size="14" fill="#FAFAF7" text-anchor="middle" letter-spacing="3">BOOK NOW</text>

  <!-- Right decorative element - abstract hair strands -->
  <g opacity="0.25">
    <path d="M820 0 C820 200 1100 250 1080 630" stroke="#C8A7C9" stroke-width="3" fill="none"/>
    <path d="M880 0 C860 220 1140 280 1120 630" stroke="#C8A7C9" stroke-width="2" fill="none"/>
    <path d="M940 0 C920 180 1180 240 1160 630" stroke="#C49828" stroke-width="2" fill="none"/>
    <path d="M780 0 C800 150 1060 200 1040 630" stroke="#C8A7C9" stroke-width="4" fill="none"/>
  </g>

  <!-- Day badge -->
  <rect x="1040" y="560" width="120" height="32" fill="#2C1810"/>
  <text x="1100" y="580" font-family="Arial, sans-serif" font-size="11" fill="#FAFAF7" text-anchor="middle" letter-spacing="2">DAY 50 / 365</text>

  <!-- Location -->
  <text x="112" y="430" font-family="Arial, sans-serif" font-size="15" fill="#9A8070" letter-spacing="2">New York City · Est. 2013</text>

  <!-- Service highlights -->
  <text x="112" y="490" font-family="Arial, sans-serif" font-size="13" fill="#6B4A3A" letter-spacing="1">✓ Expert Stylists  ·  ✓ Online Booking  ·  ✓ Free Consultation</text>
</svg>
