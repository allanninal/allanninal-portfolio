<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181A"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
