  <text x="173" y="332" font-family="Asap, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16181A" text-anchor="middle">Hail &amp; Wind Damage</text>

  <rect x="278" y="306" width="176" height="40" rx="20" fill="none" stroke="#3A4049" stroke-width="1.5"/>
  <text x="366" y="332" font-family="Asap, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C9CED6" text-anchor="middle">Roof Replacement</text>

  <rect x="466" y="306" width="146" height="40" rx="20" fill="none" stroke="#3A4049" stroke-width="1.5"/>
  <text x="539" y="332" font-family="Asap, system-ui, sans-serif" font-size="15" font-weight="600" fill="#C9CED6" text-anchor="middle">Roof Repair</text>

