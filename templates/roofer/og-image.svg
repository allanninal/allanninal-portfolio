  <line x1="80" y1="524" x2="1120" y2="524" stroke="#2B3038" stroke-width="1.5"/>

  <rect x="80" y="548" width="132" height="34" rx="17" fill="#C2410C"/>
  <text x="146" y="570" font-family="Asap, system-ui, sans-serif" font-size="14" font-weight="700" fill="#16181A" text-anchor="middle">Day 72 of 365</text>

  <text x="1120" y="571" font-family="Asap, system-ui, sans-serif" font-size="15" font-weight="500" fill="#848C99" text-anchor="end">allanninal.dev/templates  ·  Free MIT Template</text>
