  <text x="80" y="222" font-family="Roboto Slab, Georgia, serif" font-size="58" font-weight="800" fill="#F2F3F5">Ridgeline Roofing Co.</text>

  <!-- Tagline -->
  <text x="80" y="268" font-family="Asap, system-ui, sans-serif" font-size="23" font-weight="500" fill="#A5ABB5">Oklahoma City Roofing — Free Inspections, Insurance Claims Handled</text>

