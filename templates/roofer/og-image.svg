  <path d="M96,124 L112,106 L128,124" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100,124 L112,110 L124,124 L124,132 L100,132 Z" fill="#C2410C" opacity="0.9"/>

