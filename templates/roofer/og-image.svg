  <!-- Decorative: two pitches meeting at a ridge, kept clear of the type block -->
  <path d="M742,300 L940,196 L1138,300" fill="none" stroke="#E0754A" stroke-width="3" opacity="0.20"/>
  <path d="M760,312 L940,218 L940,232 L784,318 Z" fill="#E0754A" opacity="0.14"/>
  <path d="M784,338 L940,252 L940,266 L808,344 Z" fill="#E0754A" opacity="0.11"/>
