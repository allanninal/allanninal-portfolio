  <circle cx="880" cy="86"  r="5" fill="#E0754A" opacity="0.15"/>
  <circle cx="1020" cy="112" r="6" fill="#E0754A" opacity="0.17"/>
  <circle cx="1108" cy="74"  r="4" fill="#E0754A" opacity="0.13"/>

