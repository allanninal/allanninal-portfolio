<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: talavera teal -->
  <rect width="1200" height="630" fill="#006D6A"/>

  <!-- Decorative tile border top -->
  <rect x="0" y="0" width="1200" height="10" fill="#C94D2A"/>
  <rect x="0" y="10" width="1200" height="10" fill="#F5A623"/>
  <rect x="0" y="20" width="1200" height="10" fill="#006D6A"/>

  <!-- Decorative tile border bottom -->
  <rect x="0" y="600" width="1200" height="10" fill="#006D6A"/>
  <rect x="0" y="610" width="1200" height="10" fill="#F5A623"/>
  <rect x="0" y="620" width="1200" height="10" fill="#C94D2A"/>

  <!-- Background pattern circles -->
  <circle cx="200" cy="300" r="300" fill="rgba(245, 166, 35, 0.07)"/>
  <circle cx="1050" cy="150" r="250" fill="rgba(201, 77, 42, 0.07)"/>

  <!-- Main restaurant name -->
  <text x="100" y="240" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="#FDF8F0" letter-spacing="-2">La Milpa</text>

  <!-- Tagline -->
  <text x="100" y="310" font-family="Georgia, serif" font-size="42" fill="#F5A623" font-weight="400">Taqueria &amp; Antojitos</text>

  <!-- Description -->
  <text x="100" y="380" font-family="sans-serif" font-size="24" fill="rgba(253, 248, 240, 0.75)">Oaxacan &amp; Michoacán tradition · San Antonio, TX · Est. 2009</text>

  <!-- Feature pills -->
  <rect x="100" y="420" width="200" height="44" rx="22" fill="rgba(201, 77, 42, 0.8)"/>
  <text x="200" y="448" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FDF8F0">Tacos</text>

  <rect x="316" y="420" width="220" height="44" rx="22" fill="rgba(201, 77, 42, 0.8)"/>
  <text x="426" y="448" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FDF8F0">Antojitos</text>

  <rect x="552" y="420" width="220" height="44" rx="22" fill="rgba(201, 77, 42, 0.8)"/>
  <text x="662" y="448" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FDF8F0">Margaritas</text>

  <rect x="788" y="420" width="200" height="44" rx="22" fill="rgba(201, 77, 42, 0.8)"/>
  <text x="888" y="448" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FDF8F0">Mole Negro</text>

  <!-- Bottom byline -->
  <text x="100" y="555" font-family="sans-serif" font-size="18" fill="rgba(253, 248, 240, 0.5)">Free Astro template · Day 34 of 365 · allanninal.dev/templates</text>
</svg>
