<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Dara Okonkwo — motion design, Lincoln">
  <rect width="1200" height="630" fill="#121016"/>
  <text x="80" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="74" fill="#EDEAF2" letter-spacing="-2">A change is not a change.</text>
  <text x="80" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="74" fill="#B063F2" letter-spacing="-2">It is a stage.</text>
  <text x="80" y="288" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#90839D" letter-spacing="3">DARA OKONKWO &#183; MOTION DESIGN &#183; LINCOLN, NE</text>
  <!-- The same six numbers the page tabulates: hours to make one change, by stage. -->
  <g>
    <path d="M80.0,578.0 L248.0,537.7 L416.0,497.4 L584.0,457.1 L752.0,403.9 L920.0,353.0" fill="none" stroke="#B063F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80.0" cy="578.0" r="6" fill="#5FD08A"/>
    <circle cx="248.0" cy="537.7" r="6" fill="#5FD08A"/>
    <circle cx="416.0" cy="497.4" r="6" fill="#5FD08A"/>
    <circle cx="584.0" cy="457.1" r="6" fill="#5FD08A"/>
    <circle cx="752.0" cy="403.9" r="6" fill="#F4855F"/>
    <circle cx="920.0" cy="353.0" r="9" fill="#F4855F"/>
    <text x="80.0" y="558.0" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#5FD08A">1h</text>
    <text x="248.0" y="517.7" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#5FD08A">2h</text>
    <text x="416.0" y="477.4" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#5FD08A">4h</text>
    <text x="584.0" y="437.1" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#5FD08A">8h</text>
    <text x="752.0" y="383.9" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#F4855F">20h</text>
    <text x="920.0" y="333.0" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#F4855F">48h</text>
  </g>
  <text x="640" y="612" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#90839D">SAME REQUEST &#183; SIX STAGES &#183; 48&#215;</text>
</svg>
