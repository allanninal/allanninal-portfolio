<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #111111; }
      .muted { fill: #555555; }
      .rule { stroke: #111111; stroke-width: 2; }
      .tag { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .label { font-size: 20px; letter-spacing: 0.18em; font-weight: 600; }
      .h1 { font-size: 84px; font-weight: 800; letter-spacing: -0.02em; }
      .lede { font-size: 26px; font-weight: 400; }
      .foot { font-size: 22px; font-weight: 600; }
      .foot-r { font-size: 22px; font-weight: 400; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <!-- Top hairline -->
  <line class="rule" x1="80" y1="80" x2="1120" y2="80"/>

  <!-- Series tag -->
  <rect class="tag" x="80" y="110" width="260" height="50"/>
  <text class="font-sans label ink" x="100" y="143">SERIES · 7 PARTS</text>

  <!-- Hero title -->
  <text class="font-sans h1 ink" x="80" y="288">Website chat</text>
  <text class="font-sans h1 ink" x="80" y="384">assistant on AWS</text>

  <!-- Lede -->
  <text class="font-sans lede muted" x="80" y="438">Answers visitors from your knowledge in real time,</text>
  <text class="font-sans lede muted" x="80" y="474">hands the rest to a human, learns from every miss.</text>

  <!-- Footer rule -->
  <line class="rule" x1="80" y1="540" x2="1120" y2="540"/>

  <!-- Footer -->
  <text class="font-sans foot ink" x="80" y="578">allanninal.dev/build</text>
  <text class="font-sans foot-r muted" x="1120" y="578" text-anchor="end">Allan Niñal</text>
</svg>
