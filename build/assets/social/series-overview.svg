<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1750" width="1200" height="1750">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #111111; }
      .muted { fill: #555555; }
      .rule { stroke: #111111; stroke-width: 2; }
      .hair { stroke: #d8d8d8; stroke-width: 1; }
      .box { fill: none; stroke: #111111; stroke-width: 2; }
      .box-fill { fill: #111111; stroke: #111111; stroke-width: 2; }
      .tag { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .label { font-size: 20px; letter-spacing: 0.18em; font-weight: 600; }
      .h1 { font-size: 96px; font-weight: 800; letter-spacing: -0.02em; }
      .lede { font-size: 30px; font-weight: 400; }
      .card-num { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; }
      .card-num-new { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; fill: #ffffff; }
      .card-title { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; }
      .card-title-new { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; fill: #ffffff; }
      .card-body { font-size: 22px; font-weight: 400; }
      .card-body-new { font-size: 22px; font-weight: 400; fill: #d8d8d8; }
      .card-meta { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; }
      .card-meta-new { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; fill: #ffffff; }
      .foot { font-size: 22px; font-weight: 600; }
      .foot-r { font-size: 22px; font-weight: 400; }
      .ribbon { fill: #111111; }
      .ribbon-text { font-size: 26px; font-weight: 800; letter-spacing: 0.14em; fill: #ffffff; }
      .cta-title { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
      .cta-body { font-size: 22px; font-weight: 400; }
      .cta-meta { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="1750"/>

  <!-- Top hairline -->
  <line class="rule" x1="80" y1="80" x2="1120" y2="80"/>

  <!-- Brand label tag -->
  <rect class="tag" x="80" y="110" width="540" height="50"/>
  <text class="font-sans label ink" x="100" y="143">BUILD · DIAGRAMS OF SMALL CLOUD SYSTEMS</text>

  <!-- Hero -->
  <text class="font-sans h1 ink" x="80" y="270">7 small cloud</text>
  <text class="font-sans h1 ink" x="80" y="370">systems. One</text>
  <text class="font-sans h1 ink" x="80" y="470">diagram each.</text>

  <text class="font-sans lede muted" x="80" y="540">Design walkthroughs of automations on AWS — drawn end-to-end.</text>

  <!-- Cadence ribbon -->
  <rect class="ribbon" x="80" y="580" width="640" height="50"/>
  <text class="font-sans ribbon-text" x="100" y="613">NEW · WEBSITE CHAT ASSISTANT</text>

  <!-- Hairline -->
  <line class="hair" x1="80" y1="655" x2="1120" y2="655"/>

  <!-- Cards: 2 columns x 4 rows -->
  <!-- Geometry: x=80/620, y=680/940/1200/1460 ; w=500 h=220 -->

  <!-- Row 1 -->
  <!-- Card 1: Website chat assistant (NEW — inverted) -->
  <rect class="box-fill" x="80" y="680" width="500" height="220"/>
  <text class="font-sans card-num-new" x="100" y="720">01 · NEW</text>
  <text class="font-sans card-title-new" x="100" y="762">Website chat assistant</text>
  <text class="font-sans card-body-new" x="100" y="800">Answers visitors from your knowledge</text>
  <text class="font-sans card-body-new" x="100" y="828">in real time, hands the rest to a human,</text>
  <text class="font-sans card-body-new" x="100" y="856">learns from every miss.</text>
  <text class="font-sans card-meta-new" x="100" y="888">7 PARTS · ~$ A COFFEE / MONTH</text>

  <!-- Card 2: Booking assistant -->
  <rect class="box" x="620" y="680" width="500" height="220"/>
  <text class="font-sans card-num muted" x="640" y="720">02</text>
  <text class="font-sans card-title ink" x="640" y="762">Booking assistant</text>
  <text class="font-sans card-body muted" x="640" y="800">Reads requests, checks your calendar,</text>
  <text class="font-sans card-body muted" x="640" y="828">proposes slots that respect your rules,</text>
  <text class="font-sans card-body muted" x="640" y="856">locks in the customer's pick.</text>
  <text class="font-sans card-meta ink" x="640" y="888">7 PARTS · ~$ A COFFEE / MONTH</text>

  <!-- Row 2 -->
  <!-- Card 3: Email assistant -->
  <rect class="box" x="80" y="940" width="500" height="220"/>
  <text class="font-sans card-num muted" x="100" y="980">03</text>
  <text class="font-sans card-title ink" x="100" y="1022">Email assistant</text>
  <text class="font-sans card-body muted" x="100" y="1060">Reads your inbox, drafts replies from</text>
  <text class="font-sans card-body muted" x="100" y="1088">your own knowledge file, escalates</text>
  <text class="font-sans card-body muted" x="100" y="1116">anything beyond its remit to a human.</text>
  <text class="font-sans card-meta ink" x="100" y="1148">7 PARTS · ~$ A COFFEE / MONTH</text>

  <!-- Card 4: Voice agent -->
  <rect class="box" x="620" y="940" width="500" height="220"/>
  <text class="font-sans card-num muted" x="640" y="980">04</text>
  <text class="font-sans card-title ink" x="640" y="1022">Voice agent</text>
  <text class="font-sans card-body muted" x="640" y="1060">Picks up a call, listens, decides what</text>
  <text class="font-sans card-body muted" x="640" y="1088">to do, and speaks naturally — without</text>
  <text class="font-sans card-body muted" x="640" y="1116">making things up.</text>
  <text class="font-sans card-meta ink" x="640" y="1148">7 PARTS · PER-MINUTE PRICING</text>

  <!-- Row 3 -->
  <!-- Card 5: Document pipeline -->
  <rect class="box" x="80" y="1200" width="500" height="220"/>
  <text class="font-sans card-num muted" x="100" y="1240">05</text>
  <text class="font-sans card-title ink" x="100" y="1282">Document pipeline</text>
  <text class="font-sans card-body muted" x="100" y="1320">Ingests files, extracts the fields you</text>
  <text class="font-sans card-body muted" x="100" y="1348">care about, and answers questions</text>
  <text class="font-sans card-body muted" x="100" y="1376">grounded in the source.</text>
  <text class="font-sans card-meta ink" x="100" y="1408">7 PARTS · CENTS PER DOCUMENT</text>

  <!-- Card 6: Daily briefing bot -->
  <rect class="box" x="620" y="1200" width="500" height="220"/>
  <text class="font-sans card-num muted" x="640" y="1240">06</text>
  <text class="font-sans card-title ink" x="640" y="1282">Daily briefing bot</text>
  <text class="font-sans card-body muted" x="640" y="1320">Walks your sources, picks what</text>
  <text class="font-sans card-body muted" x="640" y="1348">matters, and delivers a tight digest</text>
  <text class="font-sans card-body muted" x="640" y="1376">on a schedule you control.</text>
  <text class="font-sans card-meta ink" x="640" y="1408">7 PARTS · ~$ A COFFEE / MONTH</text>

  <!-- Row 4 -->
  <!-- Card 7: AWS autoposting -->
  <rect class="box" x="80" y="1460" width="500" height="220"/>
  <text class="font-sans card-num muted" x="100" y="1500">07</text>
  <text class="font-sans card-title ink" x="100" y="1542">AWS autoposting</text>
  <text class="font-sans card-body muted" x="100" y="1580">A scheduled Facebook poster that</text>
  <text class="font-sans card-body muted" x="100" y="1608">stays on-topic and answers from a</text>
  <text class="font-sans card-body muted" x="100" y="1636">Drive knowledge base.</text>
  <text class="font-sans card-meta ink" x="100" y="1668">OVERVIEW · FACEBOOK PIPELINE</text>

  <!-- Card 8: CTA -->
  <rect class="box" x="620" y="1460" width="500" height="220"/>
  <text class="font-sans card-num muted" x="640" y="1500">→</text>
  <text class="font-sans cta-title ink" x="640" y="1542">Want one of these for</text>
  <text class="font-sans cta-title ink" x="640" y="1576">your business?</text>
  <text class="font-sans cta-body muted" x="640" y="1614">Open to design reviews, builds,</text>
  <text class="font-sans cta-body muted" x="640" y="1642">and collabs. Drop me a line.</text>
  <text class="font-sans cta-meta ink" x="640" y="1668">BUILD.ALLANNINAL.DEV</text>

  <!-- Footer rule -->
  <line class="rule" x1="80" y1="1700" x2="1120" y2="1700"/>

  <!-- Footer -->
  <text class="font-sans foot ink" x="80" y="1733">allanninal.dev/build</text>
  <text class="font-sans foot-r muted" x="1120" y="1733" text-anchor="end">Allan Niñal · open to builds, collabs, design reviews</text>
</svg>
