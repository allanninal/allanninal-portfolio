<svg width="940" height="702" class="diagram" data-gen="1" viewBox="0 0 940 702" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-t d4-d"><title id="d4-t">Daily briefing bot: the preview flow</title><desc id="d4-d">A vertical flow for the Daily briefing bot preview port. It begins at Nightly 02:00, reads an intake sheet in Google Sheets, makes one OpenAI call per item, works out the answer as arithmetic, branches, appends a row to a Google Sheets tab standing in for each DynamoDB table, and sends the result by Gmail. The steps needing credentials are marked.</desc><defs><marker id="d4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b8199"/></marker></defs><rect x="0" y="0" width="940" height="702" fill="#16212f"/><rect x="184" y="40" width="740" height="612" rx="10" fill="none" stroke="#37506b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="202" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#8d99a8" letter-spacing="1.6">THE SAME SHAPE ON N8N AND ON MAKE</text><rect x="12" y="82" width="152" height="66" rx="6" fill="#1a2634" stroke="#3f5169" stroke-width="1.5"/><line x1="16" y1="84" x2="160" y2="84" stroke="#E7157B" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(23.0,95.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#E7157B"/><g transform="scale(0.9167)"><circle cx="12" cy="12" r="9.2" fill="#fff"/><path d="M12 6.5V12l4 2.2" stroke="#E7157B" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><text x="108" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Nightly 02:00</text><text x="108" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">scheduled</text><text x="108" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">nightly or monthly</text><line x1="168" y1="115" x2="200" y2="111" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="206" y="78" width="260" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="210" y1="80" x2="462" y2="80" stroke="#DD344C" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(217.0,91.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#DD344C"/><g transform="scale(0.9167)"><rect x="3.5" y="2.5" width="17" height="19" rx="2" fill="#fff"/><path d="M7.5 7.5h9M7.5 11.5h9M7.5 15.5h5" stroke="#DD344C" stroke-width="1.8" stroke-linecap="round"/></g></g><text x="356" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Watch the intake</text><text x="356" y="117" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">Google Sheets</text><text x="356" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">SPREADSHEET_ID</text><rect x="510" y="78" width="196" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="514" y1="80" x2="702" y2="80" stroke="#DD344C" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(521.0,91.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#DD344C"/><g transform="scale(0.9167)"><circle cx="8" cy="8" r="5" fill="#fff"/><circle cx="8" cy="8" r="1.8" fill="#DD344C"/><path d="m11.6 11.6 8 8M17 16l2.4-2.4M14.4 13.4 16.8 11" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/></g></g><text x="628" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Needs</text><text x="628" y="117" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">a Google account</text><text x="628" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">connection</text><line x1="505" y1="111" x2="471" y2="111" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="206" y="176" width="260" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="210" y1="178" x2="462" y2="178" stroke="#01A88D" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(217.0,189.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#01A88D"/><g transform="scale(0.9167)"><path d="M12 3a5 5 0 0 1 4.6 3A4.4 4.4 0 0 1 18 14.6V16a4 4 0 0 1-6 3.5A4 4 0 0 1 6 16v-1.4A4.4 4.4 0 0 1 7.4 6 5 5 0 0 1 12 3Z" fill="#fff"/><path d="M12 7v10M9.5 10.5h5M9.5 14h5" stroke="#01A88D" stroke-width="1.5" stroke-linecap="round"/></g></g><text x="356" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Read one item</text><text x="356" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">OpenAI -- the one</text><text x="356" y="231" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">model call</text><line x1="336" y1="147" x2="336" y2="171" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="510" y="176" width="196" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="514" y1="178" x2="702" y2="178" stroke="#DD344C" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(521.0,189.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#DD344C"/><g transform="scale(0.9167)"><circle cx="8" cy="8" r="5" fill="#fff"/><circle cx="8" cy="8" r="1.8" fill="#DD344C"/><path d="m11.6 11.6 8 8M17 16l2.4-2.4M14.4 13.4 16.8 11" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/></g></g><text x="628" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Needs</text><text x="628" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">an OpenAI API key</text><text x="628" y="231" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">gpt-4o-mini</text><line x1="505" y1="209" x2="471" y2="209" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="206" y="274" width="260" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="210" y1="276" x2="462" y2="276" stroke="#8C4FFF" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(217.0,287.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#8C4FFF"/><g transform="scale(0.9167)"><rect x="3" y="3" width="18" height="18" rx="3.4" fill="#fff"/><path d="M7.6 15.8V8.6M12 15.8v-4.4M16.4 15.8V6.4" stroke="#8C4FFF" stroke-width="2.6" stroke-linecap="round"/></g></g><text x="356" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Work out the answer</text><text x="356" y="313" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">arithmetic only --</text><text x="356" y="329" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">no model touches it</text><line x1="336" y1="245" x2="336" y2="269" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="206" y="372" width="260" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-width="1.5"/><line x1="210" y1="374" x2="462" y2="374" stroke="#E7157B" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(217.0,385.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#E7157B"/><g transform="scale(0.9167)"><path d="M12 2.2 21.8 12 12 21.8 2.2 12Z" fill="#fff"/><path d="M12 7.6v5.2" stroke="#E7157B" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.4" fill="#E7157B"/></g></g><text x="356" y="393" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Which route?</text><text x="356" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">the branch from</text><text x="356" y="427" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">the article</text><line x1="336" y1="343" x2="336" y2="367" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><rect x="754" y="372" width="170" height="66" rx="6" fill="#20303f" stroke="#3f5169" stroke-w