1="570" x2="702" y2="570" stroke="#DD344C" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(521.0,581.0)" aria-hidden="true"><rect width="22.0" height="22.0" rx="4.5" fill="#DD344C"/><g transform="scale(0.9167)"><circle cx="8" cy="8" r="5" fill="#fff"/><circle cx="8" cy="8" r="1.8" fill="#DD344C"/><path d="m11.6 11.6 8 8M17 16l2.4-2.4M14.4 13.4 16.8 11" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/></g></g><text x="628" y="589" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Needs</text><text x="628" y="607" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">a Gmail</text><text x="628" y="623" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c4">connection</text><line x1="505" y1="601" x2="471" y2="601" stroke="#6b8199" stroke-width="1.9" stroke-linecap="round" marker-end="url(#d4-ar)"/><text x="470" y="690" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c4" font-style="italic">Replace SPREADSHEET_ID and the recipient before the first run. Credentials are deliberately absent: the import will prompt.</text></svg>