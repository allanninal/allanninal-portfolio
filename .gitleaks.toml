# gitleaks configuration for allanninal.dev
#
# Extends the default rule set and adds one path allowlist. It does not redefine
# any rule.

[extend]
useDefault = true

[allowlist]
description = "Field-notes research files are provider documentation, not credentials"
# These files enumerate API problems per provider, so they are dense with model
# identifiers, header names and error codes. Public model ids such as
# claude-3-5-sonnet-20240620 are long hyphenated high-entropy strings and trip
# the generic-api-key heuristic. Every script in these sections reads its key
# from the environment; no credential is checked in anywhere in this repo.
paths = ['''tools/fieldnotes/[a-z]+/research\.md''']

# Test fixtures in the /slack/ field notes. These are the placeholder tokens the
# example test suites assert on: xapp-1-A01-99-abc, xoxb-1-abc, xoxe-1-abc and
# friends. Every one is under 20 characters where a real Slack token runs to 50+,
# so none of them could authenticate anything. They are matched by literal shape
# rather than by path, so a real token pasted into the same file is still caught.
regexes = [
  '''x(?:app|ox[bpes])-(?:1-)?(?:A01-99-)?abc''',
  # An invented SHA-256 fingerprint in the /github/ App-key note's sample
  # output. A fingerprint is a one-way digest and cannot be turned back into a
  # key; this one was made up for the example, and no PEM body exists anywhere
  # in the repo. Matched as a literal so a real credential in the same file is
  # still caught.
  '''3f9a1c04e7b25d18''',
]
