<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: warm paper -->
  <rect width="1200" height="630" fill="#F8F6F1"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#2563EB"/>

  <!-- Avatar circle -->
  <circle cx="96" cy="160" r="56" fill="#2563EB"/>
  <text x="96" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF">AN</text>

  <!-- Name -->
  <text x="180" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#0F172A" letter-spacing="-2">Allan Ninal</text>

  <!-- Tagline -->
  <text x="180" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#64748B">Indie Hacker · Building micro-SaaS in public</text>

  <!-- Divider -->
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Revenue stat: MRR -->
  <text x="60" y="320" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="60" fill="#2563EB" letter-spacing="-2">$5,540</text>
  <text x="60" y="352" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="2">CURRENT MRR</text>

  <!-- Revenue stat: Lifetime -->
  <text x="380" y="320" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="60" fill="#0F172A" letter-spacing="-2">$142,000</text>
  <text x="380" y="352" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="2">LIFETIME REVENUE</text>

  <!-- Revenue stat: Users -->
  <text x="820" y="320" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="60" fill="#0F172A" letter-spacing="-2">2,800</text>
  <text x="820" y="352" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" letter-spacing="2">ACTIVE USERS</text>

  <!-- Divider -->
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Footer label -->
  <text x="60" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#64748B">5 products shipped · Building VaultNote · Ship It Weekly newsletter</text>

  <!-- Product badges -->
  <!-- FormCraft -->
  <rect x="60" y="475" width="120" height="28" rx="14" fill="#DCFCE7"/>
  <text x="120" y="494" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#15803D">FormCraft ●</text>

  <!-- PingAlert -->
  <rect x="192" y="475" width="120" height="28" rx="14" fill="#DCFCE7"/>
  <text x="252" y="494" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#15803D">PingAlert ●</text>

  <!-- DocuFlow -->
  <rect x="324" y="475" width="120" height="28" rx="14" fill="#DCFCE7"/>
  <text x="384" y="494" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#15803D">DocuFlow ●</text>

  <!-- ListPilot sunset -->
  <rect x="456" y="475" width="120" height="28" rx="14" fill="#FEF9C3"/>
  <text x="516" y="494" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#854D0E">ListPilot ○</text>

  <!-- ShipKit sold -->
  <rect x="588" y="475" width="110" height="28" rx="14" fill="#EFF6FF"/>
  <text x="643" y="494" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#1D4ED8">ShipKit →</text>

  <!-- Site URL bottom right -->
  <text x="1140" y="594" text-anchor="end" font-family="'Courier New', Courier, monospace" font-weight="400" font-size="16" fill="#94A3B8">templates.allanninal.dev/indie-hacker-portfolio/</text>
</svg>
