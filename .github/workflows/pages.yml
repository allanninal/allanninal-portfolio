# Publish the site with the Actions-based Pages build instead of the legacy one.
#
# The legacy build is capped at 10 minutes and started failing once the 142 download
# archives under templates/downloads/ were regenerated: two attempts both died at
# ~10m50s with a bare "Page build failed", leaving the site serving stale content
# while main was already several commits ahead. The Actions build has a far larger
# budget, so the archives can stay on the site rather than being deleted or moved.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a push is not dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site is pre-built and committed at the repo root, so there is nothing to
      # compile here — upload the checkout as-is. The action already excludes
      # .git and .github from the artifact.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
