# GitHub Pages (Jekyll) configuration.
# The homepage is a pre-built Astro site copied to the repo root, so Jekyll
# should NOT process the Astro source, and MUST publish the underscore-prefixed
# asset directory it would otherwise ignore.

# Publish the Astro asset directory (Jekyll skips underscore dirs by default).
include:
  - _astro

# Keep Jekyll away from the Astro source (its .astro front matter is not YAML)
# and other non-site files.
exclude:
  - redesign
  - README.md
  - ROADMAP.md
  - LICENSE
