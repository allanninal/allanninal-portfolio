version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - python3 -m pip install --upgrade pip
    build:
      - python3 -m pip install --no-cache-dir -r requirements.txt --target ./lib
run:
  command: python3 startup.py
  network:
    port: 8080
  env:
    - name: PYTHONPATH
      value: "/app/lib"
    - name: STREAMLIT_SERVER_HEADLESS
      value: "true"
    - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
      value: "false"
